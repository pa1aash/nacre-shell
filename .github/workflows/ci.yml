name: ci

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
      - name: Sync environment
        run: uv sync --frozen
      - name: Tests
        run: uv run pytest -q
      - name: Full-history scan
        run: uv run python tools/githooks/ci_scan.py
