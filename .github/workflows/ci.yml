name: ci

on:
  push:
    # Every lane and track branch runs the same tests and history scan as main.
    branches: ["main", "lane/**", "preprint/**"]
    tags: ["**"]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
      # Lane branches of the preprint track (preprint/p0-w1 ...) add dependencies of their own, so
      # their lock may lag until integration. The integrator branch and main keep the lock exact.
      - name: Sync environment (preprint lane branches)
        if: startsWith(github.ref_name, 'preprint/p0-')
        run: uv sync
      - name: Sync environment (locked)
        if: ${{ !startsWith(github.ref_name, 'preprint/p0-') }}
        run: uv sync --locked
      # Release figures are built on the Mac with Arial. The runner has no Arial, so it gets a
      # metric-compatible substitute before the figure tests.
      - name: Install figure font substitute
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fonts-liberation
          fc-cache -f
      - name: Tests
        run: uv run pytest -q
      - name: Full-history scan
        run: uv run python tools/githooks/ci_scan.py
