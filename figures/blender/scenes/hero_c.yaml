# Figure 1 hero, composition C: the oblique view of the day 2 draft, with the same fixes as A and B.
# Camera direction as in the day 2 draft.
# Illustrative construction (structures/preprint/hero_interface.extxyz). No text, labels or arrows.
name: hero_c
description: oblique view of the template-nucleus contact (day 2 framing, cleaned up)
resolution: [1400, 1050]   # below the 1600 px draft width: the 2 MB file cap
samples: 32
camera:
  direction: [0.18, 1.0, -0.38]   # day 2 oblique view
  up: [0.0, 0.0, 1.0]
  margin: 1.03
components:
  - file: structures/preprint/hero_interface.extxyz
    style: ball_and_stick
    include: [slab]
    clip: {box: [[2.5, 84.0], [2.5, 39.0]], seed_elements: [Al], attach: [O, H]}
  - file: structures/preprint/hero_interface.extxyz
    style: ball_and_stick
    include: [chain]
    bond_radius: 0.19
    clip: {box: [[0.0, 86.5], [0.0, 41.6]], molecules: true}
  - file: structures/preprint/hero_interface.extxyz
    style: ball_and_stick
    include: [bound, bridge, carbonate]
    clip: {box: [[0.0, 86.5], [0.0, 41.6]], molecules: true}
  - file: structures/preprint/hero_interface.extxyz
    style: ball_and_stick
    include: [nucleus]
    focus: true
  - file: structures/preprint/hero_interface.extxyz
    style: ball_and_stick
    include: [water]
    clip: {box: [[2.5, 84.0], [20.0, 39.0]], molecules: true}   # behind the plane through the lens axis (y = 20 A)
    fade: {reference: [slab, chain, nucleus, bound, bridge], near: 2.5, far: 7.0, alpha: 0.2}
drawing_choices:
  style: ball-and-stick for every species, atom radius 0.28 x van der Waals (ase.data), sticks 0.14 A (template 0.19 A)
  water_shell: water drawn only behind the plane through the lens axis and within 7 A of the slab, template, ions and nucleus; opacity 0.2 to 2.5 A, falling linearly to 0 at 7 A
  lighting: key, fill and rim rig of rig.py, nucleus rim light, shadow catcher, ambient occlusion and depth haze (rig.py docstring)
  mesh: spheres 24 x 12, sticks 12 segments (memory rule R10)
  camera: orthographic, the day 2 oblique direction
