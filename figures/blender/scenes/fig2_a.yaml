# Figure 2a render (slot of lane p0-w6's fig2.tex): the catechol layer on hydroxylated alumina displaces
# the interfacial water; bare oxide with its water on the left. Illustrative construction. No text.
name: fig2_a
description: catechol layer displacing interfacial water on hydroxylated alumina (illustrative)
resolution: [800, 800]
samples: 48
camera:
  direction: [0.15, 1.0, -0.5]
  up: [0.0, 0.0, 1.0]
  margin: 1.04
components:
  - file: structures/preprint/fig2a_interface.extxyz
    style: ball_and_stick
    include: [slab]
    clip: {box: [[2.5, 40.3], [2.0, 22.9]], seed_elements: [Al], attach: [O, H]}
  - file: structures/preprint/fig2a_interface.extxyz
    style: ball_and_stick
    include: [chain]
    bond_radius: 0.19
    clip: {box: [[0.0, 42.8], [0.0, 24.9]], molecules: true}
  - file: structures/preprint/fig2a_interface.extxyz
    style: ball_and_stick
    include: [water]
    clip: {box: [[2.5, 40.3], [2.0, 22.9]], molecules: true}
    fade: {reference: [slab, chain], near: 3.0, far: 7.0, alpha: 0.45}
drawing_choices:
  illustrative: an illustrative construction for a schematic figure panel, not a simulated structure
  style: ball-and-stick for every species, atom radius 0.28 x van der Waals (ase.data), sticks 0.14 A (template 0.19 A)
  lighting: key, fill and rim rig of rig.py, shadow catcher, ambient occlusion and depth haze (rig.py docstring)
  mesh: spheres 24 x 12, sticks 12 segments (memory rule R10)
  camera: orthographic, oblique (direction 0.15, 1, -0.5)
  water_shell: water within 7 A of the slab and template; opacity 0.45 to 3 A, falling linearly to 0 at 7 A
