# TikZ schematics built by `nacre figs` (nacre.figs.schematic). Paths are relative to figures/tikz.
#
# Schema per entry
#   tex        source file
#   engine     pdflatex | xelatex (latexmk -pdf | -xelatex)
#   out        output path relative to figures/out/ (PDF; a 600 dpi PNG and CVD simulations beside it)
#   width      single | double (RSC column); the page must be exactly that wide
#   text_free  true: the PDF must contain no text at all (R7 default schematics)
#   claim      the one physical claim the figure carries (R4)
#   caption    caption draft (identifies every state and mark by position)
#   source     where the depicted states and arrows are taken from
#   orthogonal_arrows  body file whose cycle arrows (style proc) must be horizontal/vertical chains
#   deliverable false: built only when named in `nacre figs --only` (kept buildable, not a paper figure)
schematics:
  fig2:
    tex: fig2.tex
    engine: pdflatex
    out: fig2.pdf
    width: double
    text_free: true
    claim: >-
      The coating can only act through a chain of interfacial steps: the catechol-bearing layer must displace
      interfacial water to adhere, binds a few Ca2+ at its sites without raising the bulk supersaturation, hosts
      an amorphous CaCO3 nucleus whose contact with the template sets the barrier, and the nuclei must
      coalesce into a continuous film.
    caption: figures/src/captions/fig2.md
    source: theory/derivation_body.tex Sections 2 (adhesion in water), 3 and 7 (sequestration, template), 8 (conformality)
  fig3:
    tex: fig3.tex
    engine: pdflatex
    out: fig3.pdf
    width: double
    text_free: true
    orthogonal_arrows: fig3_body.tex
    claim: >-
      Ca2+ binding enters the nucleation barrier once, through the template-liquid energy; the nucleus is fed
      from the bulk reservoir at the bulk driving force, and the template helps only through how well the
      nucleus wets it.
    caption: figures/src/captions/fig3.md
    source: theory/derivation_body.tex Section 7 (lane p0-w3); commit in w3_commit
    w3_commit: f23632d91c4a47fab4b7ff6dfa46e2315e6d4ea6  # last change of derivation_body.tex (P0-W6.3 re-check: Section 7 states and arrows unchanged since db872ae)
  fig3_symbols:
    tex: variants/fig3_symbols.tex
    engine: xelatex
    out: variants/fig3_symbols.pdf
    width: double
    text_free: false
    variant_of: fig3
    deliverable: false  # P0-W6.3: Palaash chose the text-free default; the variant stays buildable for the SI
    claim: as fig3
    caption: figures/src/captions/fig3.md
    source: as fig3
