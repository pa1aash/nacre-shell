# Assumed axis-title symbols for the figure templates (lane p0-w6, P0-W6.1).
#
# origin/preprint/p0-w3:theory/symbols.yaml had not been pushed when these templates were written
# (checked 2026-10-16). Day 2 (P0-W6.2) replaces every entry below with the matching key from that
# file; a key with no counterpart there is raised with lane p0-w3, not kept.
#
# Schema: key -> {label: mathtext for the axis title, unit: unit string or null, meaning: one line}.
status: assumed
reconcile_with: origin/preprint/p0-w3:theory/symbols.yaml
symbols:
  barrier_het:
    label: '$\Delta G^{*}_{\mathrm{het}}/k_{\mathrm{B}}T$'
    unit: null
    meaning: heterogeneous nucleation barrier in units of the thermal energy
  barrier_crit:
    label: '$\Delta G^{*}_{\mathrm{c}}/k_{\mathrm{B}}T$'
    unit: null
    meaning: barrier below which nucleation is observable on the experimental time scale
  wetting_angle:
    label: '$\theta$'
    unit: '°'
    meaning: contact (wetting) angle of the nucleus on the substrate
  supersaturation:
    label: '$S$'
    unit: null
    meaning: supersaturation ratio of the carbonate phase
  sobol_index:
    label: 'Sobol index'
    unit: null
    meaning: first-order (S_i) or total-order (S_Ti) variance-based sensitivity index
  required_precision:
    label: '$\sigma_{\mathrm{req}}$'
    unit: relative
    meaning: precision a first-principles value must reach to fix the screen outcome
  ph:
    label: 'pH'
    unit: null
    meaning: pH
  potential:
    label: '$E$'
    unit: V vs. SHE
    meaning: electrode potential on the standard hydrogen scale
  interfacial_energy:
    label: '$\gamma$'
    unit: null
    meaning: nucleus-solution interfacial energy (Sobol parameter)
  molecular_volume:
    label: '$v_{\mathrm{m}}$'
    unit: null
    meaning: molecular volume of the nucleating phase (Sobol parameter)
  temperature:
    label: '$T$'
    unit: null
    meaning: temperature (Sobol parameter)
  ln_supersaturation:
    label: '$\ln S$'
    unit: null
    meaning: logarithm of the supersaturation (Sobol parameter)
  kinetic_prefactor:
    label: '$A$'
    unit: null
    meaning: kinetic prefactor of the nucleation rate (Sobol parameter)
