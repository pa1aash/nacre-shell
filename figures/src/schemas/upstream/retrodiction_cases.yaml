      reference_value: present
      relation: test_higher_barrier
      reading: '"Neither ACC nor crystalline CaCO3 is observed on -CH3 surface" over 12 h, while calcite formed on -COOH in the same set-up; absence is read as the higher barrier.'
      doi: 10.1093/rb/rbv010
      locator: Abstract; Results (SEM, XRD, ATR-FTIR at 15 min to 12 h)
    channel: theta
    inputs:
      - {symbol: "c_local", role: "test", interface: "gamma_sl", interface_mapping: "gibbs_langmuir", distribution: {type: "normal", mean: 2.05, sd: 0.1}, unit: "mM", doi: "10.1093/rb/rbv010", locator: 'Figure 2, CH3 curve, peak near 42 min (read from the figure)', maps_to: 'gamma_sl = gamma_sl0 + Delta_gamma_ads, Delta_gamma_ads = -R T (Gamma_s ln(1 + x) - delta_s c_bulk) with x = c_local/(c_max - c_local) and c_max = Gamma_s/delta_s (Gibbs-Langmuir, theory/contract.yaml v3); cos_theta = cos_theta0 + Delta_gamma_ads/gamma_nl; Omega is Omega_bulk', assumption: true, basis: 'peak value read from Figure 2; sd 0.1 mM is the reading resolution, not a reported uncertainty', derived_from_outcome: false}
      - {symbol: "c_local", role: "reference", interface: "gamma_sl", interface_mapping: "gibbs_langmuir", distribution: {type: "normal", mean: 4.9, sd: 0.1}, unit: "mM", doi: "10.1093/rb/rbv010", locator: 'Figure 2, COOH curve, peak near 30 min (read from the figure); the text gives about five times the initial concentration at about 30 min (Results)', maps_to: "as test", assumption: true, basis: "as test", derived_from_outcome: false}
      - {symbol: "c_bulk", role: "shared", interface: "bulk", value: 1.0, unit: "mM", doi: "10.1093/rb/rbv010", locator: "Experimental set-up (1 mM CaCl2)", assumption: false, derived_from_outcome: false}
      - {symbol: "Gamma_s", role: "shared", interface: "gamma_sl", distribution: {type: "uniform", low: 2.6e-06, high: 1.3e-05}, unit: "mol m^-2", params_key: "gamma_s_site_density", locator: 'lit/params.yaml at p0-cp3, key gamma_s_site_density (rows TC-067, TF-036; carboxyl-terminated monolayers); prior copied as the table states it', maps_to: 'site density of the Gibbs-Langmuir term on gamma_sl', assumption: true, basis: 'the table prior is for carboxyl monolayers; one shared draw serves both surfaces (A-RC11-5)', derived_from_outcome: false}
      - {symbol: "delta_s", role: "shared", interface: "gamma_sl", distribution: {type: "loguniform", low: 4.96e-10, high: 5.0e-08}, unit: "m", params_key: "delta_s", locator: 'lit/params.yaml at p0-cp3, key delta_s (status gap, rule X1); registered treatment: the geometric bound of theory/ignorance_priors.md section 4', maps_to: 'binding-layer thickness of the Gibbs-Langmuir term on gamma_sl', assumption: true, basis: 'gap key under the registered bound max(2 r_Ca, Gamma_s V_m) <= delta_s <= d_layer. Lower end 4.96e-10 m is the largest lower-bound term over the table spans: 2 r_Ca with r_Ca from the flagged analog ca_o_distance_aqueous_analog (upper end 2.48e-10 m), above Gamma_s V_m (at most 1.3e-05 x 3.6964e-05 = 4.81e-10 m). Upper end 5.0e-08 m is the upper end of template_layer_thickness, a polydopamine film, used as a flagged analog for the monolayer. Loguniform because the span exceeds a decade (rule L1). c_max = Gamma_s/delta_s stays above 52 mM, so every c_local draw is below it', derived_from_outcome: false}
      - {symbol: "Omega_bulk", role: "shared", interface: "bulk", distribution: {type: "loguniform", low: 2, high: 100}, unit: '1', doi: "10.1093/rb/rbv010", locator: "not reported (ammonium carbonate diffusion)", maps_to: "Omega_bulk", assumption: true, basis: 'not reported; Omega is common to both surfaces under contract v3, and the sign of the predicted barrier difference does not depend on it', derived_from_outcome: false}
      - {symbol: "cos_theta", role: "shared", interface: "young", distribution: {type: "uniform", low: -1.0, high: 1.0}, unit: '1', doi: "10.1093/rb/rbv010", locator: "not reported (nuisance)", assumption: true, basis: "see A-RC11-1", derived_from_outcome: false}
      - {symbol: "T", role: "shared", interface: "bulk", value: 298.15, unit: "K", doi: "10.1093/rb/rbv010", locator: "Experimental set-up (room temperature)", assumption: true, basis: "room temperature taken as 25 C", derived_from_outcome: false}
    assumptions:
      - {id: "A-RC11-1", text: 'The Ca-free contact (gamma_sl0 and gamma_sn, hence cos_theta0) is common to the CH3 and COOH surfaces; it is the shared nuisance cos_theta. This is a strong assumption with no source: no calcite-CH3 or calcite-COOH interfacial free energy in water could be sourced (see RX12), so only the Ca2+ binding carries template information in this case, and it enters through Delta_gamma_ads on gamma_sl (contract v3; it no longer raises Omega).'}
      - {id: "A-RC11-2", text: 'The ion-selective electrode placed "as close as possible" to the surface measures a near-surface concentration, taken as c_local of the binding layer.'}
      - {id: "A-RC11-3", text: 'Each surface''s peak concentration is the c_local of its binding layer at the regime state (Theta_occ = c_local/c_max) and governs nucleation on it.'}
      - {id: "A-RC11-4", text: 'Absence of any CaCO3 over 12 h implies the higher barrier.'}
      - {id: "A-RC11-5", text: 'Gamma_s and delta_s are common to both surfaces (shared draws). For any positive Gamma_s and delta_s with c_local < c_max, Delta_gamma_ads falls monotonically as c_local rises, so the sign of the predicted difference is set by the c_local ordering; the two priors set only its magnitude and the boundary mass.'}
      - {id: "A-RC11-6", text: 'Single-entry bookkeeping: the bound Ca2+ enters gamma_sl only. gamma_sn receives no binding term (theory/contract.yaml: gamma_sn comes from contact data at the regime state and never receives Delta_G_seq); with no contact data for either surface it stays inside the shared nuisance, which takes Gamma_Ca_sn equal on both surfaces.'}
    evidence_rows: []
    link_reported_in_source: false
    negative: true
    status: usable

