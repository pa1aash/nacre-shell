      - {symbol: "dG_bind", role: "reference", interface: "gamma_sn", interface_mapping: "dupre", distribution: {type: "normal", mean: -5.0, sd: 0.7}, unit: "kT", doi: "10.1021/acs.cgd.0c00029", locator: "p. 3767, Section 3.2 and Figure 6 (calcite-carboxyl SAM 5.0 +- 0.7 kT)", evidence_row: "TC-074", maps_to: "as test", assumption: false, derived_from_outcome: false}
      - {symbol: "A_c", role: "shared", interface: "gamma_sn", distribution: {type: "uniform", low: 0.2, high: 0.6}, unit: "nm^2", doi: "10.1021/acs.cgd.0c00029", locator: "p. 3768, Section 3.3.2", evidence_row: "TC-075", maps_to: "as RC01", assumption: true, basis: 'range used by the authors for well- to poorly-organised SAMs; common to both SAMs', derived_from_outcome: false}
      - {symbol: "Omega", role: "shared", interface: "bulk", distribution: {type: "uniform_log", low_sigma: 5.25, high_sigma: 5.85}, unit: '1', doi: "10.1021/acs.cgd.0c00029", locator: "p. 3764, Section 2.2 (evidence row TC-069 conditions)", maps_to: 'Omega = exp(sigma)', assumption: false, derived_from_outcome: false}
      - {symbol: "T", role: "shared", interface: "bulk", value: 296.15, unit: "K", doi: "10.1021/acs.cgd.0c00029", locator: "p. 3764, Section 2.2 (23 C, evidence row TC-069)", assumption: false, derived_from_outcome: false}
