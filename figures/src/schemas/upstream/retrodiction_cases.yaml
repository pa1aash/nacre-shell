    reference: COOH SAM (rule 3b)

  - id: S-YU2023
    doi: 10.3390/coatings13020306
    citation: Yu XL, Wang BB, Xu ZM et al. Coatings 13, 306 (2023)
    read: full text (13 pp.)
    route: Unpaywall location (MDPI) through an archived copy
    conditions:
      mineral: CaCO3
      polymorph: not identified (no XRD in the paper)
      supersaturation: {quantity: "Ca2+ and CO3 2- each 360 mg/L", note: "pH not reported, so the IAP is not fixed", locator: "p. 7, Section 4.1.4"}
      pH: {value: "not reported"}
      T: {value: 70, unit: "C", note: "70 C chosen over 90 C under rule 4 (closer to R-slurry)", locator: "p. 8, Figure 7"}
      ionic_strength: {value: "not reported"}
      method: static immersion 12 h, scale mass by weighing; MD (COMPASS) of a CaCO3 solution on an Fe plate with and without a PDA layer
    reference: bare Q235 carbon steel (rule 3a, the authors' control)

cases:
  # ------------------------------------------------------------------ S-HAMM2014 (theta channel, DFS)
  - id: RC01
    study: S-HAMM2014
    termination: thiol
    templated: none
    test: {label: "C16-SH", chemistry: "1,16-hexadecanedithiol SAM on Au"}
    reference: {label: "C16-COOH", chemistry: "16-mercaptohexadecanoic acid SAM on Au"}
    mineral: calcite
    polymorph: calcite
    outcome:
      comparison: pairwise
      observable: cnt_slope_B
      test_value: -680
      reference_value: -572
      unit: '1'
      relation: test_higher_barrier
      reading: B is the slope of ln J0 against sigma^-2 and is proportional to the barrier at fixed sigma (Eq. 6b); |B| larger means a higher barrier.
      doi: 10.1073/pnas.1312369111
      locator: p. 1307, Table 2 (Mg2+/Ca2+ = 0 rows)
    channel: theta
    inputs:
      - {symbol: "dG_bind", role: "test", interface: "gamma_sn", interface_mapping: "dupre", distribution: {type: "normal", mean: -4.4, sd: 0.47}, unit: "kcal mol^-1", doi: "10.1073/pnas.1312369111", locator: "p. 1307, Table 2, row C16-SH", maps_to: 'cos_theta_young = |dG_bind|/(a gamma_nl) - 1 (SCHEMA.md section 4)', assumption: true, basis: 'mean as reported; sd not reported, set to 0.8 kT (0.47 kcal/mol at 298 K), the largest DFS sd reported by Nielsen et al. 2020 (10.1021/acs.cgd.0c00029, p. 3767, Section 3.2)', derived_from_outcome: false}
      - {symbol: "dG_bind", role: "reference", interface: "gamma_sn", interface_mapping: "dupre", distribution: {type: "normal", mean: -7.4, sd: 0.47}, unit: "kcal mol^-1", doi: "10.1073/pnas.1312369111", locator: "p. 1307, Table 2, row C16-COOH", evidence_row: "TC-066", maps_to: "as test", assumption: true, basis: "sd as for the test surface", derived_from_outcome: false}
      - {symbol: "A_c", role: "shared", interface: "gamma_sn", distribution: {type: "uniform", low: 0.2, high: 0.6}, unit: "nm^2", doi: "10.1021/acs.cgd.0c00029", locator: "p. 3768, Section 3.3.2", evidence_row: "TC-075", maps_to: "contact area a per SAM molecule in Young-Dupre", assumption: true, basis: 'range of Nielsen et al. 2020; Hamm et al. state a is at least (0.5 nm)^2 and below 1 nm^2 (p. 1306)', derived_from_outcome: false}
      - {symbol: "Omega", role: "shared", interface: "bulk", distribution: {type: "uniform_log", low_sigma: 4.66, high_sigma: 5.12}, unit: '1', doi: "10.1073/pnas.1312369111", locator: "p. 1308, Materials and Methods", maps_to: 'Omega = exp(sigma)', assumption: false, derived_from_outcome: false}
      - {symbol: "T", role: "shared", interface: "bulk", value: 298.15, unit: "K", doi: "10.1073/pnas.1312369111", locator: "p. 1308, Materials and Methods (25 C)", assumption: false, derived_from_outcome: false}
    assumptions:
      - {id: "A-RC01-1", text: 'DFS binding to calcite {104} stands for binding of the nucleating (012) face; the authors give the same caveat (p. 1307).'}
      - {id: "A-RC01-2", text: 'Contact area per molecule a is common to both SAMs (shared draw).'}
      - {id: "A-RC01-3", text: 'The DFS free energy is a full in-water free energy, so Delta_gamma_w = 0 (theory/contract.yaml, water_displacement).'}
    evidence_rows: [TC-061, TC-062, TC-066]
    link_reported_in_source: true
    negative: false
    status: usable

