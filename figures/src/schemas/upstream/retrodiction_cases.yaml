      pH: {value: "not stated for the rate series", note: "10.55 is stated for the MUO comparison solutions (pdf p. 17, Figure 1 caption)"}
      T: {value: "room temperature", locator: "pdf p. 9"}
      ionic_strength: {value: "10-30 mM CaCl2 plus NaHCO3", locator: "pdf p. 28, SI solution preparation"}
      method: flow-cell optical nucleation rates on MHA (C16) and MUA (C11) carboxyl SAMs; MD of calcite on even and odd carboxyl SAMs
    reference: MHA, the even-parity C16 carboxyl SAM (rule 3a, the authors' principal surface)

  - id: S-GIUFFRE2013
    doi: 10.1073/pnas.1222162110
    citation: Giuffre AJ, Hamm LM, Han N, De Yoreo JJ, Dove PM. Proc. Natl. Acad. Sci. USA 110, 9261-9266 (2013)
    read: full text (PMC3677451 HTML) and SI (archived PNAS supplement PDF)
    route: PubMed Central HTML; SI through an archived copy of the PNAS supplement
    conditions:
      mineral: calcite
      polymorph: calcite only, by rhombohedral morphology
