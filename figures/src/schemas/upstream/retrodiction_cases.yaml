  - id: RC05
    study: S-NIELSEN2020
    termination: mixed
    templated: none
    test: {label: "1:1 COOH/NH2 SAM", chemistry: 'mixed 11-mercaptoundecanoic acid / 11-amino-1-undecanethiol SAM (about 50 % each by XPS)'}
    reference: {label: "carboxyl SAM", chemistry: "11-mercaptoundecanoic acid SAM on Au"}
    mineral: calcite
    polymorph: calcite on the reference; none on the test surface
    outcome:
      comparison: pairwise
      observable: presence_absence
      test_value: absent
      reference_value: present
      relation: test_higher_barrier
      reading: 'No nucleation was observed on the 1:1 SAM during the rate experiments (p. 3768, Section 3.3.1), while the carboxyl SAM nucleated across the same sigma range; absence under identical flow conditions is read as a higher barrier, assuming a kinetic prefactor not lower by enough to explain it alone.'
