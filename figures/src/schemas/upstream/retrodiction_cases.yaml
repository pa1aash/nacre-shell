  # ------------------------------------------------------------------ S-NIELSEN2020 (theta channel, DFS)
  - id: RC04
    study: S-NIELSEN2020
    termination: amine
    templated: none
    test: {label: "NH2 SAM", chemistry: "11-amino-1-undecanethiol SAM on Au"}
    reference: {label: "carboxyl SAM", chemistry: "11-mercaptoundecanoic acid SAM on Au"}
    mineral: calcite
    polymorph: calcite
    outcome:
      comparison: pairwise
      observable: cnt_slope_B
      test_value: 859
      reference_value: 397
      unit: '1'
      relation: test_higher_barrier
      reading: 'B proportional to the barrier (Eq. 2); B = 859 +- 334 (amine) and 397 +- 65 (carboxyl). The rate J0 at sigma = 5.73 orders the same way here (17 and 2400 site/min), but rates are not used (SCHEMA.md 3.3).'
