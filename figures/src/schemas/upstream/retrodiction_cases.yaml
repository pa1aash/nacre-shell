# Retrodiction cases for the C3 link (templated CaCO3 nucleation), track p0.
#
# Session P0-W2.2, lane p0-w2. Fixed before any retrodiction run, in the same commit as
# criterion.md. Schema and selection rules: SCHEMA.md. Validator: `uv run nacre retro check`.
# Every outcome and every input was read in the source named, through an open route; copies are
# local-only. Numbers read from a figure say so in their locator.
#
# Revised in session P0-W2.3, before any retrodiction run, in one commit recorded as "fixed before
# run": every input names the interface it acts on (cp2 interface mapping, lane notes N11 and N23,
# decision D17), RC11 moves from the Omega_local mapping to the contract-v3 bookkeeping, and the
# shared priors are bound to their keys in the p0-cp3 parameter table.
schema: retro-cases/v1
session: P0-W2.2
revised_by: P0-W2.3
fixed_before_run: true

# Template-independent inputs, drawn once per Monte Carlo draw and shared by both surfaces of a
# pair. The keys are those of lit/params.yaml at tag p0-cp3 (lane p0-w1). P0-W2.2 named them by
# their evidence quantities (gamma_calcite_water, molar_volume_calcite, ksp_calcite) before the
# table existed; each quantity has exactly one primary calcite key in the table, and the binding
# below was made before the run. evidence_rows are the rows the table admits for the key.
shared_priors:
  gamma_nl:
    symbol: gamma_nl
    interface: gamma_nl
    meaning: calcite-water interfacial free energy (bare, Young denominator)
    params_key: gamma_nl_calcite
    evidence_rows: [TC-006, TC-007, TC-008, TC-009, TC-010, TC-011, TC-012, TC-013, TC-015]
    note: >-
      The spread is common-mode inside a pair; it moves both barriers together and mainly changes
      the clipping boundary mass. P0-W2.2 listed TC-006, TC-007, TC-010 to TC-014, TC-017 and TC-020
      (fetched span 0.055-0.49 J m^-2). Under the p0-w1 rule (lit/corpus/params_README.md) the table
      admits TC-008 to TC-013 and TC-015 (TC-006 and TC-007 share the original of TC-010) and keeps
      TC-014, TC-017 and TC-020 as comparators, giving uniform 0.072-0.487 J m^-2. The table's prior
      is used as it stands.
  V_m:
    symbol: V_m
    interface: bulk
    meaning: molar volume of calcite
    params_key: v_m_calcite
    evidence_rows: [TC-048, TC-049, TF-001, TF-008]
    note: P0-W2.2 listed TC-049, which the table admits with TC-048, TF-001 and TF-008.
  K_sp:
    symbol: K_sp
    interface: bulk
    meaning: calcite solubility product (activity basis)
    params_key: log10_ksp_calcite
    evidence_rows: [TC-033, TC-035]
    note: Drawn but not used by any mapping; Omega is given per case.
  water_owrk_components:
    symbol: gamma_w
    interface: gamma_sl
    meaning: water surface tension and its polar and dispersive components (OWRK)
    value: {gamma_w: 72.8, gamma_w_polar: 51.0, gamma_w_dispersive: 21.8}
    unit: mJ m^-2
    doi: 10.3390/foods6040031
    locator: p. 5, Table 1 (water, 20 C)
    note: Senturk Parreidt, Schmid, Hauser, Foods 6, 31 (2017); used only by the S-GIUFFRE2013 cases.

studies:
  - id: S-HAMM2014
    doi: 10.1073/pnas.1312369111
    citation: Hamm LM, Giuffre AJ, Han N, Tao J, Wang D, De Yoreo JJ, Dove PM. Proc. Natl. Acad. Sci. USA 111, 1304-1309 (2014)
    read: full text
    route: Europe PMC PDF render through an archived copy (PMC3910584)
    conditions:
      mineral: calcite
      polymorph: calcite (Raman; no ACC seen optically or by SEM)
      supersaturation: {quantity: "sigma = ln(a_Ca a_CO3 / K_sp,calcite)", range: [4.66, 5.12], locator: "p. 1308, Materials and Methods, Nucleation Rate Measurements"}
      pH: {value: 10.55, sd: 0.10, locator: "p. 1308, Materials and Methods"}
      T: {value: 25, unit: "C", locator: "p. 1308, Materials and Methods"}
      ionic_strength: {value: "not reported", note: "CaCl2 and Na2CO3 flow solutions, Mg-free series used here"}
      method: flow-cell optical counting of calcite crystallites on alkanethiol SAMs on template-stripped Au; DFS of SAM-functionalised tips on calcite {104} in calcite-saturated solution at pH 10.55
    reference: C16-COOH (rule 3b, carboxyl SAM of a SAM series)

  - id: S-NIELSEN2020
    doi: 10.1021/acs.cgd.0c00029
    citation: Nielsen AR, Jelavic S, Murray D, Rad B, Andersson MP, Ceccato M, Mitchell AC, Stipp SLS, Zuckermann RN, Sand KK. Cryst. Growth Des. 20, 3762-3771 (2020)
    read: full text
    route: Unpaywall location (cc-by) through an archived copy
    conditions:
      mineral: calcite
      polymorph: calcite (morphology; prismatic, rhombohedral)
      supersaturation: {quantity: "sigma = ln(a_Ca a_CO3 / K_sp,calcite)", range: [5.25, 5.85], locator: 'p. 3764, Section 2.2'}
      pH: {value: 9.5, sd: 0.1, locator: 'p. 3764, Section 2.2 (NaHCO3 titrated to pH 9.5 +- 0.1); Section 3.1 (p. 3766) says pH 9.0; DFS at pH 8.2 (p. 3767, Section 3.2)'}
      T: {value: 23, unit: "C", locator: 'p. 3764, Section 2.2 (ambient temperature, 23 C)'}
      ionic_strength: {value: "7-11 mM CaCl2 plus NaHCO3", locator: "p. 3764, Section 2.2"}
      method: flow-through steady-state nucleation rates on alkanethiol SAMs and B28 peptoid SAMs; DFS of SAM tips on calcite {10.4}; COSMO-RS
    reference: carboxyl SAM (rule 3b)

  - id: S-HU2012
    doi: 10.1039/c2fd20124k
    citation: Hu Q, Nielsen MH, Freeman CL, Hamm LM, Tao J, Lee JRI, Han TYJ, Becker U, Harding JH, Dove PM, De Yoreo JJ. Faraday Discuss. 159, 509-523 (2012)
    read: full text (accepted manuscript, White Rose repository; page numbers are those of the manuscript PDF)
    route: OpenAlex open location (eprints.whiterose.ac.uk/86509)
    conditions:
      mineral: calcite
