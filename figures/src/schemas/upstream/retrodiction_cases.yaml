    reference: chitosan (rule 3c)

  - id: S-DENG2015
    doi: 10.1093/rb/rbv010
    citation: Deng H, Wang S, Wang X, Du C, Shen X, Wang Y, Cui F. Regen. Biomater. 2, 187-195 (2015)
    read: full text (Europe PMC XML, PMC4669016, CC-BY); Figure 2 image from PubMed Central
    route: Europe PMC full-text XML; figure from the PMC CDN
    conditions:
      mineral: CaCO3
      polymorph: calcite (COOH); ACC then vaterite (OH, NH2); none (CH3)
      supersaturation: {quantity: "not reported", note: "CO2 from ammonium carbonate diffusing into 1 mM CaCl2 (Experimental set-up)"}
      pH: {value: "not reported"}
      T: {value: "room temperature", locator: "Experimental set-up"}
      ionic_strength: {value: "1 mM CaCl2 initial", locator: "Experimental set-up"}
