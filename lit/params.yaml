      as 2 LiClO4 plus a tabulated enthalpy, so the LiClO4 energies cancel and only the 5 atoms of CaCO3 carry a
      DFT error; 2 electrons move. Other reactions scale by their own count of uncancelled atoms per electron. W5''s
      provisional value counted every solid atom, which double counts the cancelling salt. The gas references are
      the schemes'' own and are benchmarked separately (gas_reference.md); this margin does not carry them.'
    derived: &id058
      expr: e_form * 5 / (2 * F)
      inputs:
        e_form: formation_energy_mae
    margin_case: evidence
    role: primary
