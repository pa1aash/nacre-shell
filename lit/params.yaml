      (the anion terms cancel: Al(ClO4)3 has no entry in the NBS tables, searched by formula). The same arithmetic
      for Ca2+ reproduces the salt-level quantity from the ai rows (TT-126 with TT-125 against TT-128 and the Ca(ClO4)2
      and LiClO4 entropies, 310.9 and 195.4: both give 79.9 J/K/mol). A crystalline Al(ClO4)3 versus 3 LiClO4 sink
