# Orchestrator review of coverage (P0-W1.1). The status in coverage.yaml is mechanical (distinct DOIs);
# these notes record where distinct DOIs are not independent evidence of the target as defined, or
# where the rows are proxies. `independent_originals` counts original determinations behind the rows.
# Merged into coverage.yaml by `python -m nacre.lit merge`.
gamma_nuc_water_acc:
  independent_originals: 2
  caveat: One CNT fit (TC-024, grade C) and one simulation range (TC-025); TG-018 (about 0.33 J m^-2 from size-dependent
    solubility) is abstract only (grade D). No direct measurement.
gamma_sub_nuc_or_contact_angle:
  independent_originals: 6
  caveat: All numeric rows are effective (net) interfacial energies from CNT fits of heterogeneous nucleation rates
    or MD, plus one compiled bound theta < 90 deg (TC-088). No separately determined gamma_sub,nuc and no measured
    contact angle on an organic surface.
gamma_sub_water_oxide:
  independent_originals: 2
  caveat: 'Proxies only: calorimetric surface enthalpies of hydrated or anhydrous-water-exposed boehmite and alpha-Al2O3
    (TB-052, TB-053 same group; TB-056), not interfacial free energies against liquid water. Treated as a gap for
    prior construction.'
ksp_calcite:
  independent_originals: 1
  caveat: All rows cite Plummer and Busenberg 1982 (paywalled, not read); compilations only. Day 2 found no other
    primary determination.
ksp_vaterite:
  independent_originals: 1
  caveat: Both DOIs cite Plummer and Busenberg 1982 via compilations.
ksp_aragonite:
  independent_originals: 1
  caveat: Both rows are secondary or tertiary citations of the same literature value.
ksp_acc:
  independent_originals: 5
  caveat: 'Day 2 (T-G) added direct measurements: titration-onset products (Gebauer 2008, Kellermeier 2014; grade
    B) and Mg-free dissolution intercept (Purgstaller 2019); they differ from the compiled dissolution values by
    1.1 to 1.5 log units (polyamorphism; lit/conflicts.md). TG-003/TG-004 are printed in a column scaled by 1e-8
    and are untraced by the local audit.'
acc_excess_free_energy:
  independent_originals: 3
  caveat: All rows derived from solubility products (Brecevic-Nielsen via TC-030/TC-031, Kellermeier via TG-011,
    Purgstaller via TG-012); no calorimetric free energy. Range 5.4 to 13.0 kJ/mol.
slurry_ionic_strength:
  independent_originals: 2
  caveat: All derived (grade C) from Li and carbonate contents of washing solutions and filtrates (TA-021, TJ-104,
    TJ-105); no ionic strength measured in a slurry. TA-022 is an added-salt processing solution.
hydration_free_energy_ca:
  independent_originals: 1
  caveat: All values trace to Marcus 1991; TF-051 rescales it to the cluster-pair proton scale and TF-050 gives
    that proton value. No independent Tissandier-scale Ca2+ value was read (paywalled).
pka_catechol:
  independent_originals: 3
  caveat: Day 2 (T-F) added catechol itself (TF-021, 8.83, ionic strength not stated) and a compiled literature
    range (TF-025, 9.14 to 9.43); dopamine and L-DOPA rows remain comparators.
w_adh_catechol_alumina_wet:
  independent_originals: 2
  caveat: Surface-forces data for DOPA-containing proteins on mica or SiO2 and a compiled range; no wet work of
    adhesion on alumina or an oxyhydroxide. Treated as a gap for the alumina substrate.
incell_potential_range:
  independent_originals: 10
  caveat: Mixes upper cut-off potentials of cells (T-A) with Al onset potentials in LiBOB and LiClO4 (T-B); distinguish
    by symbol before use.
gamma_sub_water_organic:
  independent_originals: 2
  caveat: 'Day 2 (T-H): derived (grade C) from contact-angle surface-energy components of polydopamine only (van
    Oss TH-049, Owens-Wendt TH-052 to TH-056); the sign depends on the model. No COOH, chitosan or alginate value.
    These are Ca-free values (gamma_sl0).'
molar_volume_calcite:
  independent_originals: 3
  caveat: 'Day 2 (T-F): NBS Circular 539 (TC-048), Graf 1961 via USGS Bulletin 1248 (TF-001) and a neutron refinement
    of biogenic calcite (TF-008); all derived or compiled (grade C).'
molar_volume_acc:
  independent_originals: 1
  caveat: 'Day 2 (T-G): derived from pycnometric densities of dried ACC at two hydration states in one paper (Jensen
    2018; TG-015, TG-016); structural water included. In situ SAXS density 1.62 g cm^-3 (TC-054, TC-055) is not
    a phase molar volume.'
dg_ca_catecholate:
  independent_originals: 1
  caveat: Gigliuto 2021 (dopamine, two ionic strengths) is the only catecholate constant; Tiron rows (TF-014 to
    TF-016) are a sulfonated catecholate (different ligand).
dg_ca_carboxylate:
  independent_originals: 4
  caveat: Day 2 added acetate and succinate (Martell-Smith via a compilation), poly(acrylic acid) by ITC, and acetate/aspartate/citrate
    free energies (simulation and compiled experiment, one paper). Ligand denticity differs between rows.
slurry_dic:
  independent_originals: 2
  caveat: Both are cathode-powder washing solutions, not slurries (TA-019 measured; TF-032 derived from Li2CO3 content);
    they differ by a factor of four (lit/conflicts.md).
slurry_ca:
  independent_originals: 0
  caveat: Day 2 (T-F) found no Ca in aqueous cathode slurries; Ca is a design input of the main study (params keys
    a_ca_slurry, c_bulk_slurry).
site_density_organic:
  independent_originals: 2
  caveat: Carboxyl-terminated SAMs on gold only (ordered-SAM estimate TC-067, MHA TF-036, 4-mercaptobenzoic acid
    TF-038); no polydopamine, alginate or chitosan group density.
water_activity_drying_primary:
  independent_originals: 0
  caveat: The rows (TN-043, TN-044) are dew points of the drying air for an aqueous anode on copper and a film temperature
    (TN-045); no water activity or film-surface relative humidity is printed, so a_w_slurry (primary drying) stays a gap.
template_mass_per_group:
  independent_originals: 0
  caveat: The only row (TN-033) is the dopamine hydrochloride reagent, which includes HCl and is not a polydopamine repeat
    unit; template_mass_per_group_min stays a gap.
ca_ionic_radius:
  independent_originals: 2
  caveat: One open source (10.1039/c8cp02244e) prints both the Shannon 1976 radii (original paywalled) and its own survey of
    crystal structures; ca_ionic_radius_cn6 admits both at CN 6.
reduction_limit_thermochemistry:
  independent_originals: 1
  caveat: NBS TN 270-8 only; the LiAl5O8 Gibbs energy was assigned by column order in a split extraction (grade C), and the
    independent enthalpy assessments spread by about 90 kJ/mol (TQ-010).
anion_anodic_stability:
  independent_originals: 7
  caveat: Computed 0 K windows of lithium salts and phosphate solid electrolytes; no calcium phosphate, oxalate, sulfate or
    silicate value was found (T-O gaps.md). Outlook evidence only.
