# One plain-language line per entry of the ```conflicts block of lit/conflicts.md (lane p0-w1), keyed by the entry's
# title: what the sources disagree about, which value the screen uses, and why. Text only; the value used is printed
# beside it by src/nacre/lit/si_table.py from lit/params.yaml, so this file carries no numbers.
Calcite-water interfacial free energy: Nucleation fits, molecular dynamics and contact-angle routes measure different things (a small nucleus, planar facets, probe-liquid effects); the whole sourced span is used and no source is preferred.
ACC-water interfacial free energy: A much larger value from the size-dependent solubility of nanoparticles also reflects hydration changes and is read from an abstract only; the fit and the simulation set the range and the large value is kept for comparison.
ACC solubility and the ACC offset: ACC formed at low supersaturation is less soluble than ACC precipitated fast; the range covers every ACC form and the offset inherits it.
ACC density and molar volume: Pycnometry of dried ACC includes the structural water and scattering of wet colloids includes interparticle water; the range covers the two pycnometry hydration states and the other values are kept for comparison.
Template-water interfacial free energy: The sign depends on the surface-energy model, and a negative value would mean unbounded swelling; the value is cut at zero and the uncut range is run as a sensitivity case.
Calcium-catecholate binding constant: Ionic strength and sodium competition shift the apparent constant; the single source is widened to the method error and flagged.
Calcium-carboxylate binding: Solution constants depend on denticity and polyelectrolyte cooperativity, and monolayer values on the free-energy method and its reference state; solution constants are sampled uniformly, monolayers log-uniformly, and the single acetate value is widened to the method error.
Calcite binding to templates against the effective barrier energy: Crystal binding lowers the effective energy, while strong single-ion binding by a hydrated film raises the cost of displacing water; the two are used only as evidence for the sign of the Gibbs term, not as a prior.
Effective interfacial energies on organic templates: Optical-rate fits on nucleating monolayers differ from force-spectroscopy conversions on weakly nucleating monolayers, which assume a cap geometry; the range covers organic templates and mineral substrates are kept for comparison.
Catechol first dissociation constant: Ionic strength, method and temperature differ between measurements; the range uses catechol itself at a stated ionic strength and the other values are kept for comparison.
Catechol second dissociation constant: Glass-electrode titration at high pH suffers alkaline error and air oxidation, which NMR titration avoids; the range uses measurements at a stated ionic strength.
Carboxyl dissociation constant: Charge build-up on a polyelectrolyte raises the apparent constant above that of monomeric acids, and a surface layer should behave alike; the range runs from monomer to polymer.
Slurry dissolved inorganic carbon: Nickel content, storage of the powder and wash atmosphere differ, and both values come from wash solutions rather than slurries; the range covers both.
Calcite molar volume: Magnesium and strontium in biogenic calcite change the cell; the range covers both kinds of calcite.
Slurry pH: Surface lithium compounds and lattice-lithium leaching grow with nickel content and storage, and cobalt-rich or lignin-bound slurries sit lower; unmodified slurries set the range and slurries with pH modifiers are a sensitivity case.
Potential of aluminium against SHE in alkaline media: Potentials measured in sodium hydroxide and in a near-neutral coolant bracket the slurry pH, and no slurry measurement exists; the range spans the bracket.
Slurry ionic strength: Lithium leaching grows with nickel content and contact time; the range covers the sourced span.
Heterogeneous nucleation prefactor: The prefactor of a classical fit absorbs attachment kinetics and site density and trades off against the interfacial energy; it is sampled log-uniformly because only its logarithm enters.
Fluorine-free aluminium oxidation onset: Perchlorate does not passivate aluminium while bis(oxalato)borate forms a passivating film, and solvent and temperature differ; the range is reported beside the regime range and is not used as a bound.
Charge cut-off within a cathode class: The cut-off is a protocol choice that differs within a class and more between classes; it is a design axis set by cathode class, sampled uniformly over each class's values.
Process times, temperatures and solids fraction: Study setpoints differ by design, not by error; the contact time is sampled log-uniformly and the others uniformly.
Dry surface energies of the anodic oxide and polydopamine: The sealing sublayer and porosity change the polar part of the oxide, and the probe-liquid set changes the dispersive and polar split of both; both are sampled uniformly and set the bounds of the contact energies.
Dry surface energy of calcite: Every admitted value is computed, molecular dynamics neglects entropy, and no experiment gives the free energy against vacuum; the range covers the computed values and is reused for ACC as a flagged analog.
Activity-model constants: Geochemical codes and the original Davies form use different coefficients, and stated validity ranges differ; each constant is sampled uniformly and draws beyond the validity bound are refused.
Water content of ACC: The synthesis route, washing and drying of each sample set its structural water; the range covers the synthetic magnesium-free values.
Polydopamine film thickness: Oxidative polymerisation depends on oxygen supply and deposition time; the thickness is sampled log-uniformly over the sourced span.
Binding-site density against its geometric bound: The monolayer site density exceeds the bound computed with the analog group density for the thinnest films, and the bound lacks a footprint term; the conflict is not resolved, and draws above the bound are refused when the analog is used.
Lithium carbonate oxidation, electrochemical against chemical routes: In fluorine-free glyme electrolytes gas evolution starts near the equilibrium potential, while in hexafluorophosphate carbonate electrolytes carbon dioxide also comes from chemical routes; the range covers the gas-analysis onsets and the chemical-route values are kept for comparison.
Analog bound on the entropy of calcium perchlorate: Anion-exchange increments from different alkali cations do not transfer, and the lithium perchlorate entropy is itself an estimate; the spread over the analogs is the bound and enters the margin of the experimental route.
Hydration free energy of calcium on two proton scales: The two scales assume different proton hydration energies, so the difference is a convention and not a disagreement; the scale is stated for each value and relative quantities take both ions from one scale.
Water wetting of aluminium oxide: Adventitious carbon and the degree of hydroxylation set the contact angle, and aged native oxide is not the clean hydroxylated surface; the weaker bound is kept.
Wet adhesion of catechol films on oxides: Oxidation of catechol to quinone, contact time and substrate hydroxyls change adhesion, and no film was measured on aluminium oxide; the value is a flagged analog sampled log-uniformly.
Carbonate bond length in ACC: A fitted structure model can shift the bond length to absorb disorder, which a first-peak reading does not; the range covers both, and calcite has its own entry.
Polar part of the PVDF surface energy: The acid-base term vanishes when the acceptor parameter is zero while the Owens-Wendt polar term does not, and totals depend on the probe liquids; the polar part uses the Owens-Wendt-type splits and the total uses all films.
Work function of aluminium faces: Two experimental sets order the faces oppositely, clean-face values depend on preparation and adsorbates, and the metal in a cell is oxide-covered; the range covers both sets and all faces.
LiAl5O8 formation against the tabulated budget: Independent enthalpy assessments differ far beyond the last-figure convention of the table because they retain different calorimetric data; the budget follows the table's convention and the spread between assessments is noted as a limit.
Ca2+ radius at the lowest tabulated coordination number: One survey covers hydrates and oxygen-donor solvates and Shannon's radii cover oxide and fluoride crystals; the range covers both values.
