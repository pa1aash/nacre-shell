# Hand-written judgments for lit/corpus/audit/ph_w1_4/reference_audit.csv (PH-W1.4, 2026-10-23).
# build_reference_audit.py merges this file with the fetched responses and the evidence table;
# it checks that every listed row exists, carries the key's DOI, and takes best_grade from the rows.
#
# use:       data_source | paraphrase | quote   (no direct quote was found; method citations count as paraphrase)
# supported: y | partial | n
#            y       a listed row measures or states what the cited sentence says
#            partial a row supports part of the sentence, or only an abstract-level reading (stated in note)
#            n       no evidence row for the work, or none that bears on the sentence
# rows:      evidence-table row ids that bear on the cited claim ([] when none)
# note:      what the rows do and do not cover; becomes the problems column together with the automatic flags

archer1997sensitivity:
  use: paraphrase
  rows: [TE-035]
  supported: y
  note: abstract only (grade D); supports bootstrap confidence intervals on Sobol indices.
bannwarth2019gfn2:
  use: paraphrase
  rows: [TE-075, TE-076, TE-077]
  supported: y
  note: method choice (GFN2-xTB geometries); benchmark errors are in the rows.
bauer2019effects:
