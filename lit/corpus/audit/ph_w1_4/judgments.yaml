  rows: []
  supported: n
  note: no row for this DOI. TJ-085 names Bichon only as the original of a mixing time. The cited sentence (carbon-coated collector keeps the slurry off the metal) matches the title of doberdo2014enabling, which is cited in the Introduction for a different sentence; check that the two keys are not swapped.
