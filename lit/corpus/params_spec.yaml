# Key specification of the parameter table (P0-W1.2). Input of `uv run python -m nacre.lit.build_params`.
# It names, per key, the admitted evidence rows and how each row's printed number maps to the key; it
# carries no numbers of its own. The rule is lit/corpus/params_README.md; the format is described in
# src/nacre/lit/build_params.py. Rows not admitted are named under `comparators` with the reason in
# `notes` (clause E2: proxies and different quantities; E5: grade D when A-C rows exist).
meta:
  session: P0-W1.2
  inputs_from: [theory/derivation_body.tex section 11, theory/contract.yaml, charter/regimes.yaml,
                ops/reports/P0-W5.1.md (needs from W1)]

params:
  # ================================================================ R-slurry: C3 nucleation (Young energies)
  gamma_nl_calcite:
    distinct: true
    symbol: gamma_nl
    unit: J m^-2
    regimes: [R-slurry]
    conditions: calcite against aqueous solution, near 298 K; homogeneous-nucleation fits, contact angle, subcritical cracking and MD facet free energies
    admit:
      - {row: TC-010, original: sohnel-mullin}
      - {row: TC-006, original: sohnel-mullin}
      - {row: TC-007, original: sohnel-mullin}
      - {row: TC-011, original: liu-lim-2003}
      - {row: TC-012, original: royne-2011}
      - {row: TC-013, original: okayama-1997}
      - {row: TC-015, original: costa-2018}
      - {row: TC-008, original: armstrong-md}
      - {row: TC-009, original: armstrong-md-0112}
    comparators: [TC-014, TC-017, TC-018, TC-019, TC-020]
    notes: >-
      Calcite framing of gamma_nl. TC-010, TC-011, TC-012, TC-013, TC-015 are read through one compilation
      (10.1021/acs.langmuir.4c04738, Table 2) but cite five different originals; TC-006, TC-007 and TC-010 share
      the Sohnel-Mullin original. TC-015 is admitted although its compilers advise omitting it; the rule has no
      outlier clause. TC-008/TC-009 are facet free energies of planar interfaces from one force field. Not
      admitted: TC-014 (inverse gas chromatography, against vapour), TC-017 (DFT hydrated surface energy, not a
      solid-liquid free energy), TC-018 (configurational energy, not a free energy), TC-019 and TC-020 (grade D).
    correlation_group: young_energies
  gamma_nl_acc:
    symbol: gamma_nl
    unit: J m^-2
    regimes: [R-slurry]
    conditions: ACC against aqueous solution, 298 K
    admit:
      - {row: TC-024}
      - {row: TC-025}
    comparators: [TG-018]
    notes: >-
      ACC framing of gamma_nl. TG-018 (0.33 J m^-2 from size-dependent apparent solubility of 66-196 nm particles,
      abstract only, grade D) is excluded by E5 and recorded in lit/conflicts.md.
    correlation_group: young_energies
  gamma_sl0_template:
    symbol: gamma_sl0
    unit: J m^-2
    regimes: [R-slurry]
    conditions: polydopamine film against water, from contact angles of probe liquids (van Oss and Owens-Wendt analyses)
    admit:
      - {row: TH-049}
      - {row: TH-052, original: 10.1039/d2ra03911g}
      - {row: TH-054, original: 10.1039/d2ra03911g-b}
      - {row: TH-056, original: 10.1039/d2ra03911g-c}
    status: sourced
    notes: >-
      Template (polydopamine) - water interfacial free energy, derived from printed surface-energy components
      (grade C). The same quantity is gamma_pw of C1. The three Owens-Wendt rows are three deposition times in one
      paper. The van Oss route gives a negative value and Owens-Wendt small positive ones; the sign follows the
      model (lit/conflicts.md). No COOH, chitosan or alginate value was found. Measured in pure water, these are
      Ca-free values: gamma_sl0 of contract v2 (theory/thresholds.md), not gamma_sl at the regime Ca2+ activity.
      cp3 R8: the prior is truncated at 0 (gamma >= 0; a negative template-water energy is a van Oss artifact,
      theory/ignorance_priors.md 1d), and the untruncated span is kept as gamma_sl0_template_untruncated, a labelled
      sensitivity.
    truncate: {min: 0, ruling: "cp3 ruling R8 (2026-10-17)", sensitivity_key: gamma_sl0_template_untruncated}
    correlation_group: young_energies
  gamma_sl0_template_untruncated:
    same_rows_as: gamma_sl0_template
    symbol: gamma_sl0
    unit: J m^-2
    regimes: [R-slurry]
    conditions: as gamma_sl0_template
    status: sourced
    role: sensitivity
    of: gamma_sl0_template
    notes: >-
      Labelled sensitivity (cp3 R8): the sourced span of gamma_sl0_template without the cut at zero, including the
      negative van Oss value (TH-049). Never decides a verdict.
    correlation_group: young_energies
  gamma_sn0_template:
    symbol: gamma_sn0
    unit: J m^-2
    regimes: [R-slurry]
    status: gap
    reason: >-
      gap: no separately determined template-nucleus interfacial free energy was found; the literature gives only
      effective energies from heterogeneous CNT fits (key gamma_eff_het_organic) and a compiled bound theta < 90
      degrees (TC-088)
    comparators: [TC-088, TH-038]
    correlation_group: young_energies
  delta_gamma_w:
    symbol: Delta_gamma_w
    unit: J m^-2
    regimes: [R-slurry]
    status: gap
    reason: >-
      gap: the water-displacement term is described only qualitatively (TH-024: water is harder to displace from
      surfaces carrying more Ca-binding groups); no number was found
    comparators: [TH-024]
    correlation_group: young_energies
  gamma_eff_het_organic:
    distinct: true
    symbol: gamma_eff_het
    unit: J m^-2
    regimes: [R-slurry]
    conditions: calcite nucleation on organic templates (SAMs, polysaccharide and chitosan films) in water, 22-25 C, pH 8.2-10.8
    admit:
      - {row: TC-057}
      - {row: TC-058}
      - {row: TC-059}
      - {row: TC-060}
      - {row: TC-061}
      - {row: TC-062}
      - {row: TC-063}
      - {row: TC-064}
      - {row: TC-068}
      - {row: TC-069}
      - {row: TC-070}
      - {row: TC-072}
      - {row: TC-073}
      - {row: TC-076}
      - {row: TC-077}
      - {row: TC-078}
      - {row: TC-079, original: giuffre-2013}
      - {row: TC-080, original: giuffre-2013}
      - {row: TC-081, original: giuffre-2013}
      - {row: TH-008}
      - {row: TH-009}
      - {row: TH-010}
      - {row: TH-011}
      - {row: TH-014}
      - {row: TH-015}
      - {row: TH-016}
      - {row: TH-017}
      - {row: TH-018}
      - {row: TH-019}
    comparators: [TC-084, TC-085, TC-086, TC-087, TC-089, TC-090, TC-091, TC-092, TH-020, TH-021]
    notes: >-
      Effective (net) interfacial energy gamma_eff = f(theta)^(1/3) gamma_nl from heterogeneous CNT fits on organic
      templates; a validation and retrodiction input, not a Young input. Mineral substrates (quartz, mica; TC-084 to
      TC-092) and the compiled Giuffre rows already standing for that original (TH-020, TH-021) are not admitted.
      The fits share their kinetic prefactor with nucleation_prefactor_j0 (group cnt_fit).
    correlation_group: cnt_fit

  # ================================================================ R-slurry: molar volumes
  v_m_calcite:
    symbol: V_m
    unit: m^3 mol^-1
    regimes: [R-slurry]
    conditions: calcite, 25-26 C, from cell parameters (X-ray, neutron) and a per-formula-unit volume used in CNT fits
    admit:
      - {row: TC-048}
      - {row: TF-001}
      - {row: TF-008}
      - {row: TC-049, unit: "cm^3*avogadro_constant"}
    notes: Volume per formula unit times the Avogadro constant (exact SI) for TC-049. TF-008 is biogenic (otolith) calcite.
  v_m_acc:
    symbol: V_m
    unit: m^3 mol^-1
    regimes: [R-slurry]
    conditions: dried ACC powders by pycnometry, structural water included (CaCO3.1.1H2O and CaCO3.0.5H2O)
    admit:
      - {row: TG-015}
      - {row: TG-016, original: jensen-2018-b}
    status: single-source
    comparators: [TC-054, TC-055, TG-017]
    notes: >-
      Two hydration states from one paper (Jensen 2018). In situ SAXS density 1.62 g cm^-3 of wet colloidal ACC
      (TC-054, TC-055) is far lower; that gap is in lit/conflicts.md. The molar volume per CaCO3 includes structural water.
  v_m_aragonite:
    symbol: V_m
    unit: m^3 mol^-1
    regimes: [R-slurry]
    conditions: aragonite, 25-26 C, from cell parameters
    admit:
      - {row: TC-052}
      - {row: TF-009}
  v_m_vaterite:
    symbol: V_m
    unit: m^3 mol^-1
    regimes: [R-slurry]
    conditions: vaterite, room temperature, compiled X-ray density
    admit:
      - {row: TF-011}

  # ================================================================ R-slurry: solubility and the ACC offset
  log10_ksp_calcite:
    symbol: K_sp
    transform: log10
    unit: "1"
    regimes: [R-slurry]
    conditions: calcite, 25 C, activity basis (I -> 0)
    admit:
      - {row: TC-033, original: plummer-busenberg-1982}
      - {row: TC-035, original: plummer-busenberg-1982}
    comparators: [TC-034, TC-036]
    notes: Both rows cite Plummer and Busenberg 1982 (paywalled). TC-034 (12 C) and TC-036 (31 C) bracket the temperature dependence and are not at 298 K.
    correlation_group: solubility
  log10_ksp_acc:
    symbol: K_sp
    transform: log10
    unit: "1"
    regimes: [R-slurry]
    conditions: ACC at 24.5-25 C; titration-onset free-ion products (pH 9-10) and dissolution equilibria of separately prepared ACC
    admit:
      - {row: TC-037, original: brecevic-nielsen-1989}
      - {row: TC-038, original: brecevic-nielsen-1989}
      - {row: TC-041, op: negate, original: clarkson-1992}
      - {row: TC-040}
      - {row: TG-001, op: log10, uncertainty: none}
      - {row: TG-002, op: log10, uncertainty: none, original: gebauer-2008-acc2}
      - {row: TG-003, op: log10, uncertainty: none}
      - {row: TG-004, op: log10, uncertainty: none, original: kellermeier-2014-pv}
      - {row: TG-007}
    comparators: [TC-039, TG-005, TG-006, TG-008]
    notes: >-
      Spans the ACC polyamorphs: proto-calcite and proto-vaterite ACC from titration onset (Gebauer 2008, Kellermeier
      2014; log10 about -7.5) against dissolution equilibria (Brecevic-Nielsen, Clarkson, Purgstaller Mg-free
      intercept; about -6.3 to -6.0) and a CNT-inferred second ACC form (TC-040). Ksp printed in mol^2 L^-2 is taken as
      the molal activity product (dilute). TG-003/TG-004 are printed in a column scaled by 1e-8 (lit/conflicts.md).
      TC-039 is the compiled Gebauer value (original TG-001 admitted); TG-006 contains 2.2 mol% Mg.
    correlation_group: solubility
  log10_ksp_aragonite:
    symbol: K_sp
    transform: log10
    unit: "1"
    regimes: [R-slurry]
    conditions: aragonite, 20-25 C
    admit:
      - {row: TC-045, original: aragonite-literature}
      - {row: TC-046, op: negate, original: aragonite-literature}
    correlation_group: solubility
  log10_ksp_vaterite:
    symbol: K_sp
    transform: log10
    unit: "1"
    regimes: [R-slurry]
    conditions: vaterite, 25 C, activity basis
    admit:
      - {row: TC-043, original: plummer-busenberg-1982}
      - {row: TC-044, original: plummer-busenberg-1982}
    correlation_group: solubility
  acc_offset:
    symbol: Delta_ACC
    unit: J mol^-1
    regimes: [shared]
    conditions: free energy of ACC minus calcite per CaCO3 formula unit at 25 C, from solubility products
    admit:
      - {row: TC-030, original: brecevic-nielsen-1989}
      - {row: TC-031, original: brecevic-nielsen-1989}
      - {row: TG-011}
      - {row: TG-012}
    comparators: [TC-026, TC-027, TC-028, TC-029, TG-009]
    notes: >-
      The offset W5 adds to G_phase of ACC (Pourbaix) and that shifts ln Omega between framings. All admitted rows are
      RT ln10 times a difference of log10 Ksp, so the key is tied to log10_ksp_acc and log10_ksp_calcite by
      construction; the screen derives it from those keys when it samples them jointly. Calorimetric crystallisation
      enthalpies (TC-026 to TC-029, TG-009) are enthalpies, not free energies.
    correlation_group: solubility

  # ================================================================ R-slurry: carbonate system and water
  pk1_carbonic:
    symbol: pK1_carbonic
    unit: "1"
    regimes: [R-slurry]
    conditions: 298.15 K, I = 0
    admit:
      - {row: TF-039}
      - {row: TF-041}
    correlation_group: carbonate_system
  pk2_carbonic:
    symbol: pK2_carbonic
    unit: "1"
    regimes: [R-slurry]
    conditions: 298.15 K, I = 0
    admit:
      - {row: TF-040}
      - {row: TF-042}
    correlation_group: carbonate_system
  log10_k_cahco3:
    symbol: K_CaHCO3
    transform: log10
    unit: "1"
    regimes: [R-slurry]
    conditions: Ca2+ + HCO3- = CaHCO3+, 298.15 K, I = 0
    admit:
      - {row: TF-043}
    notes: WATEQ4F value; original Plummer and Busenberg 1982.
    correlation_group: carbonate_system
  log10_k_caco3_aq:
    symbol: K_CaCO3_aq
    transform: log10
    unit: "1"
    regimes: [R-slurry]
    conditions: Ca2+ + CO3 2- = CaCO3(aq), 298.15 K, I = 0
    admit:
      - {row: TF-044}
    notes: WATEQ4F value; original Plummer and Busenberg 1982.
    correlation_group: carbonate_system
  a_co3_slurry:
    symbol: a_CO3
    unit: "1"
    regimes: [R-slurry]
    status: computed
    reason: >-
      computed by speciation at each sampled point from dic_slurry, ph_slurry, pk2_carbonic, pk1_carbonic, the ion-pair
      constants and ionic_strength_slurry with the Debye-Hueckel parameters of TF-045 to TF-047; never fitted
    comparators: [TF-045, TF-046, TF-047]
  # ================================================================ day 3: W3 contract-v3 keys (cp2 fix-up list)
  gamma_nv_calcite:
    distinct: true
    symbol: gamma_nv
    unit: J m^-2
    regimes: [R-slurry]
    conditions: calcite {10-14} surface free energy against vacuum, relaxed slabs, DFT (0 K and 300 K), force fields and MD
    admit:
      - {row: TL-001, original: onawole-2020-dft}
      - {row: TL-008, original: deleeuw-parker-1998}
      - {row: TL-009, original: rohl-2003}
      - {row: TL-016, original: bruno-dft}
      - {row: TL-017, original: akiyama-dft}
      - {row: TL-018, original: bruno-2013-300k}
      - {row: TL-019, original: kvamme-md}
      - {row: TL-020, original: parker-md}
    comparators: [TL-021, TL-022, TL-023, TL-024, TL-027, TL-002, TL-003, TL-004, TL-005, TL-006, TL-007, TL-010, TL-011,
                  TL-012, TL-013, TL-014, TL-015, TL-025, TL-026, TL-028, TL-029, TL-030]
    notes: >-
      Dry surface energy of the calcite framing (theory/ignorance_priors.md 1a: gamma_max = gamma_p + gamma_nv). Every
      admitted value is computed: no experiment gives the free energy against vacuum. TL-027 (water spreads on fresh
      cleavage, so the total exceeds the water surface tension) is a consistent lower bound; TL-023 (an equation-of-state
      estimate its authors judge unrealistic) and the dispersive components (TL-025 to TL-030) are not this quantity.
      Other faces (TL-002 to TL-007, TL-010 to TL-015) are higher; {10-14} is the cleavage and growth face.
  gamma_nv_acc:
    symbol: gamma_nv
    unit: J m^-2
    regimes: [R-slurry]
    status: gap
    reason: >-
      gap: no measured or computed dry surface free energy of ACC was found; the source that studies ACC energetics
      states it is unknown (TL-031). Navrotsky-group surface enthalpies are a different quantity
    notes: The flagged analog gamma_nv_acc_calcite_analog (calcite {10-14}) runs beside the ignorance prior of the ACC framing.
  gamma_nv_acc_calcite_analog:
    same_rows_as: gamma_nv_calcite
    symbol: gamma_nv
    unit: J m^-2
    regimes: [R-slurry]
    role: analog
    of: gamma_nv_acc
    conditions: as gamma_nv_calcite
    notes: >-
      Flagged analog (A1): the calcite {10-14} dry surface energy standing in for ACC, whose value is unknown (TL-031).
      Verdicts under the ACC framing that use it are conditional on the analog.
  gamma_sn_ignorance_calcite:
    symbol: gamma_sn
    unit: J m^-2
    regimes: [R-slurry]
    ignorance: {low: "0", high: "g_p + g_nv", inputs: {g_p: gamma_p_pda, g_nv: gamma_nv_calcite},
                authority: "theory/ignorance_priors.md section 1a"}
    notes: >-
      Ignorance prior of the template-nucleus contact energy in water, calcite framing (cp2 gap policy, D15): uniform
      on [0, gamma_p + gamma_nv], drawn per draw of gamma_p_pda and gamma_nv_calcite. No measured analog of gamma_sn
      exists (lit/conflicts.md); gamma_eff_het_organic is a validation input of the combined barrier, not of gamma_sn.
  gamma_sn_ignorance_acc:
    symbol: gamma_sn
    unit: J m^-2
    regimes: [R-slurry]
    ignorance: {low: "0", high: "g_p + g_nv", inputs: {g_p: gamma_p_pda, g_nv: gamma_nv_acc},
                authority: "theory/ignorance_priors.md section 1a"}
    notes: ACC framing; its bound needs gamma_nv_acc, a gap, so the analog gamma_sn_ignorance_acc_analog runs beside it.
  gamma_sn_ignorance_acc_analog:
    symbol: gamma_sn
    unit: J m^-2
    regimes: [R-slurry]
    role: analog
    of: gamma_sn_ignorance_acc
    ignorance: {low: "0", high: "g_p + g_nv", inputs: {g_p: gamma_p_pda, g_nv: gamma_nv_acc_calcite_analog},
                authority: "theory/ignorance_priors.md section 1a"}
    notes: The ACC-framing ignorance prior with the calcite dry surface energy as a flagged analog of gamma_nv_acc.
  gamma_ow_ignorance:
    symbol: gamma_ow
    unit: J m^-2
    regimes: [R-slurry]
    ignorance: {low: "0", high: "g_o + g_w", inputs: {g_o: gamma_o_alumina, g_w: gamma_w},
                authority: "theory/ignorance_priors.md section 1c"}
    notes: >-
      Oxide-water ignorance prior of the C1 comparator route. The tighter complete-wetting bound is not used: measured
      water contact angles on alumina run from zero on UV-cleaned sapphire to about ninety degrees (TM-040 to TM-046),
      so complete wetting is not established for the native oxide.
  gamma_op_ignorance:
    symbol: gamma_op
    unit: J m^-2
    regimes: [R-slurry]
    ignorance: {low: "0", high: "g_o + g_p", inputs: {g_o: gamma_o_alumina, g_p: gamma_p_pda},
                authority: "theory/ignorance_priors.md section 1c"}
    notes: Oxide-polymer ignorance prior of the C1 comparator route; the measured analog is w_adh_wet_catechol_oxide_analog.
  log10_k_caoh:
    transform: log10
    symbol: K_CaOH
    unit: "1"
    regimes: [R-slurry]
    conditions: Ca2+ + H2O = CaOH+ + H+, 25 C, I = 0
    admit:
      - {row: TL-032, original: nordstrom-1990}
      - {row: TL-033, original: nordstrom-1990}
    comparators: [TL-034, TL-035]
    notes: >-
      Both database manuals trace the value to one original (Nordstrom et al. 1990), so it counts once and the width is
      not sourced. TL-034 and TL-035 are association constants Ca2+ + OH- = CaOH+ (I = 1 M and I = 0), a different
      reaction. A speciation constant from a critically evaluated database, not a template binding energy, so the W1
      widening does not apply.
  debye_huckel_a:
    distinct: true
    symbol: A_DH
    unit: "1"
    regimes: [R-slurry]
    conditions: Debye-Hueckel A for log10 activity coefficients on the molality scale, water, 293.15 to 313.15 K (the slurry temperature span)
    admit:
      - {row: TL-037, unit: "1"}
      - {row: TL-038, unit: "1"}
      - {row: TL-039, unit: "1"}
      - {row: TL-040, unit: "1"}
      - {row: TL-041, unit: "1"}
      - {row: TL-044, unit: "1"}
      - {row: TL-046, unit: "1"}
    status: sourced
    comparators: [TL-036, TL-042, TL-043, TL-045]
    notes: >-
      Printed in kg^0.5 mol^-0.5 and stored as the number multiplying the square root of I/(1 mol/kg) (the contract's A_DH
      is dimensionless). TL-037 to TL-041 (Archer-Wang, converted by the thread from the osmotic slope, grade C) span the
      slurry temperatures; TL-044 and TL-046 are values at 25 C. A rises with temperature, so the span is a temperature
      span; the screen may tie it to t_slurry. TL-036 and TL-042 lie outside the slurry temperatures.
  davies_b:
    distinct: true
    symbol: b_D
    unit: "1"
    regimes: [R-slurry]
    conditions: linear coefficient of the Davies equation, water
    admit:
      - {row: TL-047, original: wateq4f}
      - {row: TL-048, original: phreeqc-v2}
      - {row: TL-049, original: davies-1938}
    notes: The geochemical codes use 0.3; Davies' original form uses 0.2 (read through a quoting source). Both are admitted.
  davies_i_val:
    distinct: true
    symbol: I_val
    unit: mol kg^-1
    regimes: [R-slurry]
    conditions: ionic strength up to which the Davies equation is stated to hold
    admit:
      - {row: TL-050}
      - {row: TL-051}
    comparators: [TL-052]
    notes: >-
      Davies' own statement (about 2 percent accuracy) is the lower end; the upper end is a later textbook statement.
      TL-052 is the validity of a whole speciation model, not of the Davies equation. Draws of I above I_val are
      refused (contract v3), and the slurry ionic strength (ionic_strength_slurry) reaches into this span.
  ca_total_slurry:
    symbol: Ca_T
    unit: mol m^-3
    regimes: [R-slurry]
    status: design-input
    reason: >-
      design input (gap policy (ii)): total dissolved calcium Ca_T is set by the design (the Ca source added to the
      slurry); no aqueous cathode slurry with calcium was found (T-F gaps.md). a_ca_slurry and c_bulk_slurry follow from
      it through the contract v3 speciation
  acc_hydration_n:
    distinct: true
    symbol: n_hyd
    unit: "1"
    regimes: [R-slurry]
    conditions: structural water n of synthetic Mg-free ACC CaCO3.nH2O, freshly prepared, by thermogravimetry
    admit:
      - {row: TL-053}
      - {row: TL-054}
      - {row: TL-055}
      - {row: TL-056}
      - {row: TL-057}
      - {row: TL-059}
      - {row: TL-062}
    comparators: [TL-058, TL-060, TL-061]
    notes: >-
      F7: n of the hydrated framing for the labelled sensitivity Omega_bulk_hydrated. Biogenic ACC (TL-058) and
      heat-treated ACC (TL-060) hold less water and are comparators; TL-061 is the mass fraction behind TL-062.
  a_w_drying_secondary:
    distinct: true
    symbol: a_w
    unit: "1"
    regimes: [R-slurry]
    conditions: water activity of the gas over electrodes during vacuum post-drying and in the dry room after drying, from the printed dew points
    admit:
      - {row: TL-063}
      - {row: TL-064}
    comparators: [TL-065, TL-066, TL-067, TL-068, TL-069, TL-070, TL-071]
    notes: >-
      F7, per drying state: the gas-phase water activity that a dried film approaches at equilibrium in the secondary
      (vacuum) drying and dry-room states. It is the activity of the surroundings, not a measured activity of the film.
      Dew points (TL-065 to TL-067) and residual water contents (TL-068 to TL-071) are comparators.
  a_ca_slurry:
    symbol: a_Ca
    unit: "1"
    regimes: [R-slurry]
    status: design-input
    reason: >-
      design input: no Ca is present in the aqueous slurries found (searches in T-F gaps.md); the Ca source and its
      dose are design choices of the main study, set at registration, not literature values
  c_bulk_slurry:
    symbol: c_bulk
    unit: mol m^-3
    regimes: [R-slurry]
    status: design-input
    reason: design input, as a_ca_slurry (the bulk Ca2+ concentration follows from the chosen Ca dose)
  gamma_w:
    symbol: gamma_w
    unit: J m^-2
    regimes: [R-slurry]
    conditions: water against its vapour, 25 C
    admit:
      - {row: TF-048}
  water_density:
    symbol: rho_water
    unit: kg m^-3
    regimes: [R-slurry]
    conditions: air-free water, 25 C
    admit:
      - {row: TF-049}
    notes: For the anchor's standard-state conversion (W5).

  # ================================================================ R-slurry: C2 sequestration
  pka_catechol:
    distinct: true
    symbol: pKa
    unit: "1"
    regimes: [R-slurry]
    conditions: >-
      first dissociation of catechol itself (1,2-dihydroxybenzene), 18 to 25 C, ionic strength stated and between 0.06
      and 0.15 mol dm^-3 (KCl, KNO3 or unnamed salt)
    admit:
      - {row: TM-001, original: antikainen-1973}
      - {row: TM-003, original: harada-1969-potentiometry}
      - {row: TM-005, original: harada-1969-spectrophotometry}
      - {row: TM-007, original: mirzahosseini-2018}
      - {row: TM-009}
      - {row: TM-010}
      - {row: TM-011}
      - {row: TM-012}
      - {row: TM-013}
      - {row: TM-014}
      - {row: TM-016}
      - {row: TM-017}
    flags: [ionic_strength]
    ionic_strength: >-
      Admitted rows state I between 0.06 and 0.15 mol dm^-3, inside the slurry span of ionic_strength_slurry; rows that
      do not state I are comparators (cp3 R8). No admitted source extrapolates to I = 0.
    comparators: [TF-021, TF-025, TM-015, TM-018, TM-019, TM-020, TM-021, TM-022, TM-023, TM-024, TM-025, TM-026,
                  TD-042, TD-043, TD-044, TD-045, TD-046, TD-047, TF-024]
    notes: >-
      cp3 R8: catechol itself, no proxy, with an ionic-strength flag. Dopamine and L-DOPA constants (TD-042 to TD-047,
      TF-024) are proxies. TF-021 (8.83, Britton-Robinson buffer, I not stated), TF-025 and TM-018 to TM-026 (Romero 2018
      compilation, I not stated) and TM-015 (I not printed) are comparators because their ionic strength is not
      stated. TM-009 to TM-017 are the literature values compiled in Antikainen 1973 Table 6, each a different original.
  pka2_catechol:
    distinct: true
    symbol: pKa
    unit: "1"
    regimes: [R-slurry]
    conditions: second dissociation of catechol itself, 25 C, I = 0.10 to 0.15 mol dm^-3
    admit:
      - {row: TM-002, original: antikainen-1973}
      - {row: TM-004, original: harada-1969-potentiometry}
      - {row: TM-006, original: harada-1969-spectrophotometry}
      - {row: TM-008, original: mirzahosseini-2018}
    flags: [ionic_strength]
    ionic_strength: Admitted rows state I = 0.10 to 0.15 mol dm^-3; TF-022 (I not stated) is a comparator.
    comparators: [TF-022]
    notes: >-
      Second catechol constant, which sets the catecholate dianion fraction at the upper end of the slurry pH (cp3 R8).
      Glass-electrode titrations near pH 12 (TM-002, TM-004) read lower than NMR-pH titration (TM-008); see
      lit/conflicts.md.
  pka_carboxyl:
    distinct: true
    symbol: pKa
    unit: "1"
    regimes: [R-slurry]
    conditions: carboxylic acid groups, monomeric acids at I = 0 and poly(acrylic acid) at half ionisation
    admit:
      - {row: TF-026}
      - {row: TF-027}
      - {row: TF-030}
      - {row: TF-028, original: 10.3390/polym15051121-a}
      - {row: TF-029, original: 10.3390/polym15051121-b}
    notes: No surface pKa of a COOH monolayer was read (T-F gaps).
  delta_g_site:
    symbol: Delta_G_site
    unit: J mol^-1
    regimes: [R-slurry]
    status: computed
    reason: computed by the study (PMF of Ca2+ at the deprotonated site); literature binding keys below are comparators only (X2)
  log10_k_ca_catecholate:
    widen: {by: m_seq_method_error, scale: log10_constant}
    symbol: K_Ca_catecholate
    transform: log10
    unit: "1"
    regimes: [R-slurry]
    conditions: Ca2+ + fully deprotonated dopamine (catecholate), 298.15 K, NaCl 0.143 and 0.472 mol dm^-3
    admit:
      - {row: TD-048}
      - {row: TD-049, original: 10.3390/biom11091312-b}
    status: single-source
    comparators: [TF-014, TF-015, TF-016, TF-017]
    notes: >-
      Anchor comparison range (W5). Two ionic strengths in one paper; they differ beyond their uncertainties
      (lit/conflicts.md). Tiron (a sulfonated catecholate, TF-014 to TF-016) is a different ligand and not admitted.
  log10_k_ca_carboxylate:
    distinct: true
    symbol: K_Ca_carboxylate
    transform: log10
    unit: "1"
    regimes: [R-slurry]
    conditions: Ca2+ with acetate, succinate and maleate (I = 0.1 or 0) and poly(acrylic acid) (ITC, pH 7)
    admit:
      - {row: TF-019}
      - {row: TF-020, original: martell-smith-succinate}
      - {row: TD-051}
      - {row: TF-018}
    status: sourced
    notes: Anchor comparison range (W5); spans mono-, di- and polycarboxylates.
  dg_bind_ca_acetate:
    widen: {by: m_seq_method_error, scale: free_energy}
    symbol: Delta_G_bind_Ca_carboxylate
    unit: J mol^-1
    regimes: [R-slurry]
    conditions: Ca2+ + acetate in water, about 298-300 K, infinite dilution
    admit:
      - {row: TH-026}
      - {row: TH-029, original: compiled-experiment}
    status: single-source
    comparators: [TH-027, TH-028, TH-030, TH-031]
    notes: Single carboxylate group (simulation and compiled experiment, one paper). Aspartate and citrate (multidentate) are comparators.
  dg_bind_ca_cooh_monolayer:
    symbol: minus_Delta_G_bind_Ca_COOH_monolayer
    unit: J mol^-1
    regimes: [R-slurry]
    conditions: Ca2+ at a deprotonated carboxyl-terminated monolayer (MUA), about 300 K; magnitudes of the binding free energy
    admit:
      - {row: TH-033}
      - {row: TH-034}
      - {row: TH-035, original: 10.1021/labee-pmf}
    notes: Magnitude (binding strength) as printed. The PMF route spans 30-170 kJ/mol by method; comparator for delta_g_site.
  dg_bind_calcite_template:
    widen: {by: m_seq_method_error, scale: free_energy}
    symbol: Delta_G_bind_calcite_template
    unit: J mol^-1
    regimes: [R-slurry]
    conditions: calcite crystal binding to SAM-coated tips (force spectroscopy), pH 10.55
    admit:
      - {row: TC-066}
      - {row: TH-001, original: hamm-2014-a}
      - {row: TH-002, original: hamm-2014-b}
      - {row: TH-003, original: hamm-2014-c}
    status: single-source
    comparators: [TC-074, TH-006, TH-007, TH-004, TH-005, TH-012, TH-022, TH-023]
    notes: >-
      Crystal-template binding, paired with gamma_eff on the same SAMs (TC-061 to TC-064); the relation of binding to
      the barrier is discussed in lit/conflicts.md and the report. kT-scaled rows (TC-074, TH-006, TH-007) are comparators.
  gamma_s_site_density:
    symbol: Gamma_s
    unit: mol m^-2
    regimes: [R-slurry]
    conditions: carboxyl-terminated monolayers (ordered SAM estimate, MHA on gold, 4-mercaptobenzoic acid)
    admit:
      - {row: TC-067, unit: "nm^-2/avogadro_constant"}
      - {row: TF-036}
      - {row: TF-038}
    comparators: [TF-037, TC-075, TA-031]
    notes: Areal number densities divided by the Avogadro constant (exact SI). No polydopamine group density was found.
  delta_s:
    symbol: delta_s
    unit: m
    regimes: [R-slurry]
    status: gap
    reason: gap - no fetched binding-layer thickness; it is a modelling choice of the C2 closure to be set with the PMF (W3/W5)
  site_footprint_area:
    symbol: a_site
    unit: m^2
    regimes: [R-slurry]
    status: gap
    reason: >-
      gap: no area per Ca2+-binding site with its bound ion, nor a Ca2+ to headgroup ratio on a carboxylate or catechol
      layer, was found in an open source (T-L gaps.md)
  pda_density:
    symbol: rho_PDA
    unit: kg m^-3
    regimes: [R-slurry]
    conditions: polydopamine grains, mass density
    admit:
      - {row: TL-072}
    comparators: [TL-073, TL-074, TL-075]
    notes: Melanin values (TL-073, TL-074) and a nominal density (TL-075) are comparators.
  pda_binding_site_content:
    symbol: c_sites
    unit: mol kg^-1
    regimes: [R-slurry]
    conditions: accessible amine-binding sites of polydopamine per mass, pH 8.5
    admit:
      - {row: TL-076}
    notes: A proxy for the catechol content (accessible binding sites, not all catechol groups).
  template_group_density:
    symbol: rho_L
    unit: mol m^-3
    regimes: [R-slurry]
    status: gap
    reason: gap - no volume density of catechol groups in polydopamine was found; only an accessible-site content (proxy)
    notes: The flagged analog template_group_density_site_analog runs beside the gap.
  template_group_density_site_analog:
    symbol: rho_L
    unit: mol m^-3
    regimes: [R-slurry]
    role: analog
    of: template_group_density
    derive: {expr: "rho * c", inputs: {rho: pda_density, c: pda_binding_site_content}}
    notes: "Flagged analog (A1): PDA density times its accessible binding-site content."
  template_layer_thickness:
    distinct: true
    symbol: d_layer
    unit: m
    regimes: [R-slurry]
    conditions: polydopamine film thickness, 2 g/L dopamine at pH 8.5 in Tris (aerated or not, or with oxidant), on silicon, quartz-crystal sensors or chromium
    admit:
      - {row: TL-077}
      - {row: TL-078}
      - {row: TL-079}
      - {row: TL-080}
      - {row: TL-081}
      - {row: TL-082}
    notes: >-
      Depends on deposition time and oxygen supply. No film on aluminium oxide was measured; the substrates differ.
  ca_ionic_radius:
    symbol: r_Ca
    unit: m
    regimes: [R-slurry]
    status: gap
    reason: gap - the ionic-radius compilation (Shannon 1976) is paywalled and no open primary source was read
    notes: The flagged analog ca_o_distance_aqueous_analog runs beside the gap.
  ca_o_distance_aqueous_analog:
    distinct: true
    symbol: r_Ca
    unit: m
    regimes: [R-slurry]
    role: analog
    of: ca_ionic_radius
    conditions: Ca-O distance of hydrated Ca2+ in aqueous solution (diffraction and EXAFS reviews)
    admit:
      - {row: TL-083}
      - {row: TL-084}
      - {row: TL-085}
    notes: >-
      Flagged analog (A1): the Ca-O distance exceeds r_Ca by the radius of the water oxygen, so using it for r_Ca makes
      the lower bound 2 r_Ca of delta_s larger than the true bound.
  gamma_s_geometric_bound_analog:
    symbol: Gamma_s
    unit: mol m^-2
    regimes: [R-slurry]
    role: analog
    of: gamma_s_site_density
    status: computed
    derive: {expr: "rho_l * d", inputs: {rho_l: template_group_density_site_analog, d: template_layer_thickness}, as: none}
    notes: >-
      The geometric upper bound rho_L d_layer on Gamma_s (theory/ignorance_priors.md 4) with the analog group density;
      1/(N_A a_site) is not available (site_footprint_area is a gap). gamma_s_site_density is checked against it in
      lit/conflicts.md.
  v_site:
    symbol: V_site
    unit: m^3
    regimes: [R-slurry]
    status: gap
    reason: gap - no fetched site volume; it follows from delta_s and Gamma_s in the C2 closure
  dg_hyd_ca_marcus:
    widen: {by: m_seq_method_error, scale: free_energy}
    symbol: Delta_G_hyd_Ca
    unit: J mol^-1
    regimes: [R-slurry]
    conditions: Ca2+ hydration free energy, 298.15 K, proton reference -1056 kJ/mol (Marcus scale)
    admit:
      - {row: TD-054, original: marcus-1991}
      - {row: TD-056, original: marcus-1991}
    comparators: [TD-055, TD-057, TE-064]
    notes: Benchmark for the anchor; fitted force-field values (TD-055, TD-057) are not independent.
  dg_hyd_ca_tissandier:
    widen: {by: m_seq_method_error, scale: free_energy}
    symbol: Delta_G_hyd_Ca
    unit: J mol^-1
    regimes: [R-slurry]
    conditions: Ca2+ hydration free energy on the cluster-pair (Tissandier) proton scale, 1 atm gas standard state
    admit:
      - {row: TF-051}
    comparators: [TF-050, TD-059]
    notes: Rescaled Marcus value, not independent of dg_hyd_ca_marcus.

  # ================================================================ R-slurry: C1 adhesion inputs
  gamma_ow_alumina:
    symbol: gamma_ow
    unit: J m^-2
    regimes: [R-slurry]
    status: gap
    reason: >-
      gap: no interfacial free energy of hydroxylated alumina against water; calorimetric surface enthalpies
      (TB-052, TB-053, TB-056) are proxies (E2) and simulation gives only complete wetting (TH-060, TH-061)
    comparators: [TB-052, TB-053, TB-056, TH-060, TH-061]
  gamma_op:
    symbol: gamma_op
    unit: J m^-2
    regimes: [R-slurry]
    status: gap
    reason: gap - no oxide-polymer interfacial free energy was found (T-H gaps)
  gamma_o_alumina:
    distinct: true
    symbol: gamma_o
    unit: J m^-2
    regimes: [R-slurry]
    conditions: anodic and hot-water-treated Al oxide films against air (Owens-Wendt), dry comparator only
    admit:
      - {row: TH-062}
      - {row: TH-063}
      - {row: TH-064}
      - {row: TH-065}
    notes: Air-exposed oxides show water angles of 57-91 degrees against 0 simulated for clean hydroxylated alumina (lit/conflicts.md).
  gamma_p_pda:
    symbol: gamma_p
    unit: J m^-2
    regimes: [R-slurry]
    conditions: polydopamine films against air (van Oss and Owens-Wendt), dry comparator only
    admit:
      - {row: TH-050}
      - {row: TH-053}
      - {row: TH-055, original: 10.1039/d2ra03911g-b}
      - {row: TH-057, original: 10.1039/d2ra03911g-c}
    comparators: [TH-058]
    notes: TH-058 is chitosan.
  delta_f_pmf:
    symbol: Delta_F_pmf
    unit: J
    regimes: [R-slurry]
    status: computed
    reason: computed by the study (PMF in explicit water); not a literature input (X2)
    comparators: [TD-025, TD-026, TD-027, TD-028, TD-030]
  w_adh_wet_catechol_oxide_analog:
    distinct: true
    symbol: W_adh_wet
    unit: J m^-2
    regimes: [R-slurry]
    role: analog
    of: delta_f_pmf
    conditions: measured works of adhesion in water of catechol-bearing films on oxide surfaces (mica, SiO2, CuO), surface forces apparatus, pH 3 to 7.5
    admit:
      - {row: TD-025}
      - {row: TD-026}
      - {row: TD-027}
      - {row: TD-028}
      - {row: TD-030}
      - {row: TM-034}
      - {row: TM-035}
      - {row: TM-036}
      - {row: TM-038}
      - {row: TM-039}
    comparators: [TM-037, TD-032]
    notes: >-
      Flagged analog (A1, cp2 gap policy) for the C1 work of adhesion in water, which the study computes from delta_f_pmf
      and a_c. No source measures a polydopamine film on an aluminium oxide in water; these are DOPA-protein and
      catecholic-surfactant films on mica, silica and copper oxide. TM-037 (film against film) and TD-032 (dry,
      upper-bound estimate) are comparators. Run beside the C1 route, never in its place.
  a_c:
    symbol: A_c
    unit: m^2
    regimes: [R-slurry]
    status: computed
    reason: computed by the study (contact area of the simulated fragment) (X2)

  # ================================================================ R-slurry: C4 conformality and film (R-cell)
  rho_e_caco3:
    symbol: rho_e
    unit: ohm m
    regimes: [R-cell]
    status: gap
    reason: gap - no electronic resistivity of pure CaCO3 was found (T-G gaps)
  phi_b_caco3:
    symbol: phi_B
    unit: J
    regimes: [R-cell]
    status: gap
    reason: >-
      gap: no tunnelling barrier height of a CaCO3 film; Al oxide tunnel barriers (TG-021 to TG-025) are proxies (E2);
      the CaCO3 band gap is key band_gap_caco3
    comparators: [TG-021, TG-022, TG-023, TG-024, TG-025]
  band_gap_caco3:
    symbol: E_g_CaCO3
    unit: J
    regimes: [R-cell]
    conditions: calcite, UV-vis absorption estimate
    admit:
      - {row: TG-020}
    comparators: [TG-019]
    notes: Upper bound on phi_B; TG-019 (6.0 eV) is abstract only.
  j_0_tunnel:
    symbol: j_0
    unit: A m^-2
    regimes: [R-cell]
    status: gap
    reason: gap - no tunnelling prefactor for a carbonate film; TG-026 is an Al oxide proxy decay constant (E2)
    comparators: [TG-026]
  r_a_max:
    symbol: R_A_max
    unit: ohm m^2
    regimes: [R-cell]
    status: registered
    reason: registration input set at G2 (theory/derivation_body.tex section 11), not a literature value (X2)
  j_req:
    symbol: j_req
    unit: A m^-2
    regimes: [R-cell]
    status: registered
    reason: registration input set at G2, not a literature value (X2)
  d_film:
    symbol: d_film
    unit: m
    regimes: [R-cell]
    status: design-input
    reason: the film thickness is the variable that the bound d_max limits; it is not sampled from literature

  # ================================================================ C5: thermochemistry (aqueous Pourbaix and Li-referenced window)
  g_phase_database:
    symbol: G_phase
    unit: J mol^-1
    regimes: [shared]
    status: computed
    reason: computed from the materials database (W5) with the ACC offset; the fetched formation energies below are benchmarks (X2)
  mu_li0:
    symbol: mu_Li0
    unit: J mol^-1
    regimes: [R-cell]
    status: computed
    reason: the Li-metal reference energy is taken from the same materials database as G_phase (X2)
  delta_g_r:
    symbol: Delta_G_r
    unit: J mol^-1
    regimes: [R-cell]
    status: computed
    reason: computed from G_phase of reactants and products (X2)
  mu_h2o:
    symbol: mu_H2O
    unit: J mol^-1
    regimes: [R-slurry]
    status: computed
    reason: computed from dfg_h2o_l and the regime water activity, mu = G + RT ln a_w (X2)
  drg_caco3_decomposition:
    symbol: Delta_rG_CaCO3_CaO_CO2
    unit: J mol^-1
    regimes: [shared]
    conditions: CaCO3(calcite) -> CaO + CO2(g), 298.15 K, standard states of the tables
    admit:
      - {row: TI-010}
      - {row: TI-051, op: negate}
    comparators: [TI-011, TI-053]
    notes: Benchmark of the CO2 reference scheme (W5). Two evaluations (USGS B2131; USGS OFR 83-79) differ by 1.6 kJ/mol, about their combined 2 sigma.
    correlation_group: caco3_decomposition
  drh_caco3_decomposition:
    symbol: Delta_rH_CaCO3_CaO_CO2
    unit: J mol^-1
    regimes: [shared]
    conditions: CaCO3(calcite) -> CaO + CO2(g), 298.15 K
    admit:
      - {row: TI-009}
      - {row: TI-050, op: negate}
    comparators: [TI-052]
    correlation_group: caco3_decomposition
  dfg_caco3_calcite: {symbol: G_phase, unit: J mol^-1, regimes: [shared], conditions: "298.15 K, 1 bar", admit: [{row: TI-002}, {row: TI-056}], correlation_group: caco3_decomposition}
  dfg_caco3_aragonite: {symbol: G_phase, unit: J mol^-1, regimes: [shared], conditions: "298.15 K", admit: [{row: TI-004}]}
  dfg_cao: {symbol: G_phase, unit: J mol^-1, regimes: [shared], conditions: "298.15 K", admit: [{row: TI-006}, {row: TI-057}], correlation_group: caco3_decomposition}
  dfg_co2_g: {symbol: G_phase, unit: J mol^-1, regimes: [shared], conditions: "298.15 K, ideal gas", admit: [{row: TI-008}], correlation_group: caco3_decomposition}
  dfg_ca2_aq: {symbol: G_phase, unit: J mol^-1, regimes: [R-slurry], conditions: "298.15 K, m = 1 standard state", admit: [{row: TI-012}]}
  dfg_co3_aq: {symbol: G_phase, unit: J mol^-1, regimes: [R-slurry], conditions: "298.15 K, m = 1", admit: [{row: TI-014}]}
  dfg_hco3_aq: {symbol: G_phase, unit: J mol^-1, regimes: [R-slurry], conditions: "298.15 K, m = 1", admit: [{row: TI-016}]}
  dfg_co2_aq: {symbol: G_phase, unit: J mol^-1, regimes: [R-slurry], conditions: "298.15 K, m = 1, derived from H2CO3 un-ionized", admit: [{row: TI-019}]}
  dfg_h2o_l: {symbol: G_phase, unit: J mol^-1, regimes: [R-slurry], conditions: "298.15 K", admit: [{row: TI-020}]}
  dfg_al3_aq: {symbol: G_phase, unit: J mol^-1, regimes: [R-slurry], conditions: "298.15 K, m = 1", admit: [{row: TI-022}]}
  dfg_al_oh4_aq:
    symbol: G_phase
    unit: J mol^-1
    regimes: [R-slurry]
    conditions: 298.15 K, from alkaline solubility measurements
    admit:
      - {row: TB-032}
    notes: Grade D (abstract) admitted under E5, no grade A-C row; B2131's value was not legible (T-I gaps).
  dfg_corundum: {symbol: G_phase, unit: J mol^-1, regimes: [shared], conditions: "298.15 K", admit: [{row: TI-024}]}
  dfg_boehmite:
    symbol: G_phase
    unit: J mol^-1
    regimes: [shared]
    conditions: 298.15 K
    admit:
      - {row: TI-026}
    comparators: [TB-033]
    notes: TB-033 (-917.82 kJ/mol, grade D) agrees.
  dfg_gibbsite:
    symbol: G_phase
    unit: J mol^-1
    regimes: [shared]
    status: gap
    reason: gap - B2131 gibbsite DfG not legible in the extracted text and TB-035 (grade D) is not a usable value
    comparators: [TI-028, TB-035]
  dfg_ca_no3_2: {symbol: G_phase, unit: J mol^-1, regimes: [R-cell], conditions: "298.15 K, crystalline", admit: [{row: TI-030}]}
  dfg_cacl2: {symbol: G_phase, unit: J mol^-1, regimes: [R-cell], conditions: "298.15 K, crystalline", admit: [{row: TI-032}]}
  dfg_caso4: {symbol: G_phase, unit: J mol^-1, regimes: [R-cell], conditions: "298.15 K, anhydrite", admit: [{row: TI-034}]}
  dfg_al2_so4_3: {symbol: G_phase, unit: J mol^-1, regimes: [R-cell], conditions: "298.15 K, crystalline", admit: [{row: TI-036}]}
  dfg_li_aq: {symbol: G_phase, unit: J mol^-1, regimes: [R-cell], conditions: "298.15 K, m = 1", admit: [{row: TI-038}]}
  dfg_licl: {symbol: G_phase, unit: J mol^-1, regimes: [R-cell], conditions: "298.15 K, crystalline", admit: [{row: TI-040}]}
  dfg_lino3: {symbol: G_phase, unit: J mol^-1, regimes: [R-cell], conditions: "298.15 K, crystalline", admit: [{row: TI-048}]}
