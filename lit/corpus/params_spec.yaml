  # ================================================================ R-cell
  li2co3_oxidation_onset:
    symbol: E_Li
    unit: V
    regimes: [R-cell]
    distinct: true
    conditions: Li2CO3 electro-oxidation onset vs Li+/Li by gas evolution, LiTFSI glyme electrolytes, room temperature
    admit:
      - {row: TK-059, original: mahne-2018}
      - {row: TI-059, original: mahne-2018}
      - {row: TK-062, original: wang-2022-conclusions}
      - {row: TI-061, original: wang-2022-fig1}
    comparators: [TI-060, TI-063, TK-060, TK-063, TK-064]
    notes: >-
      cp3 R2: the carbonate-oxidation reading rests on Li2CO3 oxidation being measured near its equilibrium value. Wang
      2022 states the onset at two places (Fig. 1a text and conclusions), kept as two readings of one source. Both
      sources print the equilibrium potential (li2co3_oxidation_equilibrium_potential, TK-058, TK-061) and measure the
      onset by gas evolution at about that value, and both state that the onset lies close to it (TK-060, TK-063,
      qualitative). TK-064 (contrary): in LiPF6 EC/EMC, CO2 above 4.3 V comes from a chemical route even with Li2CO3
      isolated from the electrode. TI-063 (about 3.5 V, chemical route via protons) is grade D and contrary.
  li2co3_oxidation_equilibrium_potential:
    distinct: true
    symbol: E_Li
    unit: V
    regimes: [R-cell]
    conditions: thermodynamic potential of 2 Li2CO3 -> 4 Li+ + 4 e- + 2 CO2 + O2 vs Li+/Li, 298 K, as printed by each source
    admit:
      - {row: TK-058}
      - {row: TK-061}
    notes: >-
      The equilibrium potential printed by the two onset sources (cp3 R2). W5's all-experimental route gives the same
      reaction from JANAF (gas_reference.md, B6); that is W5's computation, not a row.
  transfer_free_energy_li_water_pc:
    symbol: Delta_G_tr_Li
    unit: J mol^-1
    regimes: [R-cell]
    conditions: Li+ water -> propylene carbonate, 25 C (IUPAC selected)
    admit:
      - {row: TI-077}
    notes: >-
      Marcus 1983 states that a value printed to one decimal is one on which sources agree within 1 to 2 kJ mol^-1
      (TK-004); the extrathermodynamic assumptions agree within about 6 kJ mol^-1 in general (TK-006, Gritzner 1988).
      No Li+ value was found for EC, DMC or the sulfone.
  solvation_ca_vs_li:
    symbol: Delta_G_solv_Ca_vs_Li
    unit: J mol^-1
    regimes: [R-cell]
    status: gap
    reason: >-
      gap (cp3 R10, searched on day 3): no single-ion Gibbs energy of transfer of Ca2+ from water into any registered
      electrolyte solvent (PC, EC, DMC, EC:DMC, EC:EMC, ethyl isopropyl sulfone) or any other aprotic solvent was found
      in an open source; the IUPAC selections (Marcus 1983, TI-077 context; Gritzner 1988) give none for Ca2+.
      TI-078/TI-079 are Ca-BF4 cluster energies, not single-ion values
    comparators: [TI-078, TI-079]
    notes: >-
      Solvated-sink input of C5 R-cell: Delta_G_solv(Ca2+) - 2 Delta_G_solv(Li+) in the electrolyte. The aqueous analog
      solvation_ca_vs_li_water_analog is flagged and runs beside the gap; no R-cell pass can count while this is a gap
      (cp2 fix F5).
  solvation_al_vs_li:
    symbol: Delta_G_solv_Al_vs_Li
    unit: J mol^-1
    regimes: [R-cell]
    status: gap
    reason: >-
      gap (cp3 R10, searched on day 3): no Al3+ transfer or solvation Gibbs energy in any registered electrolyte
      solvent or other aprotic solvent was found in an open source; Al3+ is absent from the IUPAC transfer selections
    notes: >-
      Solvated-sink input of C5 R-cell: Delta_G_solv(Al3+) - 3 Delta_G_solv(Li+) in the electrolyte. The aqueous analog
      solvation_al_vs_li_water_analog is flagged and runs beside the gap.
  hydration_free_energy_li:
    symbol: Delta_G_hyd
    unit: J mol^-1
    regimes: [R-cell]
    conditions: single-ion hydration Gibbs energy, gas to water, 298.15 K (Marcus 1991 scale, read through an open secondary source)
    admit:
      - {row: TK-001}
    notes: Grade D (the original is paywalled; read through a quoting paper). Input of the aqueous analogs only.
  hydration_free_energy_ca:
    symbol: Delta_G_hyd
    unit: J mol^-1
    regimes: [R-cell]
    conditions: as hydration_free_energy_li
    admit:
      - {row: TK-002}
    comparators: [TD-054]
    notes: >-
      Grade D, same original as TD-054 (dg_hyd_ca_marcus, read from another quoting source). Input of the aqueous analogs
      only; dg_hyd_ca_* remain the anchor's comparison keys.
  hydration_free_energy_al:
    symbol: Delta_G_hyd
    unit: J mol^-1
    regimes: [R-cell]
    conditions: as hydration_free_energy_li
    admit:
      - {row: TK-003}
    notes: Grade D. Input of the aqueous analog only.
  solvation_ca_vs_li_water_analog:
    symbol: Delta_G_solv_Ca_vs_Li
    unit: J mol^-1
    regimes: [R-cell]
    role: analog
    of: solvation_ca_vs_li
    derive: {expr: "g_ca - 2 * g_li", inputs: {g_ca: hydration_free_energy_ca, g_li: hydration_free_energy_li}}
    notes: >-
      Flagged analog (A1): the relative solvation of Ca2+ against two Li+ in water, not in the electrolyte. The transfer
      into a carbonate solvent is unknown for Ca2+ (gap), so the analog's verdict is conditional on water standing in
      for the solvent.
  solvation_al_vs_li_water_analog:
    symbol: Delta_G_solv_Al_vs_Li
    unit: J mol^-1
    regimes: [R-cell]
    role: analog
    of: solvation_al_vs_li
    derive: {expr: "g_al - 3 * g_li", inputs: {g_al: hydration_free_energy_al, g_li: hydration_free_energy_li}}
    notes: Flagged analog (A1) in water, as solvation_ca_vs_li_water_analog.
  a_h_cell:
    symbol: a_H_cell
    unit: "1"
    regimes: [R-cell]
    status: gap
    reason: gap - no measured proton activity of a fluorine-free carbonate electrolyte; the charter's pH analogue stays null
  a_ca_cell:
    symbol: a_Ca
    unit: "1"
    regimes: [R-cell]
    status: design-input
    reason: no Ca is added to the electrolyte; any Ca2+ comes from the layer itself (charter), so there is no literature range
  a_co3_cell:
    symbol: a_CO3
    unit: "1"
    regimes: [R-cell]
    status: gap
    reason: gap - no inorganic carbonate activity of a fluorine-free electrolyte was found

