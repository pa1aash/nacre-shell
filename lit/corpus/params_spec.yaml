  # ================================================================ thresholds inputs (theory/thresholds.md section 4)
  p_cred:
    symbol: p_cred
    unit: "1"
    regimes: [shared]
    registered: {file: theory/thresholds.md, block: thresholds, path: decision.conventions.p_cred,
                 ruling: "cp2 ruling 2026-10-17 (decision D14)"}
    notes: Credible level of the verdict bands; the registered sweep is reported beside the primary result.
  p_deg:
    symbol: p_deg
    unit: "1"
    regimes: [shared]
    registered: {file: theory/thresholds.md, block: thresholds, path: decision.conventions.p_deg,
                 ruling: "cp2 ruling 2026-10-17 (decision D14)",
                 sweep_from: {name: p_cred, path: decision.conventions.p_cred}}
    notes: >-
      Registered as the rule p_deg = 1 - p_cred, so it moves with the p_cred sweep; the sweep here is that rule
      applied to the registered p_cred sweep.
  m_cos:
    symbol: m_cos
    unit: "1"
    regimes: [R-slurry]
    registered: {file: theory/thresholds.md, block: thresholds, path: decision.conventions.m_cos,
                 ruling: "cp2 ruling 2026-10-17 (decision D14)"}
    notes: C3 margin on cos(theta); zero primary because the interfacial-energy priors carry the method error.
  contact_area_definition: {symbol: A_c_rule, unit: "1", regimes: [R-slurry], status: registered, reason: "registration convention named by theory/thresholds.md (C1, Q5); no ruling text in the cp2 or cp3 record available to this table, so it is not filled"}
  framing: {symbol: framing, unit: "1", regimes: [R-slurry], status: registered, reason: "registration at cp3 (lane note N5): ACC or calcite; the cp3 ruling text on the framing is not in this table's inputs; keys gamma_nl_*, v_m_*, log10_ksp_* and gamma_nv_* carry both framings"}
  n_req:
    symbol: N_req
    unit: m^-2
    regimes: [R-slurry]
    status: registered
    derive: {expr: "log(1 / (1 - p_cred)) / A_patch", inputs: {p_cred: p_cred, A_patch: patch_area}, as: none}
    notes: >-
      Registered rule N_req = ln(1/q_0)/A_patch with q_0 = 1 - p_cred (cp3 R5, decision D19), derived per draw from
      patch_area and the registered p_cred (its sweep moves N_req). It replaces the cp2 rule 1/A_patch (fix F4,
      decision D14) in P0-W1.4 (README section 8). Undetermined while patch_area is a gap.
  gas_reference_schemes: {symbol: gas_reference_schemes, unit: "1", regimes: [R-cell], status: registered, reason: "registration (cp3 packet decision 3); the ruling text on the scheme set is not in this table's inputs. cp3 R2 sets the margin of the all-experimental route (window_margin_expt); the benchmark drg_caco3_decomposition and W5's gas_reference.md bear on the choice"}
  al_phases: {symbol: al_phases, unit: "1", regimes: [R-cell], status: registered, reason: "registration named by theory/thresholds.md (C5 R-cell); no ruling text available to this table"}
  m_s:
    symbol: m_S
    unit: J m^-2
    regimes: [R-slurry]
    margin_zero:
      reason: >-
        S_spread = gamma_sl - gamma_sn - gamma_nl is evaluated only on priors: gamma_nl_* and gamma_sl0_template are
        uniform over their sourced spans (U1, T1), whose width already holds the scatter between methods (a factor of
        6.8 for calcite), and gamma_sn has the ignorance prior U[0, gamma_p + gamma_nv] (theory/ignorance_priors.md
        1a), which covers every admissible value, so no method error lies outside it. Delta_gamma_w = 0 by the
        registered rule. Nothing in S_spread is a single computed number whose systematic error the priors miss.
    notes: Threshold margin of C4 (theory/thresholds.md conventions, m_S); the zero case of README 7.3.
  m_seq_method_error:
    symbol: m_seq
    unit: J mol^-1
    regimes: [R-slurry]
    conditions: mean unsigned error of hybrid DFT against CCSD(T)/CBS for Ca2+-ligand (La-to-Ca exchange) energies, gas phase
    admit:
      - {row: TE-061, original: 10.1021/acs.jpcb.0c11077-m06}
      - {row: TE-062, original: 10.1021/acs.jpcb.0c11077-hse06}
      - {row: TE-063, original: 10.1021/acs.jpcb.0c11077-m062x}
    status: single-source
    comparators: [TE-081, TE-082, TE-067]
    notes: >-
      Electronic-structure error only. m_seq does not include the implicit-solvation error (stated at P0-W1.3 for cp3
      decision 8): that error is the separate key implicit_solvation_error_ion, and m_seq_with_solvation is their sum,
      a labelled sensitivity. W1 keeps the electronic-structure error as m_seq because the anchor's binding cycle and
      the single-source widening (W1) are defined against the electronic-structure benchmark of Ca2+-ligand
      energies; the solvation error belongs to the solvated cycle and is reported beside it.
  implicit_solvation_error_ion:
    symbol: m_solv
    unit: J mol^-1
    regimes: [R-slurry]
    distinct: true
    conditions: mean absolute error of implicit-solvent hydration free energies of ions against experiment, water, 298 K
    admit:
      - {row: TE-081}
      - {row: TE-082}
    status: single-source
    comparators: [TE-067]
    notes: >-
      Cations (TE-081) and anions (TE-082) of one benchmark paper with the semi-empirical implicit model used for the
      anchor geometries. TE-067 (SMD ions, abstract only, grade D) is a comparator under E5. Not part of m_seq.
  m_seq_with_solvation:
    symbol: m_seq
    unit: J mol^-1
    regimes: [R-slurry]
    role: sensitivity
    of: m_seq_method_error
    derive: {expr: "m_el + m_solv", inputs: {m_el: m_seq_method_error, m_solv: implicit_solvation_error_ion}}
    notes: >-
      Labelled sensitivity for cp3 decision 8: m_seq plus the implicit-solvation error of ions. Never decides a verdict
      and is not used for the W1 widening.
  contact_angle_method_error:
    symbol: dtheta
    unit: rad
    regimes: [R-slurry]
    conditions: deviation of force-field water contact angles from experiment on silica surfaces
    admit:
      - {row: TL-088}
    comparators: [TL-087, TL-089]
    notes: The closest benchmarked method error of a computed wetting free energy found (T-L).
  m_w_adh_wet:
    symbol: m_W
    unit: J m^-2
    regimes: [R-slurry]
    margin_case: evidence
    derive: {expr: "g_w * dth", inputs: {g_w: gamma_w, dth: contact_angle_method_error}}
    notes: >-
      Case evidence (README 7.3): the work of adhesion of water follows Young-Dupre, W = gamma_w (1 + cos theta), so a
      contact-angle error dtheta moves W by at most gamma_w dtheta (|d cos theta / d theta| <= 1). With the benchmarked
      force-field contact-angle error (TL-088, silica) this is the systematic error of a computed wet adhesion free
      energy per area that no prior carries: the C1 work is a computed number (delta_f_pmf), not a sampled prior.
      TL-087 (immersion enthalpies within 0 to 7 mJ m^-2) is consistent in size and is a comparator (an enthalpy). No
      catechol-on-alumina benchmark exists.
  termination_weights:
    symbol: termination_weights
    unit: "1"
    regimes: [R-slurry]
    status: gap
    reason: >-
      gap (cp3 ruling R8): no fetched distribution of the populated native-oxide terminations on Al foil in alkaline
      water. Reporting rule: C1 is reported per termination, and the mixture over terminations uses an ignorance
      mixture (weights uniform on the simplex of the registered terminations); no point weight is set.
    notes: >-
      cp3 R8: termination weights are a gap. The verdict per termination is reported; the mixture verdict is computed
      under the ignorance mixture and labelled as such. Hydroxyl-type evidence found on day 3 (TM-047,
      TM-048: single-crystal faces, qualitative) is listed in lit/conflicts.md and does not give weights.
  m_eff_tunnel:
    symbol: m_eff
    unit: kg
    regimes: [R-cell]
    status: gap
    reason: gap - no effective tunnelling mass for a CaCO3 film was searched or found; outstanding for P0-W1.3
  window_margin:
    symbol: m_E
    unit: V
    regimes: [R-cell]
    margin_case: evidence
    derive: {expr: "e_form * 5 / (2 * F)", inputs: {e_form: formation_energy_mae}}
    notes: >-
      Margin of the DFT-based schemes (janaf, mp) for the registered reaction CaCO3 + 2 LiClO4 -> Ca(ClO4)2 + CO2 +
      1/2 O2 + 2 Li, from fetched method-error evidence (README 7.3, case evidence): e_form per atom times the atoms
      whose DFT error does not cancel, per transferred electron. In W5's exchange route Ca(ClO4)2 enters as 2 LiClO4
      plus a tabulated enthalpy, so the LiClO4 energies cancel and only the 5 atoms of CaCO3 carry a DFT error; 2
      electrons move. Other reactions scale by their own count of uncancelled atoms per electron. W5's provisional value
      counted every solid atom, which double counts the cancelling salt. The gas references are the schemes' own and
      are benchmarked separately (gas_reference.md); this margin does not carry them.
  window_margin_expt:
    symbol: m_E
    unit: V
    regimes: [R-cell]
    margin_case: evidence
    derive:
      expr: "(u_caclo4 + 2 * u_liclo4 + u_co2 + u_caco3 + T0 * ds) / (2 * F)"
      inputs: {u_caclo4: u_tab_dfh_ca_clo4_2, u_liclo4: u_tab_dfh_liclo4, u_co2: u_tab_dfg_co2,
               u_caco3: u_tab_dfg_caco3, ds: exchange_entropy_bound}
    notes: >-
      cp3 R2: m_expt, the experimental uncertainty budget of the all-experimental route for the registered reaction
      CaCO3 + 2 LiClO4 -> Ca(ClO4)2 + CO2 + 1/2 O2 + 2 Li (2 electrons). In that route Delta_G = DfH(Ca(ClO4)2) -
      2 DfH(LiClO4) + DfG(CO2) - DfG(CaCO3), the LiClO4 free energies cancelling; the budget is the linear sum of the
      tabulated uncertainties of those inputs (as printed: 2 sigma for USGS B2131, the stated value for JANAF, the upper
      end of the NBS convention) plus the bound on the neglected exchange entropy times 298.15 K. A linear sum is used
      because the budget is a bound, not a standard deviation.

  # ================================================================ regime inputs, R-slurry (charter/regimes.yaml)
