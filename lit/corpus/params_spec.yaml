  # ================================================================ PH-W1.3 additions (rule version 3, section 8)
  hydration_free_energy_al_marcus:
    added_in: P0-W1.PH-W1.3
    symbol: Delta_G_hyd
    unit: J mol^-1
    regimes: [R-cell]
    role: sensitivity
    of: hydration_free_energy_al
    conditions: Al3+ single-ion hydration Gibbs energy, 298 K, Marcus 1991 scale (proton reference -1056 kJ mol^-1), read in the full text of a quoting paper; standard state not printed there
    admit:
      - {row: TT-054}
    comparators: [TK-003]
    notes: >-
      Same original determination as hydration_free_energy_al (TK-003, grade D, from -4525 kJ mol^-1); this key carries the
      full-text reading at grade C. The standard state of the Marcus compilation is not printed in the quoting papers;
      hydration_standard_state_offset gives the shift between the two conventions.
  hydration_free_energy_al_tissandier_scale:
    added_in: P0-W1.PH-W1.3
    symbol: Delta_G_hyd
    unit: J mol^-1
    regimes: [R-cell]
    role: sensitivity
    of: hydration_free_energy_al
    conditions: Al3+ hydration Gibbs energy rescaled to the cluster-pair proton scale (-264.0 kcal mol^-1, 1 atm gas to 1 mol/L)
    admit:
      - {row: TT-055}
    notes: Rescaled Marcus value, not independent of hydration_free_energy_al_marcus (as dg_hyd_ca_tissandier for Ca2+).
  hydration_free_energy_proton_tissandier:
    added_in: P0-W1.PH-W1.3
    symbol: Delta_G_hyd
    unit: J mol^-1
    regimes: [R-cell]
    conditions: proton hydration Gibbs energy of the cluster-pair method, 298 K, 1 mol/L in both phases
    admit:
      - {row: TF-050}
    comparators: [TD-059]
    notes: >-
      Input of the Tissandier-scale keys. TD-059 is the abstract-only reading of the same value (E3). The printed
      uncertainty is read as a standard uncertainty (E4).
  hydration_free_energy_li_conventional:
    added_in: P0-W1.PH-W1.3
    symbol: Delta_G_hyd
    unit: J mol^-1
    regimes: [R-cell]
    conditions: Li+ conventional aqueous solvation free energy (proton set to zero), 298 K, 1 mol/L in both phases
    interval: "(-oo, oo)"
    interval_reason: >-
      Conventional scale (proton set to zero): Li+ is positive here (+575.3 kJ/mol), while the symbol Delta_G_hyd
      (interval (-oo, 0)) is the absolute scale. The key's own admissible interval replaces the symbol's.
    admit:
      - {row: TT-056, original: tissandier-1998}
      - {row: TT-057, original: fawcett-1999}
    notes: >-
      Printed without a sign in the conventional scale. Two originals print the same number, tabulated in one paper, so
      the width is not sourced (P1). Add the proton value (hydration_free_energy_proton_tissandier) for a real-scale value.
  hydration_free_energy_li_tissandier_scale:
    added_in: P0-W1.PH-W1.3
    symbol: Delta_G_hyd
    unit: J mol^-1
    regimes: [R-cell]
    role: sensitivity
    of: hydration_free_energy_li
    derive: {expr: "c + p", inputs: {c: hydration_free_energy_li_conventional, p: hydration_free_energy_proton_tissandier}, as: none}
    notes: >-
      Li+ hydration Gibbs energy on the cluster-pair proton scale (D1): the conventional value plus the proton value. The
      Marcus-scale key hydration_free_energy_li differs by the proton convention.
  log10_ksp_aragonite_25c_i0:
    added_in: P0-W1.PH-W1.6
    symbol: K_sp
    transform: log10
    unit: "1"
    regimes: [R-slurry]
    role: sensitivity
    of: log10_ksp_aragonite
    conditions: aragonite, 298.15 K, I -> 0 (activity basis), CaCO3 = Ca2+ + CO3 2-
    admit:
      - {row: TT-131}
    comparators: [TC-045, TC-046]
    notes: >-
      Labelled alternative to log10_ksp_aragonite (a rounded -8.34 read from tertiary compilations, 20 to 25 C, no
      uncertainty). The row prints -8.336 +- 0.020 (1 sigma) at 25 C and zero ionic strength, from Plummer and
      Busenberg 1982 (paywalled, not read) through the WATEQ4F table. TC-045 and TC-046 round the same original. Check
      against evaluated formation energies (not admitted, a different quantity): DfG aragonite -1127.4 (TI-004),
      Ca2+ -553.6 (TI-012), CO3 2- -527.0 (TI-014) kJ/mol give DrG 46.8 kJ/mol, log10 Ksp -8.20 +- 0.32, which agrees
      with the printed value within one standard uncertainty. Whether a consumer reads this key in place of the
      primary is decided at cp5b.
  log10_ksp_brushite:
    added_in: P0-W1.PH-W1.7
    symbol: K_sp
    transform: log10
    unit: "1"
    regimes: [R-slurry]
    conditions: >-
      brushite CaHPO4.2H2O = Ca2+ + HPO4 2- + 2 H2O, 298.15 K, activity product (Ca2+)(HPO4 2-) per CaHPO4.2H2O formula
      unit, Debye-Hueckel activity coefficients at the low ionic strength of the ternary Ca(OH)2-H3PO4-H2O system,
      saturated solutions at pH 3.5 to 7
    admit:
      - {row: TR-081}
    notes: >-
      Single source (Gregory et al. 1970); the paper prints Ks = 2.561e-7 +- 0.048e-7 at 25 C (2.534e-7 with Davies),
      log10 and the width derived in the row. Solubility passes through a maximum near 25 C. Formula-unit basis: one
      Ca per unit, so no factor between formula units. Brushite is a precursor phase and a competing phase.
  log10_ksp_atcp:
    added_in: P0-W1.PH-W1.7
    symbol: K_sp
    transform: log10
    unit: "1"
    regimes: [R-slurry]
    conditions: >-
      alpha-tricalcium phosphate Ca3(PO4)2, per Ca3(PO4)2 formula unit (ion product (Ca2+)^3 (PO4 3-)^2), temperature and
      ionic-strength basis not stated by the review
    admit:
      - {row: TR-103}
    notes: >-
      Grade D only (review table, secondary citation of Fowler and Kuroda; the primary was not reached, so no grade A to
      C row exists and E5 admits the D row). The width is not sourced (P1); a normal prior is excluded by rule. Same
      basis as log10_ksp_btcp (per Ca3(PO4)2), so the two are comparable.
  log10_ksp_li3po4:
    added_in: P0-W1.PH-W1.7
    symbol: K_sp
    transform: log10
    unit: "1"
    regimes: [R-slurry]
    conditions: >-
      Li3PO4 = 3 Li+ + PO4 3-, per Li3PO4 formula unit, concentration product (c_Li+/c0)^3 (c_PO4/c0) with c0 = 1 M,
      no activity coefficients and no phosphate protonation, conductivity of a saturated suspension in distilled
      water (ionic strength about 0.016 mol/L), room temperature not stated
    admit:
      - {row: TR-121}
    comparators: [TR-078, TR-079, TR-076]
    notes: >-
      Single source (Michael thesis, 2022): (1.3 +- 0.2)e-9 on a concentration basis. The widely quoted 2.37e-11
      (TR-078, TR-079, one original not checked, grade D, convention not given) is lower by about 1.7 log units and
      is not admitted (E5). The solubility row TR-076 gives a concentration product of order 5e-10 by the same ideal
      formula. A consumer comparing with an activity product at other ionic strength has to convert; the key is not
      an activity-basis constant.
  log10_ksp_ocp_ca4h_basis:
    added_in: P0-W1.PH-W1.7
    symbol: K_sp
    transform: log10
    unit: "1"
    regimes: [R-slurry]
    conditions: >-
      octacalcium phosphate, 296.65 K (23.5 C), ion activity product (Ca2+)^4 (H+) (PO4 3-)^3, that is per half of the
      printed formula unit Ca8H2(PO4)6.5H2O (a Ca4H(PO4)3.2.5H2O unit), pH about 5 to 6, extended Debye-Hueckel
    admit:
      - {row: TR-120}
    notes: >-
      Same determination and value as log10_ksp_ocp (Tung et al. 1988), with the basis stated by the paper's own
      IP(OCP) expression, which the existing key's conditions do not follow (they name the Ca8 dissolution). The
      existing key is not edited. Conversion to the Ca8H2(PO4)6 basis: log10 K(Ca8) = 2 log10 K(Ca4H), documented
      in lit/corpus/params_README.md section 9. Not independent of log10_ksp_ocp.
  ph_additive_h3po4_dose_wt_active:
    added_in: P0-W1.PH-W1.8
    symbol: w_h3po4_active
    unit: "1"
    regimes: [R-slurry]
    distinct: true
    conditions: >-
      H3PO4 added as a slurry pH controller in aqueous electrode processing, as a mass fraction of the active material
      (NMC622, LTO); printed in wt%, the acid concentration is not stated (Tolchard, Carvalho) or is a 33% aqueous
      solution (Xu); solids loading or water volume not printed
    admit:
      - {row: TR-122}
      - {row: TR-123}
      - {row: TR-124}
    notes: >-
      Doses tested: 0.5 and 1 wt% (NMC622, Tolchard 2023), 0.67 to 2.68 wt% (LTO, Xu 2022, Bresser group), 1 wt% (LTO,
      Carvalho 2016). Resulting pH: LTO 6.7 at 1 wt% (TA-014) against 11.4 without acid (TA-013); LTO after 2 h milling
      10.8, 10.4, 9.6, 9.1 at 0.67, 1.34, 2.01, 2.68 wt% (TR-132..TR-135), initial pH below 6 to below 5 (TR-136..TR-138).
      No pH printed for Tolchard 2023. The dose in mol per kg active is the mol-basis key below.
  ph_additive_h3po4_dose_wt_total_solids:
    added_in: P0-W1.PH-W1.8
    symbol: w_h3po4_solids
    unit: "1"
    regimes: [R-slurry]
    conditions: >-
      H3PO4 (purity 99.99%) as a mass fraction of the total electrode material (NMC811, carbon black, Na-CMC), aqueous
      slurry, 0.5 wt%; pH and solids loading not printed
    admit:
      - {row: TR-125}
    comparators: [TR-126]
    notes: >-
      Single source (Chen 2024). Kukay 2020 (TR-126, 0.5 to 1.5 wt%, solids loading 55%) prints no basis for its
      percentage and is not admitted (E2).
  ph_additive_h3po4_dose_mol_per_kg_active:
    added_in: P0-W1.PH-W1.8
    symbol: n_h3po4_per_active
    unit: mol kg^-1
    regimes: [R-slurry]
    conditions: >-
      H3PO4 amount per mass of NMC811, aqueous and water-isopropanol 80:20 slurries, 92:5:3 NMC811:Super C45:binder,
      solid content 50% (45% for Na alginate), acid concentration not stated, pH below 9.0
    admit:
      - {row: TR-127}
    notes: >-
      Single source (TA-008 paper). The mass of 1 M solution of the other mol-type dose (TR-128) cannot be converted
      because the density of the solution is not printed.
  ph_additive_h3po4_solution_mass_per_g_active:
    added_in: P0-W1.PH-W1.8
    symbol: m_h3po4_soln_per_active
    unit: "1"
    regimes: [R-slurry]
    conditions: >-
      mass of 1 mol dm^-3 H3PO4 solution per mass of NMC811 (g/g), solid content 60%, pH below 8.6
    admit:
      - {row: TR-128}
    notes: >-
      Single source. Not a mol dose until the density of the 1 M solution is known; kept as printed.
  p_total_slurry_h3po4_window:
    added_in: P0-W1.PH-W1.8
    symbol: P_T_h3po4_window
    unit: mol m^-3
    regimes: [R-slurry]
    status: gap
    reason: >-
      gap: the solids loading is printed for three H3PO4-dosed slurries (50% and 60% in the TA-008 and TA-009 papers,
      55% in Kukay 2020) but none prints the liquid volume or a liquid density, and the density of water-isopropanol
      80:20 or of 1 M H3PO4 was not found in an open source (PH-W1.8, details in lit/corpus/T-R/gaps.md), so the dose per
      dm^3 (1 mol dm^-3 = 1000 mol m^-3, the loader's SI unit) is not derived; the dose is held per mass of active material in the keys ph_additive_h3po4_dose_*
  p_c_site_square:
    added_in: P0-W1.PH-W1.6
    symbol: p_c_site_square
    unit: "1"
    regimes: [R-slurry]
    conditions: site percolation threshold of the infinite square lattice
    admit:
      - {row: TT-132, original: feng-deng-blote-2008}
      - {row: TT-133, original: newman-ziff-2001}
    notes: >-
      Coverage criterion f_min = 1 - p_c of the hydrolysis film. A mathematical constant of the lattice, so the
      conditions of the table do not apply. The wider Monte Carlo entries of the Feng table (same paper) are not counted again.
  p_c_site_triangular:
    added_in: P0-W1.PH-W1.6
    symbol: p_c_site_triangular
    unit: "1"
    regimes: [R-slurry]
    conditions: site percolation threshold of the infinite triangular lattice
    admit:
      - {row: TT-134}
    notes: Printed as an exact value in the table of the paper. A point without an uncertainty (P1).
  p_c_site_sc:
    added_in: P0-W1.PH-W1.6
    symbol: p_c_site_sc
    unit: "1"
    regimes: [R-slurry]
    conditions: site percolation threshold of the infinite simple cubic lattice
    admit:
      - {row: TT-135}
      - {row: TT-136, original: ballesteros-1997}
    notes: >-
      Lorenz and Ziff 1998 (abstract) and the entry of Ballesteros et al. in their Table I; a grade C row is admitted,
      so the prior is uniform over the sourced span.
  hydration_standard_state_offset:
    added_in: P0-W1.PH-W1.3
    symbol: Delta_G_hyd_standard_state_offset
    unit: J mol^-1
    regimes: [R-cell]
    status: definitional
    fixed_from: TT-058
    conditions: DhydG* (1 mol/L in both phases) minus DhydG0 (ideal gas at 1 atm to 1 mol/L), 298.15 K, per ion
    notes: Same for every ion. It is a shift between conventions, not an uncertainty of any hydration value.
  hydration_free_energy_clo4:
    added_in: P0-W1.PH-W1.3
    symbol: Delta_G_hyd
    unit: J mol^-1
    regimes: [R-cell]
    status: gap
    reason: >-
      gap (PH-W1.3): no single-ion hydration Gibbs energy of ClO4- in an open source. Marcus 1991 (10.1039/ft9918702995)
      covers 109 ions and is paywalled, abstract only; the Madrid-2019 perchlorate paper (10.1016/j.molliq.2025.128035) has no
      retrievable copy; the 2017 volume-based hydration-enthalpy table (10.1039/c6ra25804b) lists enthalpies, not Gibbs
      energies; the conventional table of Kelly et al. (TT-056) holds the halides and alkali ions only
  transfer_free_energy_clo4_water_pc:
    added_in: P0-W1.PH-W1.3
    symbol: Delta_G_tr
    unit: J mol^-1
    regimes: [R-cell]
    conditions: ClO4- single-ion Gibbs energy of transfer water to propylene carbonate, 25 C, mol dm^-3 scale (one determination, ferrocene assumption)
    admit:
      - {row: TT-059}
    notes: >-
      One determination of twelve in the table, no selected value printed. Li+ has transfer_free_energy_li_water_pc. Not
      widened: the W1 clause names Ca2+ binding and transfer energies, and this is neither.
  transfer_free_energy_ca_water_pc:
    added_in: P0-W1.PH-W1.3
    symbol: Delta_G_tr
    unit: J mol^-1
    regimes: [R-cell]
    status: gap
    reason: >-
      gap (PH-W1.3): Ca2+ is not listed for propylene carbonate in the IUPAC selections read (Marcus 1983 Table 24;
      Gritzner 1988); searches for Ca2+ transfer into propylene carbonate, ethylene carbonate or dimethyl carbonate in
      openalex, crossref and semanticscholar returned only solvation-structure simulations
  transfer_free_energy_al_water_pc:
    added_in: P0-W1.PH-W1.3
    symbol: Delta_G_tr
    unit: J mol^-1
    regimes: [R-cell]
    status: gap
    reason: >-
      gap (PH-W1.3): Al3+ is not listed for propylene carbonate in the IUPAC selections read (Marcus 1983 Table 24;
      Gritzner 1988); no other source was found
  glass_dfh_cameta_crystal:
    added_in: P0-W1.PH-W1.3
    distinct: true
    symbol: H_phase
    unit: J mol^-1
    regimes: [R-cell]
    conditions: Ca(PO3)2 crystal (alpha, beta, gamma), 298 K, from stable elements; CALPHAD assessment
    admit:
      - {row: TT-060}
      - {row: TT-062}
      - {row: TT-064}
    notes: >-
      The three polymorph entries of one assessment (Ding et al. 2015, the Ca(PO3)2 values taken from Hudon and Jung), so
      one source; the 2 kJ mol^-1 steps between polymorphs are a modelling choice. The gap key dfh_cameta (added at PH-W1.2, so not
      a cp3 gap key and not named by `fills`) is left as it was; this key carries the evidence for it.
  glass_s_cameta_crystal:
    added_in: P0-W1.PH-W1.3
    distinct: true
    symbol: S_phase
    unit: J K^-1 mol^-1
    regimes: [R-cell]
    role: sensitivity
    of: s_cameta
    conditions: Ca(PO3)2 crystal (alpha, beta, gamma), 298 K; CALPHAD assessment
    admit:
      - {row: TT-061}
      - {row: TT-063}
      - {row: TT-065}
    notes: Assessed entropies beside the tabulated value of s_cameta (TR-031); the glass entropy glass_s0_cameta_glass remains a gap.
  glass_crystal_correction_cameta_calphad:
    added_in: P0-W1.PH-W1.3
    symbol: H_phase
    unit: J mol^-1
    regimes: [R-cell]
    status: computed
    derive:
      expr: g - c
      inputs:
        g: glass_dfh_cameta_glass
        c: glass_dfh_cameta_crystal
      as: none
    notes: >-
      Supplies the correction that the gap key glass_crystal_correction_cameta lacks (that key is left as it was). Glass minus
      crystal DfH for Ca(PO3)2 (D1): the NBS glass value (TR-032) against the assessed crystal values; positive
      means the crystal is the more stable. The envelope covers only the polymorph spread; the uncertainty of the assessed
      crystal enthalpy and of the tabulated glass enthalpy is not printed. Analogs: NaPO3 glass minus crystal
      (glass_crystal_correction_napo3) and LiPO3 (glass_crystal_correction_lipo3), whose range spans both signs.
  conversion_brushite_monetite_onset:
    added_in: P0-W1.PH-W1.3
    symbol: T_conversion
    unit: K
    regimes: [shared]
    conditions: brushite heated in air, first detection of monetite by high-temperature XRD, 10 C/min with 30 min holds
    admit:
      - {row: TT-066}
    comparators: [TT-074, TT-076]
    notes: >-
      One source, a preprint. The lower values of older work (135 C in humid air; 105 C and 165 C with an intermediate)
      are secondary citations, grade D, and are not admitted beside a grade B row (E5). The onset moves with heating rate,
      hold time and water vapour pressure.
  conversion_brushite_dehydration_range:
    added_in: P0-W1.PH-W1.3
    symbol: T_conversion
    unit: K
    regimes: [shared]
    conditions: natural brushite, thermogravimetry with evolved-gas MS, 5 C/min in nitrogen, dehydration to CaHPO4
    admit:
      - {row: TT-070}
    comparators: [TT-072]
    notes: A temperature range of the dehydration step, printed as 110 to 215 C; the review value of about 220 C (TT-072) cites the same original.
  conversion_monetite_pyrophosphate_onset:
    added_in: P0-W1.PH-W1.3
    distinct: true
    symbol: T_conversion
    unit: K
    regimes: [shared]
    conditions: monetite or dehydrated brushite heated to condensation, XRD appearance of crystalline Ca2P2O7 (TT-068), TG step (TT-071), review value (TT-073)
    admit:
      - {row: TT-068}
      - {row: TT-071}
      - {row: TT-073}
    comparators: [TT-075, TT-077]
    notes: >-
      Different measurements (first XRD detection at 10 C/min with holds; a TG step at 5 C/min; a review value without
      stated conditions), so the span is partly a method spread. Grade D values (430 C in humid air, 500 C) are secondary
      citations and are not admitted beside grade B and C rows (E5).
  conversion_pyrophosphate_gamma_beta:
    added_in: P0-W1.PH-W1.3
    symbol: T_conversion
    unit: K
    regimes: [shared]
    conditions: gamma to beta Ca2P2O7, DTA exotherm at 10 C/min in air
    admit:
      - {row: TT-069}
    notes: One source. The same paper's stepwise XRD shows the beta form at 650 C.
  hydrolysis_polyp_k_ph7_to_13:
    added_in: P0-W1.PH-W1.3
    symbol: k_hydrolysis
    unit: s^-1
    regimes: [R-slurry]
    status: gap
    reason: >-
      gap (PH-W1.3): no numeric hydrolysis rate constant of a linear polyphosphate between pH 7 and 13 was retrievable. The
      classical studies (Crowther and Westman 1954 and 1956, 65.5 C, pH 2 to 13.3; Kura 1987 alkaline cyclo-polyphosphates;
      Watanabe 1982 cation effects) are paywalled, abstract only, and the abstracts hold no rate constants. TT-078 bounds
      hydrolysis below 10 % in 30 min at pH 7.0 and about 21 C
    comparators: [TT-078, TT-079, TT-081, TT-082]
  hydrolysis_tetrameta_ph_min_rate:
    added_in: P0-W1.PH-W1.3
    symbol: pH_min_hydrolysis
    unit: "1"
    regimes: [R-slurry]
    conditions: sodium tetrametaphosphate in water at 65.5 C, pH 2.5 to 13.3; abstract only
    admit:
      - {row: TT-080}
    notes: Grade D, abstract only. The rate is base catalysed above this pH and acid catalysed below it; a cyclic phosphate, an analog of chain hydrolysis, not of a chain.
  coacervate_gamma_analog_complex_pair:
    added_in: P0-W1.PH-W1.3
    distinct: true
    symbol: gamma_nl
    unit: J m^-2
    regimes: [R-slurry]
    role: analog
    of: coacervate_gamma_nl
    conditions: coacervate of poly(acrylic acid) and quaternized poly(dimethylaminoethyl methacrylate) against its dilute phase, pH 6.5, 100 mmol/L NaCl, 25 C, N* 69.5 to 485.6
    admit:
      - {row: TT-083}
      - {row: TT-084}
      - {row: TT-085}
      - {row: TT-086}
    comparators: [TT-087, TT-088, TT-089, TT-090, TT-042]
    notes: >-
      Analog (A1): a synthetic polyelectrolyte pair, not a polyphosphate. Four chain lengths of one paper, so one source,
      single-source flag. The infinite-chain fit (TT-087, 1000 uN/m) is a fit and not admitted; the abstract-only values
      (204 uN/m, order 100 uN/m, below 1 mN/m) are grade D and not admitted beside grade B rows (E5). Beside
      coacervate_gamma_analog (PDADMAC with polyacrylate, 311 uN/m); it never replaces the gap key coacervate_gamma_nl.
