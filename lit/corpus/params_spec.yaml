    conditions: standard molar entropy at 298.15 K, KClO4 crystal
    admit:
      - {row: TK-028}
    notes: Input of the Ca(ClO4)2 entropy bound (cp3 R2).
  s_ca_clo4_2:
    symbol: S_std
    unit: J K^-1 mol^-1
    regimes: [R-cell]
    status: gap
    reason: >-
      gap (cp3 R10): no table gives S(298.15 K) of anhydrous Ca(ClO4)2 or of any anhydrous alkaline-earth perchlorate;
      the only solid calcium perchlorate entropy is the tetrahydrate (TK-023)
    comparators: [TK-023, TK-022, TK-024, TK-025, TK-026]
    notes: The analog bound is s_ca_clo4_2_analog_low and s_ca_clo4_2_analog_high.
  s_ca_clo4_2_analog_low:
    symbol: S_std
    unit: J K^-1 mol^-1
    regimes: [R-cell]
    role: analog
    of: s_ca_clo4_2
    derive: {expr: "min(cacl2 + 2 * (liclo4 - licl), cacl2 + 2 * (naclo4 - nacl), cacl2 + 2 * (kclo4 - kcl), cano3 + 2 * (liclo4 - lino3), cano3 + 2 * (naclo4 - nano3), cano3 + 2 * (kclo4 - kno3))", inputs: {cacl2: s_cacl2, cano3: s_ca_no3_2, liclo4: s_liclo4, naclo4: s_naclo4, kclo4: s_kclo4, licl: s_licl, nacl: s_nacl, kcl: s_kcl, lino3: s_lino3, nano3: s_nano3, kno3: s_kno3}}
    notes: >-
      Lower end of the analog bound (cp3 R2): S(CaX2) + 2 [S(MClO4) - S(MX)] for X = Cl, NO3 and M = Li, Na, K, the
      anion-exchange increment taken from alkali salts of one table set. With M = Li the estimate is the exchange
      entropy of Ca + 2 LiX -> CaX2 + 2 Li carried over to the perchlorate. Within one anion the tabulated crystal
      entropies rise Mg < Ca < Sr < Ba (chlorides TK-018 to TK-021, nitrates TK-014 to TK-017), so the Ca salt sits
      between its neighbours, as the analog assumes.
  s_ca_clo4_2_analog_high:
    symbol: S_std
    unit: J K^-1 mol^-1
    regimes: [R-cell]
    role: analog
    of: s_ca_clo4_2
    derive: {expr: "max(cacl2 + 2 * (liclo4 - licl), cacl2 + 2 * (naclo4 - nacl), cacl2 + 2 * (kclo4 - kcl), cano3 + 2 * (liclo4 - lino3), cano3 + 2 * (naclo4 - nano3), cano3 + 2 * (kclo4 - kno3))", inputs: {cacl2: s_cacl2, cano3: s_ca_no3_2, liclo4: s_liclo4, naclo4: s_naclo4, kclo4: s_kclo4, licl: s_licl, nacl: s_nacl, kcl: s_kcl, lino3: s_lino3, nano3: s_nano3, kno3: s_kno3}}
    notes: >-
      Upper end of the analog bound, as s_ca_clo4_2_analog_low. Independent upper check: the tetrahydrate entropy
      (TK-023) exceeds it, as an anhydrous salt must lie below its hydrate.
  exchange_entropy_bound:
    symbol: Delta_S_ex
    unit: J K^-1 mol^-1
    regimes: [R-cell]
    status: computed
    derive:
      expr: "max(abs(lo + 2 * li - ca - 2 * liclo4), abs(hi + 2 * li - ca - 2 * liclo4))"
      inputs: {lo: s_ca_clo4_2_analog_low, hi: s_ca_clo4_2_analog_high, li: s_li, ca: s_ca, liclo4: s_liclo4}
    notes: >-
      Bound on |Delta_S| of the exchange Ca + 2 LiClO4 -> Ca(ClO4)2 + 2 Li, the entropy that W5's all-experimental
      route neglects when it enters Ca(ClO4)2 through the tabulated exchange enthalpy (cp3 R2).
  dfh_ca_clo4_2:
    symbol: H_phase
    unit: J mol^-1
    regimes: [R-cell]
    conditions: anhydrous Ca(ClO4)2 crystal, 298.15 K (NBS TN 270-6)
    admit:
