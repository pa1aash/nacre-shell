  e_she_slurry:
    symbol: E_SHE
    unit: V
    regimes: [R-slurry]
    distinct: true
    conditions: mixed (open-circuit) potential of aluminium in alkaline aqueous media (1 M and 4 M NaOH; pH 8.8 water-glycol); not measured in a cathode slurry
