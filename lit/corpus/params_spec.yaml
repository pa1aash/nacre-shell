correlation_groups:
  young_energies:
    kind: assumed independent
    reason: >-
      The interfacial free energies of Young's relation share interfaces (lane note N2): independent draws can give
      |cos theta| > 1. No source reports a joint distribution, so they are declared a group with the identity matrix
      and the screen tests the sensitivity to that assumption.
  solubility:
    kind: assumed independent
    reason: >-
      The solubility products of the polymorphs share methods and originals, and acc_offset is RT ln10 times the
      difference of log10_ksp_acc and log10_ksp_calcite by construction. No source gives a correlation coefficient.
  carbonate_system:
    kind: assumed independent
    reason: >-
      The carbonate constants come from one critical evaluation lineage; pH and DIC co-vary in a slurry that takes up
      CO2. No source reports their joint distribution.
  cnt_fit:
    kind: assumed independent
    reason: >-
      Effective interfacial energies and kinetic prefactors come from the same CNT fits of nucleation rates, where
      they are strongly coupled; the fitted covariance is not printed in any admitted row.
  caco3_decomposition:
    kind: assumed independent
    reason: >-
      The reaction free energy and enthalpy are differences of the tabulated formation values (TI-002, TI-006,
      TI-008); no source prints their covariance.

