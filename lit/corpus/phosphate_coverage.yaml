    - TS-013
  phases_with_a_tier2_record:
    AlPO4 on Al foil: class A (TS-001 to TS-007; fluorinated LiPF6)
    AlPO4 on NMC622 collector cycled to 4.5 V: class B-type (TS-008)
    Li-Al-phosphate on LiCoO2 (abstract only): class B, grade D (TS-009, TS-010)
