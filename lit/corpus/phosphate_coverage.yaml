    Li3PO4 on NCA: class B (TS-014 to TS-016)
    AlPO4 on LiCoO2 (abstract only, seed): class B, grade D (TR-085 to TR-088)
  phases_without_any_tier2_record:
  - hydroxyapatite
  - acp
  - ocp
  - btcp
  - capp
  - cameta
  - Al(PO3)3
  - Al borate
  - Al oxalate
