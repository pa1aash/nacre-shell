conventions:
  young: >-
    theta is the contact angle of the spherical-cap nucleus measured through the nucleus;
    cos(theta) = (gamma_sl - gamma_sn)/gamma_nl with gamma_sn = gamma_sn0 + Delta_gamma_w.
    theta = 0 is complete wetting of the template by the nucleus (no barrier); theta = pi is
    no wetting (homogeneous barrier recovered).
  water_displacement: >-
    Delta_gamma_w = gamma_sn - gamma_sn0 > 0 is a cost. It belongs to the substrate-nucleus
    term of Young. It is zero by definition when gamma_sn is supplied as a full in-water
    interfacial free energy, and must then not be added again.
  gamma_eff: >-
    The deck's gamma_eff = gamma_nl - Delta_gamma_w is recorded (gamma_eff_deck) for the
    audit and the double-counting demonstration only. Young and the homogeneous barrier
    use the bare gamma_nl, because gamma_nl multiplies the cap area in the free energy whose
    factorisation gives Delta_G*_het = f(theta) Delta_G*_hom.
  supersaturation: >-
    One definition: Omega = IAP / K_sp for the registered framing, with bulk activities and one
    formula unit as the unit of amount. For CaCO3 IAP = a_Ca a_CO3; Delta_mu = k_B T ln Omega per
    formula unit, and V_m per formula unit. The charter's S (F3: S = IAP/K_sp) is this Omega; the
    per-ion square root never appears. Contract v5: for a mineral with nu_Ca Ca ions and nu_X, nu_Y
    ions of two anion types per formula unit, IAP = a_Ca^nu_Ca a_X^nu_X a_Y^nu_Y a_w^n (Omega_nu), see
    conventions.stoichiometry; CaCO3 is nu = 2 and reduces to the line above exactly.
  bookkeeping: >-
    Uniform chemical potential (contract v2). At equilibrium the electrochemical potentials
    of Ca2+ and CO3^2- are the same in the bulk, in the interfacial layer and at the binding
    sites, so the driving force for a nucleus at the template is k_B T ln Omega_bulk.
    Enrichment (specific binding, E_enr, or a mean potential psi) changes local
    concentrations, never the driving force. Template-ion interactions enter only the
    interfacial energies.
  adsorption: >-
    gamma_sl = gamma_sl0 + Delta_gamma_ads, with Delta_gamma_ads = -R T (Gamma_s ln(1 + x)
    - delta_s c_bulk) from the Gibbs adsorption equation and the Langmuir isotherm, and
    x = E_enr c_bulk / c_max. Reference state (contract v4, D27): gamma_sl0 is the same interface
    with no Ca2+ at the sites at the regime T, pH and ionic strength; the Gibbs integral changes
    the Ca2+ chemical potential only. A gamma_sl0 measured with Ca2+ present already contains the
    adsorption (add nothing, or only the difference between the two Ca2+ activities); one measured
    in pure water lacks the pH and ionic-strength terms. Admissibility (D27): gamma_sl >= 0 at every
    registered state; a draw with gamma_sl < 0 describes an interface that would grow without
    limit, is outside the model and is refused and counted, never clipped or floored. The term is a
    small-change expansion about the Ca-free interface; its validity ratio r_ads =
    -Delta_gamma_ads/gamma_sl0 is reported, and admissibility is r_ads <= 1. The Gibbs-Langmuir term is a neutral-solute approximation:
    Ca2+ adsorbs with its compensating charge. The cancellation of the mean potential in the
    ion product (derivation, Section 4 (ii)) does not cover the double-layer (electrocapillary)
    contribution to gamma_sl; the change of the diffuse-layer free energy with the surface
    charge is neglected and is a stated limitation. Ionic strength screens it (low-potential
    Gouy-Chapman: it falls as I^(-1/2) at a fixed change of charge). If gamma_sl is supplied directly at the regime activities
    (grand-canonical), Delta_gamma_ads is already inside it and must not be added again
    (the same rule as Delta_gamma_w). gamma_sn is the grand-canonical excess of the
    template-crystal contact at the regime chemical potentials: any Ca2+ excess at that contact
    (for example ion-bridged carboxylate-Ca-calcite) is inside it, with d gamma_sn / d mu_Ca =
    -Gamma_Ca_sn. Hence d(gamma_sl - gamma_sn)/d mu_Ca = -(Gamma_Ca_sl - Gamma_Ca_sn), with
    Gamma_Ca_sl = Gamma_Ca the template-liquid excess. Rule for supplied inputs: gamma_sn (or
    gamma_sn0 with Delta_gamma_w) comes from contact data at the regime state; Delta_G_seq and
    Delta_gamma_ads are never added to it. The rule does not assume Gamma_Ca_sn = 0; a contact
    energy supplied at another Ca2+ activity is flagged as off-state, never corrected with
    Delta_G_seq.
  speciation: >-
    Contract v3. a_Ca and a_CO3 in Omega_bulk are the free-ion activities from the carbonate
    speciation functions (a_CO3_speciation, a_Ca_speciation) at the registered pH, C_T, Ca_T and
    I, with the ion pairs CaCO3(aq), CaHCO3+ and CaOH+. Activity model: Davies for charged
    species, valid for I_ionic <= I_val (fetched), never beyond its turning point; neutral
    species take activity coefficient one; a draw with I_ionic > I_val is refused and counted.
    c_bulk of the C2 relations is the free Ca2+ concentration c_Ca_free, not Ca_T.
  stoichiometry: >-
    Contract v5. A mineral has nu = nu_Ca + nu_X + nu_Y ions per formula unit (for example calcite
    1 + 1 + 0 = 2, hydroxyapatite Ca5(PO4)3OH 5 + 3 + 1 = 9, octacalcium phosphate
    Ca8(HPO4)2(PO4)4.5H2O 8 + 4 + 2 = 14 with n = 5). Omega = IAP/K_sp, IAP = a_Ca^nu_Ca a_X^nu_X
    a_Y^nu_Y a_w^n, K_sp written for the same formula unit. Structural water enters only through
    a_w^n. The driving force of a nucleus of n_star formula units is n_star k_B T ln Omega at the
    uniform chemical potential; V_m is the molar volume of the formula unit. The per-ion forms
    k_B T ln Omega / nu and V_m / nu are forbidden in r_star, DG_hom and DG_het, whose expressions
    are unchanged and take Omega = Omega_nu and V_m = V_m_fu. A wrong nu is an exponent error in the
    IAP (ln_Omega_exponent_error), not a rescaling, and a per-ion driving force overstates the
    homogeneous barrier by nu^2 (DG_hom_per_ion).
  speciation_phosphate: >-
    Contract v5. a_PO4 and a_Ca are the free-ion activities of the phosphate speciation at the
    registered pH, P_T, Ca_T and I, with ion pairs CaHPO4(aq), CaH2PO4+, CaPO4- and CaOH+ (D_Ca of the
    carbonate system). Davies for charged species (charges one to three), valid for I_ionic <= I_val, a
    draw above it refused and counted; neutral species take activity coefficient one. Each pair holds
    one Ca and one phosphate, so the same positive root as the carbonate system closes both balances.
    The Davies equation is the least reliable at charge three: the validity bound is the registered
    one, and the sensitivity to it is reported, not absorbed.

functions:
  # ------------------------------------------------------------------ C1, adhesion in water
  - name: W_adh_wet
    claim: C1
    regime: R-slurry
    unit: J m^-2
    expression: gamma_ow + gamma_pw - gamma_op
    limits:
      - {at: {gamma_op: gamma_ow + gamma_pw}, expected: '0'}
    identities:
      - note: water competition written against the dry work of adhesion
        equals: '@W_adh_dry_fn + 2*gamma_w - (gamma_o + gamma_w - gamma_ow) - (gamma_p + gamma_w - gamma_pw)'
    monotonicity:
      - {wrt: gamma_op, direction: decreasing}
      - {wrt: gamma_ow, direction: increasing}
      - {wrt: gamma_pw, direction: increasing}

  - name: W_adh_dry_fn
    claim: C1
    regime: R-slurry
    unit: J m^-2
    expression: gamma_o + gamma_p - gamma_op
    note: comparator only (one axis); never the decisive observable

  - name: W_adh_wet_from_pmf
    claim: C1
    regime: R-slurry
    unit: J m^-2
    expression: Delta_F_pmf/A_c
    limits:
      - {at: {Delta_F_pmf: '0'}, expected: '0'}
    monotonicity:
      - {wrt: Delta_F_pmf, direction: increasing}
      - {wrt: A_c, direction: decreasing, domains: {Delta_F_pmf: '(0, oo)'}}

  # ------------------------------------------------------------------ C2, sequestration
  - name: Delta_G_seq_cycle
    claim: C2
    regime: R-slurry
    unit: J mol^-1
    expression: Delta_G_site + R_gas*T*log(1 + 10**(pKa - pH))
    note: >-
      single coordinating group that must lose one proton to bind; the correction is the
      free energy of finding the site deprotonated at the regime pH. A group that must lose two
      protons (a catecholate) uses Delta_G_seq_cycle_2H (contract v4). Multi-site and
      ionic-strength forms are open question Q4.
    limits:
      - {limit: {var: pH, to: oo}, expected: Delta_G_site}
      - {at: {pH: pKa}, expected: Delta_G_site + R_gas*T*log(2)}
    inequalities:
      - {expr: '@Delta_G_seq_cycle', relation: '>=', rhs: Delta_G_site}
    monotonicity:
      - {wrt: pH, direction: decreasing}

  - name: E_enr
    claim: C2
    regime: R-slurry
    unit: '1'
    expression: exp(-Delta_G_seq/(R_gas*T))
    limits:
      - {at: {Delta_G_seq: '0'}, expected: '1'}
      - {limit: {var: Delta_G_seq, to: -oo}, expected: oo}
      - {limit: {var: Delta_G_seq, to: oo}, expected: '0'}
    monotonicity:
      - {wrt: Delta_G_seq, direction: decreasing}
    validity: dilute Ca2+ and unsaturated binding sites (E_enr c_bulk << c_max)
    note: >-
      a concentration ratio (C2 reporting quantity); at equilibrium the local Ca2+ activity
      equals the bulk activity and the enrichment sits in a local activity coefficient, so
      E_enr does not enter Omega or Delta_mu (contract v2)

  - name: c_max
    claim: C2
    regime: R-slurry
    unit: mol m^-3
    expression: Gamma_s/delta_s

  - name: c_local
    claim: C2
    regime: R-slurry
    unit: mol m^-3
    expression: E_enr*c_bulk/(1 + E_enr*c_bulk/c_max)
    note: >-
      Langmuir closure of the binding layer; reduces to E_enr c_bulk when dilute. Reported for
      C2; it does not feed Omega (contract v2).
    limits:
      - {limit: {var: c_max, to: oo}, expected: E_enr*c_bulk}
      - {limit: {var: c_bulk, to: oo}, expected: c_max}
      - {at: {E_enr: '0'}, expected: '0'}
    inequalities:
      - {expr: '@c_local', relation: '<=', rhs: c_max}
      - {expr: '@c_local', relation: '<=', rhs: E_enr*c_bulk}
    monotonicity:
      - {wrt: E_enr, direction: increasing}
      - {wrt: c_bulk, direction: increasing}
      - {wrt: c_max, direction: increasing}

  - name: x_bind
    claim: C2
    regime: R-slurry
    unit: '1'
    expression: exp(-Delta_G_seq/(R_gas*T))*c_bulk*delta_s/Gamma_s
    note: Langmuir binding variable, the occupancy odds of a site at the regime activity
    identities:
      - note: x = E_enr c_bulk / c_max
        equals: '@E_enr*c_bulk/@c_max'
    limits:
      - {limit: {var: Delta_G_seq, to: oo}, expected: '0'}
      - {limit: {var: Delta_G_seq, to: -oo}, expected: oo}
    monotonicity:
      - {wrt: Delta_G_seq, direction: decreasing}
      - {wrt: c_bulk, direction: increasing}
      - {wrt: Gamma_s, direction: decreasing}

  - name: Theta_occ
    claim: C2
    regime: R-slurry
    unit: '1'
    expression: '@x_bind/(1 + @x_bind)'
    note: fraction of sites occupied (Langmuir); equals c_local / c_max
    identities:
      - note: occupancy is the Langmuir c_local over the saturation concentration
        equals: '(@E_enr*c_bulk/(1 + @E_enr*c_bulk*delta_s/Gamma_s))*delta_s/Gamma_s'
    limits:
      - {limit: {var: Delta_G_seq, to: oo}, expected: '0'}
      - {limit: {var: Delta_G_seq, to: -oo}, expected: '1'}
    inequalities:
      - {expr: '@Theta_occ', relation: '<', rhs: '1'}
    monotonicity:
      - {wrt: Delta_G_seq, direction: decreasing}
      - {wrt: c_bulk, direction: increasing}

  - name: Gamma_Ca
    claim: C2
    regime: R-slurry
    unit: mol m^-2
    expression: Gamma_s*@Theta_occ - delta_s*c_bulk
    note: >-
      Gibbs relative excess of Ca2+ at the template-liquid interface: the bound amount per area
      minus the bulk amount that the layer volume would hold without the template
    limits:
      - {limit: {var: Delta_G_seq, to: oo}, expected: -delta_s*c_bulk}
      - {limit: {var: Delta_G_seq, to: -oo}, expected: Gamma_s - delta_s*c_bulk}
    identities:
      - note: 'the excess vanishes at the zero-excess concentration c_0 = c_max (1 - 1/E_enr), where gamma_sl is lowest (contract v4)'
        subs: {c_bulk: (Gamma_s/delta_s)*(1 - exp(Delta_G_seq/(R_gas*T)))}
        equals: '0'
    monotonicity:
      - {wrt: Delta_G_seq, direction: decreasing}

  - name: Delta_gamma_ads
    claim: C2
    regime: R-slurry
    unit: J m^-2
    expression: -R_gas*T*(Gamma_s*log(1 + @x_bind) - delta_s*c_bulk)
    note: >-
      change of the template-liquid interfacial energy by Ca2+ adsorption at the regime
      activity: the Gibbs adsorption integral -int Gamma_Ca d mu_Ca from zero to the regime
      activity with the Langmuir isotherm (ideal dilute bulk), for Ca2+ with its compensating
      charge as a neutral solute; the double-layer (electrocapillary) term is neglected (stated
      limitation, screened by ionic strength). Zero when gamma_sl is already
      evaluated at the regime activities. It is the only route by which Delta_G_seq, Gamma_s
      and delta_s reach the barrier. A small-change expansion about the Ca-free interface: valid
      while -Delta_gamma_ads is small against gamma_sl0 (r_ads), admissible only while gamma_sl0 +
      Delta_gamma_ads >= 0 (contract v4, D27).
    derivative_identities:
      - {wrt: Delta_G_seq, equals: 'Gamma_s*@Theta_occ', note: 'each site contributes its occupancy: d gamma_sl / d Delta_G_seq = Gamma_s Theta'}
      - {wrt: c_bulk, equals: '-(R_gas*T/c_bulk)*@Gamma_Ca', note: 'Gibbs adsorption equation: d gamma_sl / d mu_Ca = -Gamma_Ca, with d mu_Ca = R T d ln c_bulk'}
    limits:
      - {limit: {var: Delta_G_seq, to: oo}, expected: R_gas*T*delta_s*c_bulk, note: 'a repulsive template is depleted and its gamma_sl rises (negative adsorption)'}
      - {limit: {var: Gamma_s, to: '0', dir: '+'}, expected: R_gas*T*delta_s*c_bulk}
      - {limit: {var: c_bulk, to: '0', dir: '+'}, expected: '0', note: 'the Ca-free reference state'}
    monotonicity:
      - {wrt: Delta_G_seq, direction: increasing}

  - name: gamma_sl_insitu
    claim: C3
    regime: R-slurry
    unit: J m^-2
    expression: gamma_sl0 + @Delta_gamma_ads
    note: template-liquid energy at the regime activities, built from the Ca-free energy
    validity: >-
      admissible only where gamma_sl_insitu >= 0 (contract v4, D27): a negative value describes an
      interface that lowers its free energy by growing, so the film would swell or disperse and the
      planar interface does not exist; such a draw is refused and counted, never clipped or floored
    limits:
      - {limit: {var: Delta_G_seq, to: oo}, expected: gamma_sl0 + R_gas*T*delta_s*c_bulk}
      - {limit: {var: Delta_G_seq, to: -oo}, expected: -oo, note: 'strong enough binding overshoots every gamma_sl0'}
      - {limit: {var: c_bulk, to: '0', dir: '+'}, expected: gamma_sl0, note: 'the Ca-free limit: admissibility reduces to gamma_sl0 >= 0 (cp3 R8)'}
    inequalities:
      - {expr: '@gamma_sl_insitu', relation: '<=', rhs: gamma_sl0 + R_gas*T*delta_s*c_bulk, note: 'adsorption can raise gamma_sl only by the bulk-depletion term'}
    monotonicity:
      - {wrt: gamma_sl0, direction: increasing}
      - {wrt: Delta_G_seq, direction: increasing}
      - {wrt: Gamma_s, direction: decreasing, note: 'more sites at the same affinity lower gamma_sl further'}

  # ------------------------------------------------------------------ admissibility of gamma_sl (v4, D27)
  # Derivation, Section 7 (Admissibility). The planar template-liquid interface exists only while gamma_sl >= 0.
  # Pi_ads is the lowering by adsorption (spreading pressure of the adsorbed layer); along the Ca2+
  # axis it is largest where the Gibbs excess vanishes, and that maximum, Pi_ads_max, depends on
  # Gamma_s and Delta_G_seq only. The analog route maps a solution complexation constant onto the
  # site free energy with the site-volume standard state and the two-proton cycle.
  - name: Pi_ads
    claim: C3
    regime: R-slurry
    unit: J m^-2
    expression: -@Delta_gamma_ads
    note: >-
      lowering of the template-liquid energy by Ca2+ adsorption at the regime activity: the
      two-dimensional osmotic (spreading) pressure of the occupied sites, R T Gamma_s ln(1 + x), less
      the bulk-depletion term R T delta_s c_bulk. Admissibility is Pi_ads <= gamma_sl0.
    derivative_identities:
      - {wrt: c_bulk, equals: '(R_gas*T/c_bulk)*@Gamma_Ca', note: 'Gibbs: Pi rises while the excess is positive and falls once it is negative'}
    identities:
      - note: 'at the zero-excess concentration c_0 = c_max (1 - 1/E_enr) the lowering reaches Pi_ads_max'
        subs: {c_bulk: (Gamma_s/delta_s)*(1 - exp(Delta_G_seq/(R_gas*T)))}
        equals: '@Pi_ads_max'
        numeric: true
    limits:
      - {limit: {var: c_bulk, to: '0', dir: '+'}, expected: '0'}
    inequalities:
      - {expr: '@Pi_ads', relation: '<=', rhs: R_gas*T*Gamma_s*log(1 + @x_bind)}
      - {expr: '@Pi_ads', relation: '<=', rhs: '@Pi_ads_max', domains: {Delta_G_seq: '(-oo, 0)'}, note: 'binding template: no Ca2+ activity lowers gamma_sl by more than Pi_ads_max'}

  - name: Pi_ads_max
    claim: C3
    regime: R-slurry
    unit: J m^-2
    expression: Gamma_s*(-Delta_G_seq - R_gas*T*(1 - exp(Delta_G_seq/(R_gas*T))))
    domains: {Delta_G_seq: '(-oo, 0)'}
    note: >-
      the largest lowering of the template-liquid energy by Ca2+ adsorption at any bulk Ca2+
      concentration, for a binding template (Delta_G_seq < 0); it is reached where the Gibbs excess
      vanishes, and with E_enr = exp(-Delta_G_seq/(R T)) it equals R T Gamma_s (ln E_enr - 1 + 1/E_enr).
      It depends on Gamma_s and Delta_G_seq only (delta_s sets where the maximum lies, not its
      height), never exceeds the binding free energy of a full layer of sites, -Gamma_s Delta_G_seq,
      and has no relation to gamma_sl0. A template with Delta_G_seq >= 0 lowers nothing.
    limits:
      - {limit: {var: Delta_G_seq, to: '0', dir: '-'}, expected: '0'}
      - {limit: {var: Delta_G_seq, to: -oo}, expected: oo}
    inequalities:
      - {expr: '@Pi_ads_max', relation: '>', rhs: '0'}
      - {expr: '@Pi_ads_max', relation: '<', rhs: -Gamma_s*Delta_G_seq, note: 'at most the binding free energy of a full layer of sites'}
    monotonicity:
      - {wrt: Delta_G_seq, direction: decreasing}
      - {wrt: Gamma_s, direction: increasing}

  - name: gamma_sl_floor
    claim: C3
    regime: R-slurry
    unit: J m^-2
    expression: gamma_sl0 - @Pi_ads_max
    domains: {Delta_G_seq: '(-oo, 0)'}
    note: >-
      the lowest template-liquid energy a binding template reaches at any bulk Ca2+ concentration;
      gamma_sl_floor >= 0 is sufficient for admissibility at every Ca2+ activity, whatever the dose
      (reported, not gating)
    inequalities:
      - {expr: '@gamma_sl_floor', relation: '<=', rhs: '@gamma_sl_insitu'}
    monotonicity:
      - {wrt: gamma_sl0, direction: increasing}
      - {wrt: Delta_G_seq, direction: increasing}
      - {wrt: Gamma_s, direction: decreasing}

  - name: r_ads
    claim: C3
    regime: R-slurry
    unit: '1'
    expression: -@Delta_gamma_ads/gamma_sl0
    domains: {gamma_sl0: '(0, oo)'}
    note: >-
      validity ratio of the small-change Gibbs-Langmuir term: the lowering by adsorption over the
      Ca-free energy. Admissible iff r_ads <= 1. The expansion assumes the adsorption leaves the
      interface structure unchanged, so an admitted draw with r_ads near one carries an error the
      term does not control; its distribution over admitted draws is reported (derivation, Section 7 (Admissibility))
    identities:
      - note: gamma_sl = gamma_sl0 (1 - r_ads)
        equals: 1 - @gamma_sl_insitu/gamma_sl0
    limits:
      - {limit: {var: c_bulk, to: '0', dir: '+'}, expected: '0'}
    monotonicity:
      - {wrt: Delta_G_seq, direction: decreasing}

  - name: Delta_G_seq_cycle_2H
    claim: C2
    regime: R-slurry
    unit: J mol^-1
    expression: Delta_G_site + R_gas*T*log(1 + 10**(pKa2 - pH) + 10**(pKa + pKa2 - 2*pH))
    note: >-
      a coordinating group that binds only after losing two protons (a catechol binding through both
      oxygens), pKa the first and pKa2 the second dissociation constant; the correction is the free
      energy of finding the group as the dianion at the regime pH, the ligand form a catecholate
      complexation constant refers to (derivation, Section 7 (Admissibility))
    limits:
      - {limit: {var: pH, to: oo}, expected: Delta_G_site}
      - {limit: {var: pKa, to: -oo}, expected: Delta_G_site + R_gas*T*log(1 + 10**(pKa2 - pH)), note: 'the first proton always gone: the one-proton cycle with pKa2'}
    inequalities:
      - {expr: '@Delta_G_seq_cycle_2H', relation: '>=', rhs: Delta_G_site + R_gas*T*log(1 + 10**(pKa2 - pH))}
      - {expr: '@Delta_G_seq_cycle_2H', relation: '>', rhs: '@Delta_G_seq_cycle', subs: {pKa2: pKa + aux_u}, note: 'with pKa2 > pKa the two-proton cost exceeds the one-proton cost of the first proton'}
    monotonicity:
      - {wrt: pH, direction: decreasing}
      - {wrt: pKa2, direction: increasing}

  - name: Delta_G_site_from_K
    claim: C2
    regime: R-slurry
    unit: J mol^-1
    expression: -R_gas*T*log(K_Ca_L*Gamma_s/(delta_s*c_std))
    note: >-
      ANALOG MAPPING. The site transfer free energy assigned from a solution complexation constant
      K_Ca_L (referenced to c_std) with the site-volume standard state V_site = delta_s/(N_A Gamma_s),
      Eq. [th:eq:stdstate]. A solution constant is not a surface-site free energy (site geometry,
      competition at the surface, coupling within a layer of fixed sites; derivation, Section 7 (Admissibility)), so a
      verdict that rests on it is conditional on the analog
    identities:
      - note: 'Delta_G_bind = Delta_G_site - R T ln(N_A c_std V_site) with Delta_G_bind = -R T ln K_Ca_L and V_site = delta_s/(N_A Gamma_s)'
        equals: -R_gas*T*log(K_Ca_L) + R_gas*T*log(N_A*c_std*delta_s/(N_A*Gamma_s))
    monotonicity:
      - {wrt: K_Ca_L, direction: decreasing}

  - name: x_bind_K
    claim: C2
    regime: R-slurry
    unit: '1'
    expression: K_Ca_L*(c_bulk/c_std)/(1 + 10**(pKa2 - pH) + 10**(pKa + pKa2 - 2*pH))
    note: >-
      the Langmuir odds x_bind along the analog route: x = alpha_2 K_Ca_L c_bulk/c_std, with alpha_2
      the dianion fraction. Gamma_s and delta_s drop out: the solution constant fixes the occupancy per
      bulk concentration directly, and Gamma_s sets only how many sites carry it
    identities:
      - note: x_bind with Delta_G_seq = Delta_G_seq_cycle_2H and Delta_G_site = Delta_G_site_from_K
        equals: exp(-(@Delta_G_site_from_K + R_gas*T*log(1 + 10**(pKa2 - pH) + 10**(pKa + pKa2 - 2*pH)))/(R_gas*T))*c_bulk*delta_s/Gamma_s
        numeric: true
    limits:
      - {limit: {var: pH, to: oo}, expected: K_Ca_L*c_bulk/c_std}
    monotonicity:
      - {wrt: pH, direction: increasing}
      - {wrt: c_bulk, direction: increasing}

  # ------------------------------------------------------------------ carbonate speciation (v3)
  # Activities of free Ca2+ and CO3^2- from pH, dissolved inorganic carbon C_T, total Ca_T and
  # ionic strength I, with the ion pairs CaCO3(aq), CaHCO3+ and CaOH+ (derivation, Section 4,
  # "Activities from speciation"). Activity model: Davies, valid for I <= I_val. Neutral species
  # take activity coefficient one. The constants are thermodynamic (I = 0) values from
  # lit/params.yaml. Mass balance gives a quadratic in a_CO3 with exactly one positive root,
  # written below in the cancellation-free form.
  - name: gamma_act_1
    claim: C3
    regime: R-slurry
    unit: '1'
    expression: 10**(-A_DH*(sqrt(I_ionic/m_std)/(1 + sqrt(I_ionic/m_std)) - b_D*I_ionic/m_std))
    note: Davies activity coefficient of a singly charged ion (output g_1)
    validity: 'I_ionic <= I_val (registered bound of the activity model, below the Davies turning point)'
    limits:
      - {at: {I_ionic: '0'}, expected: '1', note: 'I -> 0 gives ideal activities'}
      - {at: {A_DH: '0'}, expected: '1'}

  - name: gamma_act_2
    claim: C3
    regime: R-slurry
    unit: '1'
    expression: 10**(-4*A_DH*(sqrt(I_ionic/m_std)/(1 + sqrt(I_ionic/m_std)) - b_D*I_ionic/m_std))
    note: Davies activity coefficient of a doubly charged ion (output g_2); z^2 = 4
    identities:
      - note: the charge-two coefficient is the fourth power of the charge-one coefficient
        equals: '@gamma_act_1**4'
    limits:
      - {at: {I_ionic: '0'}, expected: '1'}

  - name: m_CT_fn
    claim: C3
    regime: R-slurry
    unit: '1'
    expression: C_T/(rho_water*m_std)
    note: dissolved inorganic carbon in standard molalities (output m_CT); dilute solution, molality = concentration / water density

  - name: m_CaT_fn
    claim: C3
    regime: R-slurry
    unit: '1'
    expression: Ca_T/(rho_water*m_std)
    note: total dissolved calcium in standard molalities (output m_CaT)

  - name: A_carb_fn
    claim: C3
    regime: R-slurry
    unit: '1'
    expression: 10**(pK1_carbonic + pK2_carbonic - 2*pH) + 10**(pK2_carbonic - pH)/g_1 + 1/g_2
    note: >-
      free carbon species per unit carbonate activity (output A_carb): CO2(aq) (activity
      coefficient one), HCO3- and CO3^2-, from a_HCO3 = a_H a_CO3 / K_2 and
      a_CO2 = a_H^2 a_CO3 / (K_1 K_2) with a_H = 10^-pH
    limits:
      - {at: {g_1: '1', g_2: '1'}, expected: 10**(pK1_carbonic + pK2_carbonic - 2*pH) + 10**(pK2_carbonic - pH) + 1, note: 'ideal activities'}
    monotonicity:
      - {wrt: pH, direction: decreasing, note: 'acidification shifts carbon from carbonate to bicarbonate and CO2'}

  - name: P_pair_fn
    claim: C3
    regime: R-slurry
    unit: '1'
    expression: K_CaCO3_aq + K_CaHCO3*10**(pK2_carbonic - pH)/g_1
    note: Ca-carbonate ion pairs per unit product a_Ca a_CO3 (output P_pair); CaCO3(aq) neutral, CaHCO3+ singly charged
    limits:
      - {at: {K_CaCO3_aq: '0', K_CaHCO3: '0'}, expected: '0', note: 'no ion pairs'}

  - name: D_Ca_fn
    claim: C3
    regime: R-slurry
    unit: '1'
    expression: 1/g_2 + K_CaOH*a_w*10**pH/g_1
    note: Ca2+ and CaOH+ per unit Ca2+ activity (output D_Ca), with a_CaOH = K_CaOH a_Ca a_w / a_H
    limits:
      - {at: {K_CaOH: '0', g_2: '1'}, expected: '1'}
    monotonicity:
      - {wrt: pH, direction: nondecreasing, note: 'hydrolysis to CaOH+ grows with pH (strictly where K_CaOH a_w > 0)'}

  - name: a_CO3_speciation
    claim: C3
    regime: R-slurry
    unit: '1'
    expression: >-
      2*m_CT*D_Ca/(A_carb*D_Ca + P_pair*(m_CaT - m_CT)
      + sqrt((A_carb*D_Ca + P_pair*(m_CaT - m_CT))**2 + 4*A_carb*P_pair*m_CT*D_Ca))
    note: >-
      free carbonate activity (output a_CO3): the positive root of
      A P y^2 + (A D + P (m_CaT - m_CT)) y - m_CT D = 0, which follows from the carbon balance
      m_CT = A y + P y a_Ca and the calcium balance m_CaT = a_Ca (D + P y). The product of the
      roots is -m_CT D / (A P) < 0, so exactly one root is positive.
    validity: 'Davies range I_ionic <= I_val; closed system at fixed C_T (no CO2 exchange); solution not yet precipitated'
    limits:
      - {at: {P_pair: '0'}, expected: m_CT/A_carb, note: 'no ion pairs: the carbonate system alone'}
      - {at: {m_CaT: '0'}, expected: m_CT/A_carb, note: 'no Ca: the carbonate system alone'}
      - {at: {m_CT: '0'}, expected: '0'}
    identities:
      - note: 'carbon balance: m_CT = y (A + P a_Ca) with a_Ca = m_CaT/(D + P y)'
        equals: m_CT/(A_carb + P_pair*m_CaT/(D_Ca + P_pair*@a_CO3_speciation))
        numeric: true
    inequalities:
      - {expr: '@a_CO3_speciation', relation: '<=', rhs: m_CT/A_carb, note: 'ion pairs can only lower the free carbonate'}
    monotonicity:
      - {wrt: m_CT, direction: increasing}
      - {wrt: m_CaT, direction: decreasing}

  - name: a_Ca_speciation
    claim: C3
    regime: R-slurry
    unit: '1'
    expression: m_CaT/(D_Ca + P_pair*a_CO3)
    note: free Ca2+ activity (output a_Ca) from the calcium balance, at the a_CO3 of a_CO3_speciation
    limits:
      - {at: {m_CaT: '0'}, expected: '0', note: 'no Ca'}
      - {at: {P_pair: '0', D_Ca: '1'}, expected: m_CaT, note: 'no pairs, no hydrolysis, ideal: all calcium is free'}
    monotonicity:
      - {wrt: m_CaT, direction: increasing}
      - {wrt: a_CO3, direction: decreasing}

  - name: c_Ca_free
    claim: C2
    regime: R-slurry
    unit: mol m^-3
    expression: a_Ca*rho_water*m_std/g_2
    note: >-
      free Ca2+ concentration of the regime state; it is the c_bulk of the Langmuir and Gibbs
      relations (C2), so c_bulk is the free ion, not the total Ca_T
    limits:
      - {at: {g_2: '1'}, expected: a_Ca*rho_water*m_std}

  # ------------------------------------------------------------------ supersaturation
  - name: Omega_bulk
    claim: C3
    regime: R-slurry
    unit: '1'
    expression: a_Ca*a_CO3/K_sp
    monotonicity:
      - {wrt: a_Ca, direction: increasing}
      - {wrt: K_sp, direction: decreasing}

  - name: Omega_bulk_hydrated
    claim: C3
    regime: R-slurry
    unit: '1'
    expression: a_Ca*a_CO3*a_w**n_hyd/K_sp
    sensitivity: true
    note: >-
      LABELLED SENSITIVITY ONLY (cp2 fix F7, Q13): the ion activity product of a hydrated framing
      CaCO3.nH2O, IAP = a_Ca a_CO3 a_w^n, with K_sp the solubility product of the same framing.
      The screen keeps IAP = a_Ca a_CO3 (Omega_bulk). For a_w < 1 the anhydrous form overstates
      Omega by the factor a_w^(-n), so drying states are optimistic in the screen. Evaluated where
      W1 supplies n; never used for a verdict.
    limits:
      - {at: {a_w: '1'}, expected: '@Omega_bulk', note: 'in the slurry (a_w = 1) the two forms agree'}
      - {at: {n_hyd: '0'}, expected: '@Omega_bulk'}
    inequalities:
      - {expr: '@Omega_bulk_hydrated', relation: '<=', rhs: '@Omega_bulk', domains: {a_w: '(0, 1]'}, note: 'the anhydrous IAP overstates Omega when a_w < 1 (bias toward feasibility at drying states)'}
    monotonicity:
      - {wrt: a_w, direction: nondecreasing}

  - name: Omega_local_ideal
    claim: C3
    regime: R-slurry
    unit: '1'
    expression: (c_local/c_bulk)*a_Ca*a_CO3/K_sp
    demonstration: true
    note: >-
      DEMONSTRATION ONLY (C3 item 13): the local-ideal bookkeeping of contract v1, which gives
      the locally enriched Ca2+ the bulk standard state and so credits the binding free energy
      to the driving force. Inconsistent at equilibrium (derivation, Section 7); never used for
      a verdict.
    identities:
      - note: dilute, unsaturated limit
        subs: {c_local: E_enr*c_bulk}
        equals: E_enr*@Omega_bulk
      - note: dilute limit with the Boltzmann factor written out
        subs: {c_local: exp(-Delta_G_seq/(R_gas*T))*c_bulk}
        equals: exp(-Delta_G_seq/(R_gas*T))*@Omega_bulk
    limits:
      - {at: {c_local: c_bulk}, expected: '@Omega_bulk'}

  - name: Delta_mu
    claim: C3
    regime: R-slurry
    unit: J
    expression: k_B*T*log(Omega)
    note: per CaCO3 formula unit; the screen evaluates it at Omega = Omega_bulk (uniform chemical potential)
    limits:
      - {at: {Omega: '1'}, expected: '0'}
    identities:
      - note: at the template the driving force is the bulk one
        subs: {Omega: '@Omega_bulk'}
        equals: k_B*T*log(a_Ca*a_CO3/K_sp)
    monotonicity:
      - {wrt: Omega, direction: increasing}

  - name: Delta_mu_local_ideal
    claim: C3
    regime: R-slurry
    unit: J
    expression: k_B*T*log(@Omega_local_ideal)
    demonstration: true
    note: >-
      DEMONSTRATION ONLY: the driving force the local-ideal bookkeeping would assign; its excess
      over k_B T ln Omega_bulk is the binding free energy counted as driving force
    identities:
      - note: in the dilute limit the excess credit is exactly -Delta_G_seq per Ca2+
        subs: {c_local: exp(-Delta_G_seq/(R_gas*T))*c_bulk}
        equals: k_B*T*log(@Omega_bulk) - k_B*T*Delta_G_seq/(R_gas*T)

  # ------------------------------------------------------------------ C3, nucleation
  - name: r_star
    claim: C3
    regime: R-slurry
    unit: m
    expression: 2*gamma_nl*V_m/(N_A*k_B*T*log(Omega))
    domains: {Omega: '(1, oo)'}
    limits:
      - {limit: {var: Omega, to: '1', dir: '+'}, expected: oo}
      - {limit: {var: Omega, to: oo}, expected: '0'}
    monotonicity:
      - {wrt: Omega, direction: decreasing}
      - {wrt: gamma_nl, direction: increasing}

  - name: DG_hom
    claim: C3
    regime: R-slurry
    unit: J
    expression: 16*pi*gamma_nl**3*V_m**2/(3*N_A**2*(k_B*T*log(Omega))**2)
    domains: {Omega: '(1, oo)'}
    limits:
      - {limit: {var: Omega, to: '1', dir: '+'}, expected: oo}
      - {limit: {var: Omega, to: oo}, expected: '0'}
    identities:
      - note: one third of the surface energy of the critical sphere
        equals: 4*pi*@r_star**2*gamma_nl/3
    monotonicity:
      - {wrt: Omega, direction: decreasing}
      - {wrt: gamma_nl, direction: increasing}
      - {wrt: V_m, direction: increasing}
      - {wrt: T, direction: decreasing}

  - name: f_theta
    claim: C3
    regime: R-slurry
    unit: '1'
    expression: (2 + cos(theta))*(1 - cos(theta))**2/4
    domains: {theta: '[0, pi]'}
    limits:
      - {at: {theta: '0'}, expected: '0'}
      - {at: {theta: pi}, expected: '1'}
      - {at: {theta: pi/2}, expected: 1/2}
    identities:
      - note: deck form, the same cubic in cos(theta)
        equals: (2 - 3*cos(theta) + cos(theta)**3)/4
      - note: spherical-cap volume fraction
        equals: (pi*(1 - cos(theta))**2*(2 + cos(theta))/3)/(4*pi/3)
    bounds:
      - {expr: '@f_theta', var: theta, interval: '[0, pi]', min: '0', max: '1'}
    monotonicity:
      - {wrt: theta, direction: nondecreasing}
    derivative_identities:
      - {wrt: theta, equals: 3*sin(theta)**3/4}

  - name: DG_het
    claim: C3
    regime: R-slurry
    unit: J
    expression: '@f_theta*@DG_hom'
    domains: {theta: '[0, pi]', Omega: '(1, oo)'}
    limits:
      - {at: {theta: '0'}, expected: '0'}
      - {at: {theta: pi}, expected: '@DG_hom'}
      - {at: {theta: pi/2}, expected: '@DG_hom/2'}
      - {at: {theta: pi/3}, limit: {var: Omega, to: '1', dir: '+'}, expected: oo}
    bounds:
      - {expr: '@DG_het/@DG_hom', var: theta, interval: '[0, pi]', min: '0', max: '1'}
    inequalities:
      - {expr: '@DG_het', relation: '<=', rhs: '@DG_hom', note: 'holds for every theta in [0, pi]'}
    monotonicity:
      - {wrt: theta, direction: nondecreasing}
      - {wrt: Omega, direction: nonincreasing}

  - name: B_acc
    claim: C3
    regime: R-slurry
    unit: J
    expression: k_B*T*log(J0_het*t_proc/N_req)
    note: >-
      largest barrier that still gives N_req nuclei per template area within t_proc, from
      J = J_0 exp(-DG_het / k_B T) and N = J t_proc (derivation, Section 5)
    limits:
      - {at: {N_req: J0_het*t_proc}, expected: '0'}
    monotonicity:
      - {wrt: J0_het, direction: increasing}
      - {wrt: t_proc, direction: increasing}
      - {wrt: N_req, direction: decreasing}

  - name: N_nuc
    claim: C3
    regime: R-slurry
    unit: m^-2
    expression: J0_het*t_proc*exp(-DG_het/(k_B*T))
    note: expected areal density of nuclei within t_proc (no exclusion zones, so an upper estimate)
    limits:
      - {at: {DG_het: '@B_acc'}, expected: N_req}
      - {at: {DG_het: '0'}, expected: J0_het*t_proc}
    monotonicity:
      - {wrt: DG_het, direction: decreasing}
      - {wrt: t_proc, direction: increasing}

  - name: cos_theta_young
    claim: C3
    regime: R-slurry
    unit: '1'
    expression: (gamma_sl - gamma_sn0 - Delta_gamma_w)/gamma_nl
    note: >-
      registered convention; bare gamma_nl in the denominator; displacement cost on the
      substrate side. gamma_sl is the template-liquid energy at the regime activities
      (gamma_sl0 + Delta_gamma_ads, or computed in situ).
    limits:
      - {at: {gamma_sl: gamma_sn0 + Delta_gamma_w + gamma_nl}, expected: '1'}
      - {at: {gamma_sl: gamma_sn0 + Delta_gamma_w - gamma_nl}, expected: '-1'}
      - {at: {gamma_sl: gamma_sn0 + Delta_gamma_w}, expected: '0'}
    monotonicity:
      - {wrt: Delta_gamma_w, direction: decreasing}
      - {wrt: gamma_sl, direction: increasing}
      - {wrt: gamma_sn0, direction: decreasing}
    validity: a finite contact angle exists only for |cos_theta_young| <= 1; above 1 the nucleus phase spreads (S_spread >= 0)

  - name: cos_theta_template
    claim: C3
    regime: R-slurry
    unit: '1'
    expression: (gamma_sl0 + @Delta_gamma_ads - gamma_sn0 - Delta_gamma_w)/gamma_nl
    note: >-
      Young for the screen, with the Ca2+ adsorption on the substrate-liquid side; the form the
      composite uses when gamma_sl is supplied Ca-free
    identities:
      - note: registered Young with the in-situ template-liquid energy
        equals: (@gamma_sl_insitu - gamma_sn0 - Delta_gamma_w)/gamma_nl
    monotonicity:
      - {wrt: Delta_G_seq, direction: increasing, note: 'stronger binding at fixed gamma_sl0 and gamma_sn lowers cos theta and raises the barrier'}
      - {wrt: gamma_sl0, direction: increasing}
      - {wrt: gamma_sn0, direction: decreasing}
      - {wrt: Delta_gamma_w, direction: decreasing}

  - name: theta_young
    claim: C3
    regime: R-slurry
    unit: rad
    expression: acos((gamma_sl - gamma_sn0 - Delta_gamma_w)/gamma_nl)
    limits:
      - {at: {gamma_sl: gamma_sn0 + Delta_gamma_w + gamma_nl}, expected: '0'}
      - {at: {gamma_sl: gamma_sn0 + Delta_gamma_w - gamma_nl}, expected: pi}
      - {at: {gamma_sl: gamma_sn0 + Delta_gamma_w}, expected: pi/2}

  - name: gamma_eff_deck
    claim: C3
    regime: R-slurry
    unit: J m^-2
    expression: gamma_nl - Delta_gamma_w
    note: deck form; audit and double-counting demonstration (C3 item 13) only
    monotonicity:
      - {wrt: Delta_gamma_w, direction: decreasing}

  - name: cos_theta_deck
    claim: C3
    regime: R-slurry
    unit: '1'
    expression: (gamma_sl - gamma_sn0)/(gamma_nl - Delta_gamma_w)
    note: >-
      the rejected alternative, Young with gamma_eff in the denominator; implemented only
      to demonstrate the sign reversal and the size of the double-counting error
    limits:
      - {at: {Delta_gamma_w: '0'}, expected: '@cos_theta_young_at0'}

  - name: cos_theta_young_at0
    claim: C3
    regime: R-slurry
    unit: '1'
    expression: (gamma_sl - gamma_sn0)/gamma_nl
    note: helper, the registered cos(theta) with no displacement correction

  # ------------------------------------------------------------------ C4, conformality
  - name: S_spread
    claim: C4
    regime: R-slurry
    unit: J m^-2
    expression: gamma_sl - gamma_sn0 - Delta_gamma_w - gamma_nl
    identities:
      - note: spreading coefficient through Young (partial-wetting branch)
        equals: gamma_nl*(@cos_theta_young - 1)
    limits:
      - {at: {gamma_sl: gamma_sn0 + Delta_gamma_w + gamma_nl}, expected: '0', note: 'theta -> 0 is the onset of complete wetting'}
    monotonicity:
      - {wrt: Delta_gamma_w, direction: decreasing}
      - {wrt: gamma_nl, direction: decreasing}

  - name: h_c
    claim: C4
    regime: R-slurry
    unit: m
    expression: tan(theta/2)/(2*sqrt(N_s))
    domains: {theta: '(0, pi)'}
    note: >-
      geometric coalescence thickness: equal caps of contact angle theta on a square lattice
      of density N_s touch when their base radius is half the spacing; cap height is base
      radius times tan(theta/2). Island-to-film is possible only as h_c -> 0. h_c is geometric
      only; the charter's kinetic critical coalescence thickness (C4 candidate (c), from a
      nucleation-and-growth model) is h_coal (cp2 fix F9) and is not a contract function in P0.
    limits:
      - {limit: {var: theta, to: '0', dir: '+'}, expected: '0'}
      - {limit: {var: theta, to: pi, dir: '-'}, expected: oo}
      - {at: {theta: pi/2}, expected: 1/(2*sqrt(N_s))}
    monotonicity:
      - {wrt: theta, direction: increasing}
      - {wrt: N_s, direction: decreasing}

  - name: h_cl
    claim: C4
    regime: R-slurry
    unit: m
    expression: tan(theta/2)/sqrt(2*N_s)
    domains: {theta: '(0, pi)'}
    note: geometric closure thickness; the base discs cover the square cells when the base radius is the spacing over sqrt(2)
    identities:
      - note: closure is sqrt(2) times first contact
        equals: sqrt(2)*@h_c
    limits:
      - {limit: {var: theta, to: '0', dir: '+'}, expected: '0'}
      - {limit: {var: theta, to: pi, dir: '-'}, expected: oo}
    inequalities:
      - {expr: '@h_c', relation: '<', rhs: '@h_cl'}
    monotonicity:
      - {wrt: theta, direction: increasing}

  - name: N_s_closure
    claim: C4
    regime: R-slurry
    unit: m^-2
    expression: tan(theta/2)**2/(2*d_max**2)
    domains: {theta: '(0, pi)'}
    note: >-
      smallest island density for which equal caps close the square lattice at the admissible
      thickness: h_cl(theta, N_s) <= d_max is N_s >= N_s_closure
    limits:
      - {at: {theta: pi/2}, expected: 1/(2*d_max**2)}
      - {limit: {var: theta, to: '0', dir: '+'}, expected: '0'}
    monotonicity:
      - {wrt: theta, direction: increasing}
      - {wrt: d_max, direction: decreasing}

  # ------------------------------------------------------------------ C5, stability
  - name: Psi_pbx
    claim: C5
    regime: R-slurry
    unit: J mol^-1
    expression: (G_phase - N_O*mu_H2O - R_gas*T*log(10)*(2*N_O - N_H)*pH - (2*N_O - N_H + Q_charge)*F_c*E_SHE)/N_M
    note: >-
      Pourbaix potential per non-O non-H atom with O and H exchanged with water, protons and
      electrons; the hull is the lower envelope over competing species of the same metal
      composition. The ACC offset enters G_phase from fetched thermochemistry.
    limits:
      - {at: {N_O: '0', N_H: '0', Q_charge: '0'}, expected: G_phase/N_M, note: 'a neutral element is pH- and potential-independent'}
    monotonicity:
      - {wrt: E_SHE, direction: decreasing, subs: {Q_charge: aux_u - 2*N_O + N_H}, note: 'species with 2 n_O - n_H + Q > 0 (oxidised) are favoured by raising the potential'}
      - {wrt: pH, direction: decreasing, subs: {N_H: 2*N_O - aux_u}, note: 'species with 2 n_O - n_H > 0 are favoured by raising pH'}

  - name: Delta_G_pbx
    claim: C5
    regime: R-slurry
    unit: J mol^-1
    expression: Psi_pbx - Psi_hull
    note: non-negative by construction of the hull; zero means on the hull

  - name: mu_Li
    claim: C5
    regime: R-cell
    unit: J mol^-1
    expression: mu_Li0 - F_c*E_Li
    limits:
      - {at: {E_Li: '0'}, expected: mu_Li0}
    monotonicity:
      - {wrt: E_Li, direction: decreasing}

  - name: Phi_Li
    claim: C5
    regime: R-cell
    unit: J mol^-1
    expression: G_phase - N_Li*(mu_Li0 - F_c*E_Li)
    note: Li-open grand potential; the window [E_red, E_ox] is where the phase is on the grand-potential hull
    limits:
      - {at: {N_Li: '0'}, expected: G_phase, note: 'a Li-free phase has a potential-independent grand potential'}
    monotonicity:
      - {wrt: E_Li, direction: nondecreasing, domains: {N_Li: '[0, oo)'}}

  - name: Delta_Phi_r
    claim: C5
    regime: R-cell
    unit: J mol^-1
    expression: Delta_G_r - Delta_n_Li*F_c*E_Li
    note: Li conservation turns the grand-potential change of a reaction into this linear function of E_Li
    limits:
      - {at: {E_Li: '@E_window'}, expected: '0'}
      - {at: {E_Li: '0'}, expected: Delta_G_r}
    monotonicity:
      - {wrt: E_Li, direction: decreasing, subs: {Delta_n_Li: aux_u}, note: 'delithiation (oxidation) is favoured by raising E_Li'}
      - {wrt: E_Li, direction: increasing, subs: {Delta_n_Li: -aux_u}, note: 'lithiation (reduction) is disfavoured by raising E_Li'}

  - name: E_window
    claim: C5
    regime: R-cell
    unit: V
    expression: Delta_G_r/(Delta_n_Li*F_c)
    note: >-
      one reaction's limit; E_ox is the minimum over reactions with Delta_n_Li > 0 and E_red the
      maximum over reactions with Delta_n_Li < 0. A Li-free phase has no reaction with
      Delta_n_Li > 0, so its Li-open E_ox is unbounded (open question Q9).
    limits:
      - {at: {Delta_G_r: '0'}, expected: '0'}

  # ------------------------------------------------------------------ insulating-film limitation
  - name: R_A
    claim: C4
    regime: R-cell
    unit: Ohm m^2
    expression: rho_e*d_film
    monotonicity:
      - {wrt: d_film, direction: increasing}

  - name: d_max_ohm
    claim: C4
    regime: R-cell
    unit: m
    expression: R_A_max/rho_e

  - name: kappa
    claim: C4
    regime: R-cell
    unit: m^-1
    expression: sqrt(2*m_e*phi_B)/hbar
    monotonicity:
      - {wrt: phi_B, direction: increasing}

  - name: d_max_tun
    claim: C4
    regime: R-cell
    unit: m
    expression: log(j_0/j_req)/(2*kappa)
    limits:
      - {at: {j_req: j_0}, expected: '0'}
    monotonicity:
      - {wrt: j_0, direction: increasing}
      - {wrt: j_req, direction: decreasing}

  # ------------------------------------------------------------------ stoichiometric generalisation (v5)
  # A mineral with nu ions per formula unit: IAP = a_Ca^nu_Ca a_X^nu_X a_Y^nu_Y a_w^n, Omega = IAP/K_sp, the
  # driving force k_B T ln Omega per formula unit and V_m per formula unit. Calcite (nu = 2) reduces to the
  # carbonate functions above exactly. r_star, DG_hom and DG_het keep their expressions and take Omega_nu
  # and V_m_fu; DG_hom_mineral and DG_het_mineral write that composition out for the implementation.
  - name: nu_ions
    claim: C3
    regime: R-slurry
    unit: '1'
    expression: nu_Ca + nu_X + nu_Y
    note: ions per formula unit; the exponent bookkeeping of the IAP sums to it
    limits:
      - {at: {nu_Ca: '1', nu_X: '1', nu_Y: '0'}, expected: '2', note: 'calcite'}
      - {at: {nu_Ca: '5', nu_X: '3', nu_Y: '1'}, expected: '9', note: 'hydroxyapatite Ca5(PO4)3OH'}
      - {at: {nu_Ca: '8', nu_X: '4', nu_Y: '2'}, expected: '14', note: 'octacalcium phosphate Ca8(HPO4)2(PO4)4.5H2O (X = PO4, Y = HPO4)'}
    monotonicity:
      - {wrt: nu_Ca, direction: increasing}
      - {wrt: nu_Y, direction: increasing}

  - name: IAP
    claim: C3
    regime: R-slurry
    unit: '1'
    expression: a_Ca**nu_Ca*a_X**nu_X*a_Y**nu_Y*a_w**n_hyd
    note: >-
      ion activity product of one formula unit; every ion enters with its stoichiometric exponent and
      structural water through a_w^n (a_w = 1 in the slurry, below one at drying states)
    limits:
      - {at: {nu_Ca: '1', nu_X: '1', nu_Y: '0', n_hyd: '0'}, expected: a_Ca*a_X, note: 'one cation and one anion: the carbonate form'}
      - {at: {a_w: '1'}, expected: a_Ca**nu_Ca*a_X**nu_X*a_Y**nu_Y, note: 'slurry water activity: no water factor'}
      - {at: {n_hyd: '0', nu_Y: '0'}, expected: a_Ca**nu_Ca*a_X**nu_X}
    monotonicity:
      - {wrt: a_Ca, direction: increasing}
      - {wrt: a_X, direction: increasing}
      - {wrt: a_Y, direction: nondecreasing}
      - {wrt: a_w, direction: nondecreasing}

  - name: Omega_nu
    claim: C3
    regime: R-slurry
    unit: '1'
    expression: '@IAP/K_sp'
    note: >-
      saturation ratio of a mineral with nu ions per formula unit (K_sp written for the same formula unit);
      the Omega of the screen for every candidate (contract v5)
    identities:
      - note: 'equivalence: calcite (nu = 2, X = CO3, no Y, no water) is Omega_bulk exactly'
        subs: {nu_Ca: '1', nu_X: '1', nu_Y: '0', n_hyd: '0', a_X: a_CO3}
        equals: '@Omega_bulk'
      - note: 'equivalence: a hydrated calcite framing is Omega_bulk_hydrated exactly'
        subs: {nu_Ca: '1', nu_X: '1', nu_Y: '0', a_X: a_CO3}
        equals: '@Omega_bulk_hydrated'
      - note: 'hydroxyapatite: IAP = a_Ca^5 a_PO4^3 a_OH (nu = 9), no structural water'
        subs: {nu_Ca: '5', nu_X: '3', nu_Y: '1', n_hyd: '0', a_X: a_PO4, a_Y: a_OH}
        equals: a_Ca**5*a_PO4**3*a_OH/K_sp
      - note: 'octacalcium phosphate: IAP = a_Ca^8 a_PO4^4 a_HPO4^2 a_w^5 (nu = 14)'
        subs: {nu_Ca: '8', nu_X: '4', nu_Y: '2', n_hyd: '5', a_X: a_PO4, a_Y: a_HPO4}
        equals: a_Ca**8*a_PO4**4*a_HPO4**2*a_w**5/K_sp
    limits:
      - {at: {K_sp: '@IAP'}, expected: '1', note: 'saturation: IAP = K_sp'}
    monotonicity:
      - {wrt: a_Ca, direction: increasing}
      - {wrt: a_X, direction: increasing}
      - {wrt: K_sp, direction: decreasing}

  - name: Delta_mu_fu
    claim: C3
    regime: R-slurry
    unit: J
    expression: k_B*T*log(@Omega_nu)
    note: >-
      driving force per FORMULA UNIT (nu ions), the quantity multiplied by the number of formula units in a
      nucleus; the per-ion value is Delta_mu_fu / nu and never enters a barrier
    identities:
      - note: 'equivalence: calcite reduces to the carbonate Delta_mu at Omega_bulk'
        subs: {nu_Ca: '1', nu_X: '1', nu_Y: '0', n_hyd: '0', a_X: a_CO3}
        equals: k_B*T*log(a_Ca*a_CO3/K_sp)
      - note: 'sum over ions: the formula-unit driving force is the stoichiometric sum of the ion terms'
        equals: k_B*T*(nu_Ca*log(a_Ca) + nu_X*log(a_X) + nu_Y*log(a_Y) + n_hyd*log(a_w) - log(K_sp))
    limits:
      - {at: {K_sp: '@IAP'}, expected: '0', note: 'saturation'}
    monotonicity:
      - {wrt: a_Ca, direction: increasing}
      - {wrt: K_sp, direction: decreasing}

  - name: V_m_fu
    claim: C3
    regime: R-slurry
    unit: m^3 mol^-1
    expression: M_fu/rho_s
    note: molar volume of the formula unit of the registered framing (the input V_m of the barrier); V_m/nu never appears
    monotonicity:
      - {wrt: M_fu, direction: increasing}
      - {wrt: rho_s, direction: decreasing}

  - name: n_star_fu
    claim: C3
    regime: R-slurry
    unit: '1'
    expression: 32*pi*gamma_nl**3*V_m**2/(3*N_A**2*(k_B*T*log(@Omega_nu))**3)
    note: formula units in the critical nucleus, (4 pi/3) r_star^3 N_A / V_m with r_star at Omega_nu
    identities:
      - note: nucleus volume over the volume of a formula unit
        equals: 4*pi*(2*gamma_nl*V_m/(N_A*k_B*T*log(@Omega_nu)))**3*N_A/(3*V_m)

  - name: DG_hom_mineral
    claim: C3
    regime: R-slurry
    unit: J
    expression: 16*pi*gamma_nl**3*V_m**2/(3*N_A**2*(k_B*T*log(@Omega_nu))**2)
    note: DG_hom with Omega = Omega_nu and V_m the molar volume of the formula unit (valid where Omega_nu > 1)
    identities:
      - note: 'equivalence: calcite is DG_hom at Omega_bulk exactly'
        subs: {nu_Ca: '1', nu_X: '1', nu_Y: '0', n_hyd: '0', a_X: a_CO3}
        equals: 16*pi*gamma_nl**3*V_m**2/(3*N_A**2*(k_B*T*log(a_Ca*a_CO3/K_sp))**2)
      - note: half the work of forming the critical nucleus from its formula units
        equals: '@n_star_fu*@Delta_mu_fu/2'

  - name: DG_het_mineral
    claim: C3
    regime: R-slurry
    unit: J
    expression: '@f_theta*@DG_hom_mineral'
    domains: {theta: '[0, pi]'}
    limits:
      - {at: {theta: '0'}, expected: '0'}
      - {at: {theta: pi}, expected: '@DG_hom_mineral'}
      - {at: {theta: pi/2}, expected: '@DG_hom_mineral/2'}
    inequalities:
      - {expr: '@DG_het_mineral', relation: '<=', rhs: '@DG_hom_mineral', note: 'holds for every theta in [0, pi]'}
    monotonicity:
      - {wrt: theta, direction: nondecreasing}

  - name: ln_Omega_exponent_error
    claim: C3
    regime: R-slurry
    unit: '1'
    expression: log(@Omega_nu) - log(a_Ca*a_X/K_sp)
    demonstration: true
    note: >-
      DEMONSTRATION ONLY (the error of a wrong nu): ln Omega of the right stoichiometry less ln Omega of the
      calcite form (nu = 2) at the same activities and K_sp. It is the exponent bookkeeping error, not a rescaling:
      (nu_Ca - 1) ln a_Ca + (nu_X - 1) ln a_X + nu_Y ln a_Y + n ln a_w. Never used for a verdict.
    identities:
      - note: exponent bookkeeping
        equals: (nu_Ca - 1)*log(a_Ca) + (nu_X - 1)*log(a_X) + nu_Y*log(a_Y) + n_hyd*log(a_w)
    limits:
      - {at: {nu_Ca: '1', nu_X: '1', nu_Y: '0', n_hyd: '0'}, expected: '0', note: 'calcite: no error'}
      - {at: {nu_Ca: '5', nu_X: '3', nu_Y: '1', n_hyd: '0', a_X: a_Ca, a_Y: a_Ca}, expected: 7*log(a_Ca), note: 'hydroxyapatite (nu = 9) at equal ion activities a: the calcite form misses (nu - 2) ln a = 7 ln a, that is 7 decades of Omega per decade of activity'}

  - name: DG_hom_per_ion
    claim: C3
    regime: R-slurry
    unit: J
    expression: 16*pi*gamma_nl**3*V_m**2/(3*N_A**2*(k_B*T*log(@Omega_nu)/nu)**2)
    demonstration: true
    note: >-
      DEMONSTRATION ONLY (forbidden form): the homogeneous barrier with a per-ion driving force
      k_B T ln Omega / nu used where the formula unit belongs. It overstates the barrier by nu^2: a factor 81
      for hydroxyapatite (nu = 9), 4 for calcite. Never used for a verdict.
    identities:
      - note: the per-ion form is nu^2 times the formula-unit barrier
        equals: nu**2*@DG_hom_mineral
    limits:
      - {at: {nu: '9'}, expected: 81*@DG_hom_mineral, note: 'hydroxyapatite: 81 times the formula-unit barrier'}
      - {at: {nu: '1'}, expected: '@DG_hom_mineral'}
    monotonicity:
      - {wrt: nu, direction: nondecreasing}

  - name: a_OH_fn
    claim: C3
    regime: R-slurry
    unit: '1'
    expression: a_w*10**(pH - pKw)
    note: hydroxide activity from the autoprotolysis constant K_w = a_H a_OH / a_w with a_H = 10^-pH
    limits:
      - {at: {pH: pKw}, expected: a_w, note: 'a_H = K_w: neutral water'}
    monotonicity:
      - {wrt: pH, direction: nondecreasing}
      - {wrt: a_w, direction: nondecreasing}

  # ------------------------------------------------------------------ phosphate speciation (v5)
  # Activities of free Ca2+, HPO4 2- and PO4 3- from pH, total phosphate P_T, total Ca_T and ionic strength I,
  # with ion pairs CaHPO4(aq), CaH2PO4+, CaPO4- and CaOH+. Same structure as the carbonate system: a mass balance
  # for phosphate and one for calcium close on the pair factor P_pair_phos (each pair holds one of each), giving the
  # carbonate quadratic with C_T replaced by P_T; one positive root, in the cancellation-free form.
  - name: gamma_act_3
    claim: C3
    regime: R-slurry
    unit: '1'
    expression: 10**(-9*A_DH*(sqrt(I_ionic/m_std)/(1 + sqrt(I_ionic/m_std)) - b_D*I_ionic/m_std))
    note: Davies activity coefficient of a triply charged ion (output g_3); z^2 = 9
    validity: 'I_ionic <= I_val (registered bound of the activity model, below the Davies turning point); the least reliable of the three charges'
    identities:
      - note: the charge-three coefficient is the ninth power of the charge-one coefficient
        equals: '@gamma_act_1**9'
    limits:
      - {at: {I_ionic: '0'}, expected: '1', note: 'I -> 0 gives ideal activities'}
      - {at: {A_DH: '0'}, expected: '1'}

  - name: m_PT_fn
    claim: C3
    regime: R-slurry
    unit: '1'
    expression: P_T/(rho_water*m_std)
    note: total dissolved phosphate in standard molalities (output m_PT)

  - name: A_phos_fn
    claim: C3
    regime: R-slurry
    unit: '1'
    expression: >-
      1/g_3 + 10**(pK3_phosphoric - pH)/g_2 + 10**(pK3_phosphoric + pK2_phosphoric - 2*pH)/g_1
      + 10**(pK1_phosphoric + pK2_phosphoric + pK3_phosphoric - 3*pH)
    note: >-
      free phosphate species per unit PO4 3- activity (output A_phos): PO4 3-, HPO4 2-, H2PO4- and H3PO4 (activity
      coefficient one), from a_HPO4 = a_H a_PO4 / K_3, a_H2PO4 = a_H a_HPO4 / K_2 and a_H3PO4 = a_H a_H2PO4 / K_1
      with a_H = 10^-pH
    limits:
      - {at: {g_1: '1', g_2: '1', g_3: '1'}, expected: 1 + 10**(pK3_phosphoric - pH) + 10**(pK3_phosphoric + pK2_phosphoric - 2*pH) + 10**(pK1_phosphoric + pK2_phosphoric + pK3_phosphoric - 3*pH), note: 'ideal activities'}
      - {limit: {var: pH, to: oo}, expected: 1/g_3, note: 'high pH: only PO4 3- remains'}
    monotonicity:
      - {wrt: pH, direction: decreasing, note: 'acidification shifts phosphate from PO4 3- to HPO4 2-, H2PO4- and H3PO4'}

  - name: P_pair_phos_fn
    claim: C3
    regime: R-slurry
    unit: '1'
    expression: >-
      K_CaHPO4_aq*10**(pK3_phosphoric - pH) + K_CaH2PO4*10**(pK3_phosphoric + pK2_phosphoric - 2*pH)/g_1 + K_CaPO4/g_1
    note: >-
      Ca-phosphate ion pairs per unit product a_Ca a_PO4 (output P_pair_phos): CaHPO4(aq) neutral, CaH2PO4+ and CaPO4-
      singly charged; the same factor appears in the calcium and in the phosphate balance
    limits:
      - {at: {K_CaHPO4_aq: '0', K_CaH2PO4: '0', K_CaPO4: '0'}, expected: '0', note: 'no ion pairs'}

  - name: a_PO4_speciation
    claim: C3
    regime: R-slurry
    unit: '1'
    expression: >-
      2*m_PT*D_Ca/(A_phos*D_Ca + P_pair_phos*(m_CaT - m_PT)
      + sqrt((A_phos*D_Ca + P_pair_phos*(m_CaT - m_PT))**2 + 4*A_phos*P_pair_phos*m_PT*D_Ca))
    note: >-
      free phosphate activity (output a_PO4): the positive root of A P y^2 + (A D + P (m_CaT - m_PT)) y - m_PT D = 0,
      which follows from the phosphate balance m_PT = A y + P y a_Ca and the calcium balance
      m_CaT = a_Ca (D + P y). The product of the roots is -m_PT D / (A P) < 0, so exactly one root is positive
      (the cancellation-free form is the same as for the carbonate system).
    validity: 'Davies range I_ionic <= I_val; closed system at fixed P_T; solution not yet precipitated'
    limits:
      - {at: {P_pair_phos: '0'}, expected: m_PT/A_phos, note: 'no ion pairs: the phosphate acid-base system alone'}
      - {at: {m_CaT: '0'}, expected: m_PT/A_phos, note: 'no Ca: the phosphate acid-base system alone'}
      - {at: {m_PT: '0'}, expected: '0'}
    identities:
      - note: 'phosphate balance: m_PT = y (A + P a_Ca) with a_Ca = m_CaT/(D + P y)'
        equals: m_PT/(A_phos + P_pair_phos*m_CaT/(D_Ca + P_pair_phos*@a_PO4_speciation))
        numeric: true
    inequalities:
      - {expr: '@a_PO4_speciation', relation: '<=', rhs: m_PT/A_phos, note: 'ion pairs can only lower the free phosphate'}
    monotonicity:
      - {wrt: m_PT, direction: increasing}
      - {wrt: m_CaT, direction: decreasing}

  - name: a_Ca_speciation_phos
    claim: C3
    regime: R-slurry
    unit: '1'
    expression: m_CaT/(D_Ca + P_pair_phos*a_PO4)
    note: free Ca2+ activity (output a_Ca) from the calcium balance, at the a_PO4 of a_PO4_speciation
    limits:
      - {at: {m_CaT: '0'}, expected: '0', note: 'no Ca'}
      - {at: {P_pair_phos: '0', D_Ca: '1'}, expected: m_CaT, note: 'no pairs, no hydrolysis, ideal: all calcium is free'}
    monotonicity:
      - {wrt: m_CaT, direction: increasing}
      - {wrt: a_PO4, direction: decreasing}

  - name: a_HPO4_speciation
    claim: C3
    regime: R-slurry
    unit: '1'
    expression: a_PO4*10**(pK3_phosphoric - pH)
    note: free HPO4 2- activity (output a_HPO4) from the third dissociation, at the a_PO4 of a_PO4_speciation
    limits:
      - {limit: {var: pH, to: oo}, expected: '0', note: 'high pH: PO4 3- only'}
    monotonicity:
      - {wrt: pH, direction: decreasing}
      - {wrt: a_PO4, direction: increasing}

  - name: f_PO4_acidbase
    claim: C3
    regime: R-slurry
    unit: '1'
    expression: 1/(g_3*@A_phos_fn)
    note: fraction of the total phosphate that is free PO4 3- when no calcium is present (phosphate acid-base only)
    limits:
      - {limit: {var: pH, to: oo}, expected: '1', note: 'high pH gives PO4 3-'}
      - {at: {g_1: '1', g_2: '1', g_3: '1'}, expected: 1/(1 + 10**(pK3_phosphoric - pH) + 10**(pK3_phosphoric + pK2_phosphoric - 2*pH) + 10**(pK1_phosphoric + pK2_phosphoric + pK3_phosphoric - 3*pH))}
    inequalities:
      - {expr: '@f_PO4_acidbase', relation: '<=', rhs: '1'}
    monotonicity:
      - {wrt: pH, direction: increasing}

  - name: f_PO4_free
    claim: C3
    regime: R-slurry
    unit: '1'
    expression: a_PO4/(g_3*m_PT)
    note: fraction of the total phosphate that is free PO4 3- (molality a_PO4/g_3 over m_PT), at the registered state
    limits:
      - {at: {a_PO4: '0'}, expected: '0'}

  - name: f_HPO4_free
    claim: C3
    regime: R-slurry
    unit: '1'
    expression: a_HPO4/(g_2*m_PT)
    note: fraction of the total phosphate that is free HPO4 2-

  - name: f_H2PO4_free
    claim: C3
    regime: R-slurry
    unit: '1'
    expression: a_PO4*10**(pK3_phosphoric + pK2_phosphoric - 2*pH)/(g_1*m_PT)
    note: fraction of the total phosphate that is free H2PO4-

  - name: f_H3PO4_free
    claim: C3
    regime: R-slurry
    unit: '1'
    expression: a_PO4*10**(pK1_phosphoric + pK2_phosphoric + pK3_phosphoric - 3*pH)/m_PT
    note: fraction of the total phosphate that is H3PO4(aq)

  - name: f_pairs_phos
    claim: C3
    regime: R-slurry
    unit: '1'
    expression: a_Ca*a_PO4*P_pair_phos/m_PT
    note: fraction of the total phosphate held in Ca ion pairs
    limits:
      - {at: {a_Ca: '0'}, expected: '0', note: 'no free Ca: no pairs'}
      - {at: {P_pair_phos: '0'}, expected: '0'}

  - name: f_phos_closure
    claim: C3
    regime: R-slurry
    unit: '1'
    expression: (A_phos + a_Ca*P_pair_phos)*a_PO4/m_PT - 1
    note: >-
      closure residual of the phosphate fractions: the free species (A_phos a_PO4, the four terms of A_phos_fn, which
      are f_PO4_free, f_HPO4_free, f_H2PO4_free and f_H3PO4_free times m_PT) plus the pairs (f_pairs_phos), over m_PT,
      less one; zero at the speciation solution
    identities:
      - note: 'the five fractions sum to one at the speciation solution'
        subs: {a_PO4: '@a_PO4_speciation', a_Ca: 'm_CaT/(D_Ca + P_pair_phos*@a_PO4_speciation)'}
        equals: '0'
        numeric: true

constant_relations:
  - {lhs: R_gas, rhs: N_A*k_B}
  - {lhs: F_c, rhs: N_A*q_e}

sign_flips:
  - id: SF1
    parameter: Delta_gamma_w
    statement: >-
      Registered convention: d cos(theta)/d Delta_gamma_w = -1/gamma_nl < 0 and
      d f/d cos(theta) = -3 sin(theta)^2/4 <= 0, so theta, f and Delta_G*_het are
      nondecreasing in Delta_gamma_w. Delta_gamma_w > 0 (a displacement cost) gives
      Delta_G*_het >= Delta_G*_het(Delta_gamma_w = 0); Delta_gamma_w < 0 reverses that
      inequality. Under the deck form (gamma_eff in the denominator) the derivative of
      cos(theta) has the sign of gamma_sl - gamma_sn0, so on the wetting side
      (gamma_sl > gamma_sn0) a cost lowers the barrier: the inequality is reversed.
    df_dcos: {expr: '(2 + c)*(1 - c)**2/4', var: c, interval: '[-1, 1]', expected_sign: nonpositive}
    registered:
      cos_function: cos_theta_young
      expected_sign: negative
    alternative:
      cos_function: cos_theta_deck
      reparam: {gamma_sl: gamma_sn0 + aux_u, gamma_nl: Delta_gamma_w + aux_v}
      expected_sign: positive
    witness:
      values: {gamma_sl: '3', gamma_sn0: '2', gamma_nl: '4'}
      delta_plus: 1/2
      delta_minus: -1/2
      expect:
        registered: 'f(+) > f(0) > f(-)'
        alternative: 'f(+) < f(0)'
  - id: SF2
    kind: channel
    parameter: Delta_G_seq
    statement: >-
      Registered (contract v2, uniform chemical potential): Delta_G_seq reaches the barrier only
      through Delta_gamma_ads in gamma_sl. d cos(theta)/d Delta_G_seq = Gamma_s Theta/gamma_nl > 0
      and d Omega/d Delta_G_seq = 0, so at fixed gamma_sl0 and gamma_sn stronger binding
      (Delta_G_seq more negative) lowers cos(theta) and raises f and Delta_G*_het. Binding helps
      nucleation only if the template-nucleus energy gamma_sn falls by more than gamma_sl does.
      Rejected alternative (local-ideal, contract v1): Omega_local = E_enr Omega_bulk with Ca-free
      interfacial energies, for which d Delta_G*/d Delta_G_seq = 2 Delta_G*/(R T ln Omega_local)
      > 0, the opposite sign.
    registered:
      cos_function: cos_theta_template
      dcos_equals: Gamma_s*@Theta_occ/gamma_nl
      expected_sign: positive
      omega_function: Omega_bulk
    alternative:
      barrier: '@DG_hom'
      omega_subs: exp(-Delta_G_seq/(R_gas*T))*Omega_bulk
      derivative_equals: 2*aux_B/(R_gas*T*log(exp(-Delta_G_seq/(R_gas*T))*Omega_bulk))
      note: aux_B stands for the barrier itself
    witness:
      values: {gamma_sl0: '3', gamma_sn0: '2', Delta_gamma_w: '0', gamma_nl: '4', Gamma_s: '1',
               delta_s: '1', c_bulk: '1', R_gas: '1', T: '1', Omega_bulk: '2'}
      delta_plus: 1/4
      delta_minus: -1/4
      expect:
        registered: 'barrier(+) < barrier(0) < barrier(-)'
        alternative: 'barrier(+) > barrier(0) > barrier(-)'
  - id: SF3
    kind: gamma_nl
    parameter: gamma_nl
    note: lane note N3
    statement: >-
      d f/d gamma_nl = (3 sin(theta)^2/4) (gamma_sl - gamma_sn)/gamma_nl^2. Lowering gamma_nl
      lowers f only when gamma_sl - gamma_sn > 0 (the wetting side, theta < pi/2); when
      gamma_sl - gamma_sn < 0 lowering gamma_nl raises f, and at gamma_sl = gamma_sn it leaves f
      unchanged at 1/2. Both signs are tested; the reparametrisation gamma_nl = aux_u + aux_v
      keeps |cos(theta)| < 1. On the wetting side the full barrier f gamma_nl^3 also rises with
      gamma_nl.
    cos_function: cos_theta_young
    cases:
      - {name: 'gamma_sl - gamma_sn > 0', reparam: {gamma_sl: gamma_sn0 + Delta_gamma_w + aux_u, gamma_nl: aux_u + aux_v}, df_sign: positive, barrier_sign: positive}
      - {name: 'gamma_sl - gamma_sn < 0', reparam: {gamma_sl: gamma_sn0 + Delta_gamma_w - aux_u, gamma_nl: aux_u + aux_v}, df_sign: negative}
      - {name: 'gamma_sl - gamma_sn = 0', reparam: {gamma_sl: gamma_sn0 + Delta_gamma_w}, df_sign: zero}
    witness:
      values: {gamma_sn0: '2', Delta_gamma_w: '0'}
      excess: ['1', '-1']
      gamma_nl: ['2', '3']
      expect: 'excess > 0: f(2) < f(3); excess < 0: f(2) > f(3)'
  - id: SF4
    kind: admissibility
    parameter: Delta_G_seq
    note: decision D27 (contract v4)
    statement: >-
      The admissible set gamma_sl0 + Delta_gamma_ads >= 0 is an upper set in Delta_G_seq:
      d gamma_sl/d Delta_G_seq = Gamma_s Theta > 0, and gamma_sl -> -oo as Delta_G_seq -> -oo at any
      c_bulk > 0, so strong enough binding overshoots every gamma_sl0 and the refused draws are the
      strongest binders. Restricting the prior to the admissible set removes mass from the
      strong-binding end only and cannot reverse SF2: on the admissible set d cos(theta)/d Delta_G_seq
      = Gamma_s Theta/gamma_nl > 0 still. Rejected forms: (a) clipping cos(theta) at -1 for an
      inadmissible gamma_sl (the unrestricted screen), which counts a non-existent interface as
      non-wetting; (b) a saturating form that floors gamma_sl at zero, which places the refused draw on
      the boundary as if a bounded interface existed there. Both put the draw on the bad side of C3 (a).
    function: gamma_sl_insitu
    dgamma_equals: Gamma_s*@Theta_occ
    limit_strong_binding: -oo
    witness:
      values: {gamma_sl0: '1', Gamma_s: '1', delta_s: '1', c_bulk: '1', R_gas: '1', T: '1',
               gamma_sn0: 1/2, Delta_gamma_w: '0', gamma_nl: '1'}
      weak: '0'
      strong: '-3'

no_double_counting:
  statement: >-
    Contract v2. The exact reference is the grand potential of a cap on the template in an open
    system at the bulk chemical potentials (derivation, Section 7): Delta Omega(r) =
    -n Delta mu_bulk + gamma_nl A_cap + (gamma_sn - gamma_sl) A_base, with every template-ion
    interaction inside the grand-canonical interfacial energies. The template therefore acts on
    the barrier only through theta. Its Ca2+ binding (Delta_G_seq, Gamma_s, delta_s) enters once,
    through Delta_gamma_ads in gamma_sl; the Omega channel holds bulk inputs only. Rule for the
    screen: if gamma_sl is supplied Ca-free (gamma_sl0) add Delta_gamma_ads once; if it is
    computed at the regime activities add nothing; never raise Omega above Omega_bulk.
  composite: DG_het_template
  composite_expression: >-
    (2 + c_young)*(1 - c_young)**2/4 * 16*pi*gamma_nl**3*V_m**2/(3*N_A**2*(k_B*T*log(Om))**2)
  channel_theta:
    c_young: (gamma_sl0 + D_ads - gamma_sn0 - Delta_gamma_w)/gamma_nl
    D_ads: -R_gas*T*(Gamma_s*log(1 + x_b) - delta_s*c_bulk)
    x_b: exp(-Delta_G_seq/(R_gas*T))*c_bulk*delta_s/Gamma_s
  channel_omega:
    Om: a_Ca*a_CO3/K_sp
  single_entry:
    via: D_ads
    inputs: [Delta_G_seq, Gamma_s, delta_s]
  template_dependent: [gamma_sl0, gamma_sn0, Delta_gamma_w, Delta_G_seq, Gamma_s, delta_s]
  template_independent: [gamma_nl, V_m, T, k_B, N_A, R_gas, a_Ca, a_CO3, K_sp, c_bulk]

demonstrations:
  - name: DG_het_local_ideal
    note: >-
      contract v1 as registered: Ca-free interfacial energies with the local-ideal Omega. The
      binding is counted once but in a channel that does not exist at equilibrium, and with the
      opposite effect on the barrier (SF2).
    composite_expression: >-
      (2 + c_young)*(1 - c_young)**2/4 * 16*pi*gamma_nl**3*V_m**2/(3*N_A**2*(k_B*T*log(Om))**2)
    channels:
      c_young: (gamma_sl0 - gamma_sn0 - Delta_gamma_w)/gamma_nl
      Om: (E/(1 + E*c_bulk*delta_s/Gamma_s))*a_Ca*a_CO3/K_sp
      E: exp(-Delta_G_seq/(R_gas*T))
  - name: DG_het_double
    note: >-
      the double count: the Ca-loaded gamma_sl of the uniform bookkeeping together with the
      local-ideal Omega. The same binding free energy is credited to the driving force and
      charged to the interfacial energy.
    composite_expression: >-
      (2 + c_young)*(1 - c_young)**2/4 * 16*pi*gamma_nl**3*V_m**2/(3*N_A**2*(k_B*T*log(Om))**2)
    channels:
      c_young: (gamma_sl0 + D_ads - gamma_sn0 - Delta_gamma_w)/gamma_nl
      D_ads: -R_gas*T*(Gamma_s*log(1 + x_b) - delta_s*c_bulk)
      x_b: E*c_bulk*delta_s/Gamma_s
      Om: (E/(1 + E*c_bulk*delta_s/Gamma_s))*a_Ca*a_CO3/K_sp
      E: exp(-Delta_G_seq/(R_gas*T))
    reduces_to:
      - {subs: {D_ads: '0'}, equals: DG_het_local_ideal, note: 'without the Gibbs term it is the v1 composite'}
      - {subs: {Om: a_Ca*a_CO3/K_sp}, equals: DG_het_template, note: 'without the local-ideal credit it is the screen composite'}
