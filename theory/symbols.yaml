# Symbol register for the theory of the nacre-shell screen (sessions P0-W3.1, P0-W3.2).
#
# One entry per symbol used in theory/equation_sheet.tex, theory/derivation_body.tex and
# theory/contract.yaml. The contract checker (theory/tools/check_contract.py) refuses any
# contract expression that uses an id not listed here, and checks every contract
# expression for dimensional consistency against the `unit` field.
#
# Theory is symbolic: no entry carries a literature value. Values are inputs fetched and
# frozen elsewhere (the parameter table); this file only says what each symbol means.
#
# Schema per entry
#   id          identifier used in contract expressions (sympy-parsable name)
#   latex       LaTeX form used in the equation sheet and derivation
#   meaning     physical meaning
#   short       optional label for the equation-sheet table (defaults to the meaning's head)
#   unit        SI unit, written as space-separated factors with integer powers
#               (J, m, s, kg, K, mol, A, C, V, Ohm, rad; "1" for dimensionless)
#   sign        sign convention or admissible sign
#   interval    admissible values, as an interval in exact form ("(0, oo)", "[0, pi]")
#   domain      physical domain the symbol belongs to
#   regimes     R-slurry, R-cell, or both (charter/regimes.yaml)
#   kind        input | derived | constant | count

symbols:
  # ----- exact constants of the SI (kept symbolic; their values are fixed by the SI definition)
  - {id: k_B, latex: 'k_\mathrm{B}', meaning: Boltzmann constant, unit: J K^-1, sign: positive, interval: '(0, oo)', domain: constants, regimes: [both], kind: constant}
  - {id: N_A, latex: 'N_\mathrm{A}', meaning: Avogadro constant, unit: mol^-1, sign: positive, interval: '(0, oo)', domain: constants, regimes: [both], kind: constant}
  - {id: R_gas, latex: 'R', meaning: 'molar gas constant, R = N_A k_B', unit: J K^-1 mol^-1, sign: positive, interval: '(0, oo)', domain: constants, regimes: [both], kind: constant}
  - {id: F_c, latex: 'F', meaning: 'Faraday constant, F = N_A e', unit: C mol^-1, sign: positive, interval: '(0, oo)', domain: constants, regimes: [both], kind: constant}
  - {id: q_e, latex: 'e', meaning: elementary charge, unit: C, sign: positive, interval: '(0, oo)', domain: constants, regimes: [both], kind: constant}
  - {id: hbar, latex: '\hbar', meaning: reduced Planck constant, unit: J s, sign: positive, interval: '(0, oo)', domain: constants, regimes: [R-cell], kind: constant}
  - {id: m_e, short: 'electron mass', latex: 'm_\mathrm{e}', meaning: 'electron mass (an effective tunnelling mass may replace it; open question Q10)', unit: kg, sign: positive, interval: '(0, oo)', domain: constants, regimes: [R-cell], kind: constant}

  # ----- state variables
  - {id: T, latex: 'T', meaning: absolute temperature of the regime, unit: K, sign: positive, interval: '(0, oo)', domain: state, regimes: [both], kind: input}
  - {id: pH, short: 'pH (molal scale)', latex: '\mathrm{pH}', meaning: '-log10 of the hydrogen-ion activity (molal standard state)', unit: '1', sign: 'any real; R-slurry is alkaline', interval: '(-oo, oo)', domain: state, regimes: [R-slurry], kind: input}
  - {id: E_SHE, short: 'collector potential vs SHE', latex: 'E_\mathrm{SHE}', meaning: electrode potential of the Al collector on the standard hydrogen electrode scale, unit: V, sign: any real, interval: '(-oo, oo)', domain: state, regimes: [R-slurry], kind: input}
  - {id: E_Li, short: 'collector potential vs Li+/Li', latex: 'E_\mathrm{Li}', meaning: 'electrode potential of the collector on the Li+/Li scale', unit: V, sign: 'any real; anodic operation means large positive', interval: '(-oo, oo)', domain: state, regimes: [R-cell], kind: input}

  # ----- C1 adhesion in water
  - {id: gamma_ow, latex: '\gamma_\mathrm{ow}', meaning: oxide-water interfacial free energy (hydroxylated Al oxide or oxyhydroxide against water), unit: J m^-2, sign: 'real; positive for a stable interface', interval: '(-oo, oo)', domain: adhesion, regimes: [R-slurry], kind: input}
  - {id: gamma_pw, short: 'polymer-water interfacial free energy', latex: '\gamma_\mathrm{pw}', meaning: polymer (template) - water interfacial free energy, unit: J m^-2, sign: 'real', interval: '(-oo, oo)', domain: adhesion, regimes: [R-slurry], kind: input}
  - {id: gamma_op, latex: '\gamma_\mathrm{op}', meaning: oxide-polymer interfacial free energy in contact (water excluded from the contact), unit: J m^-2, sign: 'real', interval: '(-oo, oo)', domain: adhesion, regimes: [R-slurry], kind: input}
  - {id: gamma_o, latex: '\gamma_\mathrm{o}', meaning: oxide surface free energy against vacuum (dry comparator only), unit: J m^-2, sign: positive, interval: '(0, oo)', domain: adhesion, regimes: [R-slurry], kind: input}
  - {id: gamma_p, latex: '\gamma_\mathrm{p}', meaning: polymer surface free energy against vacuum (dry comparator only), unit: J m^-2, sign: positive, interval: '(0, oo)', domain: adhesion, regimes: [R-slurry], kind: input}
  - {id: gamma_w, latex: '\gamma_\mathrm{w}', meaning: water surface free energy against its vapour, unit: J m^-2, sign: positive, interval: '(0, oo)', domain: adhesion, regimes: [R-slurry], kind: input}
  - {id: gamma_nv, short: 'nucleus surface free energy against vacuum (dry)', latex: '\gamma_\mathrm{n}', meaning: 'surface free energy of the CaCO3 framing phase against vacuum or its vapour (dry); with gamma_p it bounds the template-nucleus contact energy through the dry work of adhesion (theory/ignorance_priors.md)', unit: J m^-2, sign: positive, interval: '(0, oo)', domain: adhesion, regimes: [R-slurry], kind: input}
  - {id: W_adh_wet, short: 'work of adhesion in water (Dupre)', latex: 'W_\mathrm{adh,wet}', meaning: 'Dupre work of adhesion in water: reversible work per unit contact area to separate the oxide-polymer contact into oxide-water and polymer-water interfaces', unit: J m^-2, sign: 'positive means the template stays anchored against water', interval: '(-oo, oo)', domain: adhesion, regimes: [R-slurry], kind: derived}
  - {id: W_adh_dry, short: 'work of adhesion against vacuum (comparator)', latex: 'W_\mathrm{adh,dry}', meaning: 'Dupre work of adhesion against vacuum (comparator only)', unit: J m^-2, sign: 'positive for any bound contact', interval: '(-oo, oo)', domain: adhesion, regimes: [R-slurry], kind: derived}
  - {id: Delta_F_pmf, short: 'PMF free energy, separated minus bound', latex: '\Delta F_\mathrm{PMF}', meaning: 'free energy of the separated state minus the bound state from the potential of mean force in explicit water', unit: J, sign: 'positive when the bound state is lower', interval: '(-oo, oo)', domain: adhesion, regimes: [R-slurry], kind: input}
  - {id: A_c, short: 'fragment contact area', latex: 'A_\mathrm{c}', meaning: contact area of the adsorbed fragment used to normalise the PMF, unit: m^2, sign: positive, interval: '(0, oo)', domain: adhesion, regimes: [R-slurry], kind: input}

  # ----- C2 sequestration
  - {id: Delta_G_seq, short: 'Ca2+ transfer free energy, bulk to binding layer', latex: '\Delta G_\mathrm{seq}', meaning: 'molar free energy of transfer of Ca2+ from the hydrated bulk (regime activity) into the template binding layer, closed through the thermodynamic cycle of the derivation', unit: J mol^-1, sign: 'negative means enrichment at the layer; positive means depletion', interval: '(-oo, oo)', domain: sequestration, regimes: [R-slurry], kind: input}
  - {id: Delta_G_site, short: 'transfer free energy to the deprotonated site', latex: '\Delta G_\mathrm{site}', meaning: 'transfer free energy to the fully deprotonated site, from the PMF with the site-volume standard-state convention', unit: J mol^-1, sign: 'negative means binding', interval: '(-oo, oo)', domain: sequestration, regimes: [R-slurry], kind: input}
  - {id: pKa, short: 'pKa of the coordinating group', latex: '\mathrm{p}K_\mathrm{a}', meaning: acid dissociation constant (as -log10) of the coordinating group at the regime ionic strength, unit: '1', sign: any real, interval: '(-oo, oo)', domain: sequestration, regimes: [R-slurry], kind: input}
  - {id: pKa2, short: 'second pKa of a two-proton group', latex: '\mathrm{p}K_\mathrm{a2}', meaning: 'second acid dissociation constant (as -log10) of a coordinating group that binds Ca2+ only after losing two protons (a catechol binding through both oxygens), at the regime ionic strength; pKa2 > pKa (D27)', unit: '1', sign: any real, interval: '(-oo, oo)', domain: sequestration, regimes: [R-slurry], kind: input}
  - {id: K_Ca_L, short: 'Ca2+ complexation constant in solution', latex: 'K_\mathrm{CaL}', meaning: 'stability constant of the Ca2+ complex of the free ligand in solution, referenced to the standard concentration c_std, for the ligand form stated with it (for the catecholate analog, the dianion); a solution constant, not a surface-site free energy (D27)', unit: '1', sign: positive, interval: '(0, oo)', domain: sequestration, regimes: [R-slurry], kind: input}
  - {id: c_std, short: 'standard concentration of a solution constant', latex: 'c^{\circ}', meaning: 'standard concentration to which a solution binding constant refers (one mole per cubic decimetre, exact by definition)', unit: mol m^-3, sign: positive, interval: '(0, oo)', domain: sequestration, regimes: [R-slurry], kind: constant}
  - {id: E_enr, short: 'Ca2+ enrichment factor (dilute limit)', latex: '\mathcal{E}', meaning: 'Ca2+ enrichment factor c_local/c_bulk in the dilute, unsaturated limit: a concentration ratio, not an activity ratio (the Ca2+ chemical potential is uniform at equilibrium, so E_enr never enters the driving force)', unit: '1', sign: 'positive; above one means enrichment', interval: '(0, oo)', domain: sequestration, regimes: [R-slurry], kind: derived}
  - {id: c_bulk, short: 'bulk Ca2+ concentration', latex: 'c_\mathrm{bulk}', meaning: bulk Ca2+ concentration of the slurry, unit: mol m^-3, sign: positive, interval: '(0, oo)', domain: sequestration, regimes: [R-slurry], kind: input}
  - {id: c_local, short: 'mean Ca2+ concentration in the layer', latex: 'c_\mathrm{local}', meaning: mean Ca2+ concentration in the binding layer, unit: mol m^-3, sign: positive, interval: '(0, oo)', domain: sequestration, regimes: [R-slurry], kind: derived}
  - {id: c_max, short: 'saturation concentration of the layer', latex: 'c_\mathrm{max}', meaning: 'saturation concentration of the binding layer, c_max = Gamma_s / delta_s', unit: mol m^-3, sign: positive, interval: '(0, oo)', domain: sequestration, regimes: [R-slurry], kind: derived}
  - {id: Gamma_s, short: 'areal binding-site density', latex: '\Gamma_\mathrm{s}', meaning: areal density of Ca2+ binding sites on the anchored template, unit: mol m^-2, sign: positive, interval: '(0, oo)', domain: sequestration, regimes: [R-slurry], kind: input}
  - {id: delta_s, short: 'binding-layer thickness', latex: '\delta_\mathrm{s}', meaning: thickness of the binding layer (site volume per unit area), unit: m, sign: positive, interval: '(0, oo)', domain: sequestration, regimes: [R-slurry], kind: input}
  - {id: V_site, short: 'volume per binding site', latex: 'V_\mathrm{site}', meaning: volume assigned to one binding site; converts a site free energy into a local concentration, unit: m^3, sign: positive, interval: '(0, oo)', domain: sequestration, regimes: [R-slurry], kind: input}
  - {id: a_site, short: 'footprint area of one binding site', latex: 'a_\mathrm{site}', meaning: 'projected area occupied by one binding site with its bound Ca2+ on the template surface (geometric bound on Gamma_s)', unit: m^2, sign: positive, interval: '(0, oo)', domain: sequestration, regimes: [R-slurry], kind: input}
  - {id: rho_L, short: 'volume density of coordinating groups', latex: '\rho_\mathrm{L}', meaning: 'amount of coordinating groups per volume of the anchored template layer', unit: mol m^-3, sign: positive, interval: '(0, oo)', domain: sequestration, regimes: [R-slurry], kind: input}
  - {id: rho_PDA, short: 'template mass density', latex: '\rho_\mathrm{PDA}', meaning: 'mass density of the anchored template layer (polydopamine in P0); with M_u it bounds the volume density of coordinating groups (cp3b A3)', unit: kg m^-3, sign: positive, interval: '(0, oo)', domain: sequestration, regimes: [R-slurry], kind: input}
  - {id: M_u, short: 'least mass per group', latex: 'M_\mathrm{u}', meaning: 'smallest template mass per mole of coordinating groups over the candidate repeat units of the template (molar mass of a unit divided by the number of coordinating groups it carries); rho_L <= rho_PDA / M_u (cp3b A3)', unit: kg mol^-1, sign: positive, interval: '(0, oo)', domain: sequestration, regimes: [R-slurry], kind: input}
  - {id: d_layer, short: 'template layer thickness', latex: 'd_\mathrm{layer}', meaning: 'thickness of the anchored template layer (geometric upper bound on delta_s)', unit: m, sign: positive, interval: '(0, oo)', domain: sequestration, regimes: [R-slurry], kind: input}
  - {id: r_Ca, short: 'Ca2+ ionic radius', latex: 'r_\mathrm{Ca}', meaning: 'ionic radius of Ca2+ in its coordination environment (one coordination shell sets the least binding-layer thickness)', unit: m, sign: positive, interval: '(0, oo)', domain: sequestration, regimes: [R-slurry], kind: input}
  - {id: x_bind, short: 'Langmuir binding variable', latex: 'x', meaning: 'Langmuir binding variable x = E_enr c_bulk / c_max: the odds that a site is occupied by Ca2+ at the regime activity (Theta = x/(1 + x))', unit: '1', sign: positive, interval: '(0, oo)', domain: sequestration, regimes: [R-slurry], kind: derived}
  - {id: Theta_occ, short: 'fraction of sites occupied by Ca2+', latex: '\Theta', meaning: 'fraction of template binding sites occupied by Ca2+ at the regime activity (Langmuir)', unit: '1', sign: 'in (0, 1)', interval: '(0, 1)', domain: sequestration, regimes: [R-slurry], kind: derived}
  - {id: Gamma_Ca, short: 'Ca2+ surface excess (Gibbs)', latex: '\Gamma_\mathrm{Ca}', meaning: 'Gibbs relative surface excess of Ca2+ (with its compensating charge) at the template-liquid interface: bound amount per area minus the bulk amount in the layer volume; written Gamma_Ca,sl where it is set against the contact excess Gamma_Ca_sn', unit: mol m^-2, sign: 'positive for enrichment, negative for depletion', interval: '(-oo, oo)', domain: sequestration, regimes: [R-slurry], kind: derived}
  - {id: Gamma_Ca_sn, short: 'Ca2+ excess at the template-nucleus contact', latex: '\Gamma_\mathrm{Ca,sn}', meaning: 'Gibbs excess of Ca2+ at the template-crystal contact relative to the stoichiometric nucleus (for example an ion-bridged carboxylate-Ca-calcite contact); inside gamma_sn, with d gamma_sn / d mu_Ca = -Gamma_Ca_sn; a property of the contact, not derived from Delta_G_seq', unit: mol m^-2, sign: 'real; positive when the contact holds Ca2+ in excess', interval: '(-oo, oo)', domain: sequestration, regimes: [R-slurry], kind: derived}

  # ----- carbonate speciation (contract v3; constants from lit/params.yaml, none typed here)
  - {id: m_std, short: 'standard molality', latex: 'm^{\circ}', meaning: 'standard molality of the molal activity scale (one mole per kilogram of water, exact by definition)', unit: mol kg^-1, sign: positive, interval: '(0, oo)', domain: speciation, regimes: [R-slurry], kind: constant}
  - {id: rho_water, short: 'density of water', latex: '\rho_\mathrm{w}', meaning: 'mass density of water at the regime temperature; converts amounts per volume to molalities in dilute solution', unit: kg m^-3, sign: positive, interval: '(0, oo)', domain: speciation, regimes: [R-slurry], kind: input}
  - {id: I_ionic, short: 'ionic strength (molal)', latex: 'I', meaning: 'ionic strength of the regime solution on the molal scale, a registered input of the state', unit: mol kg^-1, sign: positive, interval: '(0, oo)', domain: speciation, regimes: [R-slurry], kind: input}
  - {id: C_T, short: 'dissolved inorganic carbon', latex: 'C_\mathrm{T}', meaning: 'total dissolved inorganic carbon of the regime state (closed system), per volume', unit: mol m^-3, sign: positive, interval: '(0, oo)', domain: speciation, regimes: [R-slurry], kind: input}
  - {id: Ca_T, short: 'total dissolved calcium', latex: '\mathrm{Ca}_\mathrm{T}', meaning: 'total dissolved calcium of the regime state, per volume (free ion plus ion pairs); the design input set by the Ca dose', unit: mol m^-3, sign: non-negative, interval: '(0, oo)', domain: speciation, regimes: [R-slurry], kind: input}
  - {id: pK1_carbonic, short: 'pK1 of carbonic acid', latex: '\mathrm{p}K_1', meaning: '-log10 of the first dissociation constant of CO2(aq) + H2O = H+ + HCO3- (activities, I = 0)', unit: '1', sign: real, interval: '(-oo, oo)', domain: speciation, regimes: [R-slurry], kind: input}
  - {id: pK2_carbonic, short: 'pK2 of carbonic acid', latex: '\mathrm{p}K_2', meaning: '-log10 of the dissociation constant of HCO3- = H+ + CO3 2- (activities, I = 0)', unit: '1', sign: real, interval: '(-oo, oo)', domain: speciation, regimes: [R-slurry], kind: input}
  - {id: K_CaCO3_aq, short: 'formation constant of CaCO3(aq)', latex: 'K_{\mathrm{CaCO_3^0}}', meaning: 'formation constant of the neutral ion pair, Ca2+ + CO3 2- = CaCO3(aq) (activities, I = 0)', unit: '1', sign: non-negative, interval: '(0, oo)', domain: speciation, regimes: [R-slurry], kind: input}
  - {id: K_CaHCO3, short: 'formation constant of CaHCO3+', latex: 'K_{\mathrm{CaHCO_3^+}}', meaning: 'formation constant of the ion pair, Ca2+ + HCO3- = CaHCO3+ (activities, I = 0)', unit: '1', sign: non-negative, interval: '(0, oo)', domain: speciation, regimes: [R-slurry], kind: input}
  - {id: K_CaOH, short: 'hydrolysis constant of CaOH+', latex: '{}^{*}K_{\mathrm{CaOH^+}}', meaning: 'hydrolysis constant of Ca2+ + H2O = CaOH+ + H+, a_CaOH a_H / (a_Ca a_w) (activities, I = 0)', unit: '1', sign: non-negative, interval: '(0, oo)', domain: speciation, regimes: [R-slurry], kind: input}
  - {id: A_DH, short: 'Debye-Hueckel constant', latex: 'A_\mathrm{DH}', meaning: 'Debye-Hueckel limiting-law constant at the regime temperature (log10 scale, with I in units of the standard molality)', unit: '1', sign: positive, interval: '(0, oo)', domain: speciation, regimes: [R-slurry], kind: input}
  - {id: b_D, short: 'Davies linear coefficient', latex: 'b_\mathrm{D}', meaning: 'coefficient of the linear term of the Davies equation (fetched with its source, not typed)', unit: '1', sign: positive, interval: '(0, oo)', domain: speciation, regimes: [R-slurry], kind: input}
  - {id: I_val, short: 'upper validity bound of the activity model', latex: 'I_\mathrm{val}', meaning: 'largest ionic strength at which the Davies equation is registered as valid (fetched); never above the turning point of the Davies coefficient', unit: mol kg^-1, sign: positive, interval: '(0, oo)', domain: speciation, regimes: [R-slurry], kind: input}
  - {id: g_1, short: 'activity coefficient, charge one', latex: '\gamma_{\pm1}', meaning: 'activity coefficient of a singly charged ion (Davies)', unit: '1', sign: positive, interval: '(0, oo)', domain: speciation, regimes: [R-slurry], kind: derived}
  - {id: g_2, short: 'activity coefficient, charge two', latex: '\gamma_{\pm2}', meaning: 'activity coefficient of a doubly charged ion (Davies), g_2 = g_1^4', unit: '1', sign: positive, interval: '(0, oo)', domain: speciation, regimes: [R-slurry], kind: derived}
  - {id: m_CT, short: 'dissolved inorganic carbon, molal', latex: 'm_{C_\mathrm{T}}', meaning: 'total dissolved inorganic carbon in units of the standard molality, C_T/(rho_w m_std)', unit: '1', sign: positive, interval: '(0, oo)', domain: speciation, regimes: [R-slurry], kind: derived}
  - {id: m_CaT, short: 'total calcium, molal', latex: 'm_{\mathrm{Ca}_\mathrm{T}}', meaning: 'total dissolved calcium in units of the standard molality, Ca_T/(rho_w m_std)', unit: '1', sign: non-negative, interval: '(0, oo)', domain: speciation, regimes: [R-slurry], kind: derived}
  - {id: A_carb, short: 'carbonate speciation factor', latex: 'A_\mathrm{c}', meaning: 'free carbon species (CO2(aq), HCO3-, CO3 2-) per unit carbonate activity, in standard molalities', unit: '1', sign: positive, interval: '(0, oo)', domain: speciation, regimes: [R-slurry], kind: derived}
  - {id: P_pair, short: 'ion-pair factor', latex: 'P_\mathrm{c}', meaning: 'Ca-carbonate ion pairs (CaCO3(aq), CaHCO3+) per unit product a_Ca a_CO3, in standard molalities', unit: '1', sign: non-negative, interval: '(0, oo)', domain: speciation, regimes: [R-slurry], kind: derived}
  - {id: D_Ca, short: 'free-calcium factor', latex: 'D_\mathrm{c}', meaning: 'Ca2+ and CaOH+ per unit Ca2+ activity, in standard molalities', unit: '1', sign: positive, interval: '(0, oo)', domain: speciation, regimes: [R-slurry], kind: derived}

  # ----- phosphate speciation (contract v5; constants from lit/params.yaml, none typed here)
  - {id: P_T, short: 'total dissolved phosphate', latex: 'P_\mathrm{T}', meaning: 'total dissolved phosphate of the regime state (closed system), per volume, free species plus ion pairs; the design input set by the phosphate dose', unit: mol m^-3, sign: positive, interval: '(0, oo)', domain: speciation, regimes: [R-slurry], kind: input}
  - {id: pK1_phosphoric, short: 'pK1 of phosphoric acid', latex: '\mathrm{p}K_{1}^{\mathrm{P}}', meaning: '-log10 of the first dissociation constant of H3PO4 = H+ + H2PO4- (activities, I = 0)', unit: '1', sign: real, interval: '(-oo, oo)', domain: speciation, regimes: [R-slurry], kind: input}
  - {id: pK2_phosphoric, short: 'pK2 of phosphoric acid', latex: '\mathrm{p}K_{2}^{\mathrm{P}}', meaning: '-log10 of the second dissociation constant of H2PO4- = H+ + HPO4 2- (activities, I = 0)', unit: '1', sign: real, interval: '(-oo, oo)', domain: speciation, regimes: [R-slurry], kind: input}
  - {id: pK3_phosphoric, short: 'pK3 of phosphoric acid', latex: '\mathrm{p}K_{3}^{\mathrm{P}}', meaning: '-log10 of the third dissociation constant of HPO4 2- = H+ + PO4 3- (activities, I = 0)', unit: '1', sign: real, interval: '(-oo, oo)', domain: speciation, regimes: [R-slurry], kind: input}
  - {id: pKw, short: 'pK of water', latex: '\mathrm{p}K_\mathrm{w}', meaning: '-log10 of the autoprotolysis constant of water, K_w = a_H a_OH / a_w (activities, I = 0)', unit: '1', sign: real, interval: '(-oo, oo)', domain: speciation, regimes: [R-slurry], kind: input}
  - {id: K_CaHPO4_aq, short: 'formation constant of CaHPO4(aq)', latex: 'K_{\mathrm{CaHPO_4^0}}', meaning: 'formation constant of the neutral ion pair, Ca2+ + HPO4 2- = CaHPO4(aq) (activities, I = 0)', unit: '1', sign: non-negative, interval: '(0, oo)', domain: speciation, regimes: [R-slurry], kind: input}
  - {id: K_CaH2PO4, short: 'formation constant of CaH2PO4+', latex: 'K_{\mathrm{CaH_2PO_4^+}}', meaning: 'formation constant of the ion pair, Ca2+ + H2PO4- = CaH2PO4+ (activities, I = 0)', unit: '1', sign: non-negative, interval: '(0, oo)', domain: speciation, regimes: [R-slurry], kind: input}
  - {id: K_CaPO4, short: 'formation constant of CaPO4-', latex: 'K_{\mathrm{CaPO_4^-}}', meaning: 'formation constant of the ion pair, Ca2+ + PO4 3- = CaPO4- (activities, I = 0)', unit: '1', sign: non-negative, interval: '(0, oo)', domain: speciation, regimes: [R-slurry], kind: input}
  - {id: g_3, short: 'activity coefficient, charge three', latex: '\gamma_{\pm3}', meaning: 'activity coefficient of a triply charged ion (Davies), g_3 = g_1^9', unit: '1', sign: positive, interval: '(0, oo)', domain: speciation, regimes: [R-slurry], kind: derived}
  - {id: m_PT, short: 'total phosphate, molal', latex: 'm_{P_\mathrm{T}}', meaning: 'total dissolved phosphate in units of the standard molality, P_T/(rho_w m_std)', unit: '1', sign: positive, interval: '(0, oo)', domain: speciation, regimes: [R-slurry], kind: derived}
  - {id: A_phos, short: 'phosphate speciation factor', latex: 'A_\mathrm{p}', meaning: 'free phosphate species (H3PO4, H2PO4-, HPO4 2-, PO4 3-) per unit PO4 3- activity, in standard molalities', unit: '1', sign: positive, interval: '(0, oo)', domain: speciation, regimes: [R-slurry], kind: derived}
  - {id: P_pair_phos, short: 'phosphate ion-pair factor', latex: 'P_\mathrm{p}', meaning: 'Ca-phosphate ion pairs (CaHPO4(aq), CaH2PO4+, CaPO4-) per unit product a_Ca a_PO4, in standard molalities; each pair holds one Ca and one phosphate, so the same factor closes the calcium and the phosphate balance', unit: '1', sign: non-negative, interval: '(0, oo)', domain: speciation, regimes: [R-slurry], kind: derived}
  - {id: a_PO4, short: 'free phosphate activity', latex: 'a_{\mathrm{PO}_4^{3-}}', meaning: 'free PO4 3- activity (molal standard state) of the regime state, from the phosphate speciation', unit: '1', sign: positive, interval: '(0, oo)', domain: supersaturation, regimes: [R-slurry], kind: input}
  - {id: a_HPO4, short: 'free hydrogen phosphate activity', latex: 'a_{\mathrm{HPO}_4^{2-}}', meaning: 'free HPO4 2- activity (molal standard state), from the phosphate speciation', unit: '1', sign: positive, interval: '(0, oo)', domain: supersaturation, regimes: [R-slurry], kind: input}
  - {id: a_OH, short: 'hydroxide activity', latex: 'a_{\mathrm{OH}^{-}}', meaning: 'hydroxide activity (molal standard state), a_OH = K_w a_w / a_H; a design axis of K1 (structural-OH oxidation) and the OH- ion of hydroxyapatite', unit: '1', sign: positive, interval: '(0, oo)', domain: supersaturation, regimes: [R-slurry, R-cell], kind: input}

  # ----- supersaturation
  - {id: a_Ca, short: 'bulk Ca2+ activity', latex: 'a_{\mathrm{Ca}^{2+}}', meaning: bulk Ca2+ activity (molal standard state), unit: '1', sign: positive, interval: '(0, oo)', domain: supersaturation, regimes: [R-slurry], kind: input}
  - {id: a_CO3, short: 'bulk carbonate activity', latex: 'a_{\mathrm{CO}_3^{2-}}', meaning: bulk carbonate-ion activity at the regime pH (molal standard state), unit: '1', sign: positive, interval: '(0, oo)', domain: supersaturation, regimes: [R-slurry], kind: input}
  - {id: K_sp, short: 'solubility product of the registered mineral framing', latex: 'K_\mathrm{sp}', meaning: solubility product of the registered mineral and framing at T, written for its formula unit with the activity exponents nu_i and a_w^n (contract v5; CaCO3 calcite or ACC is the nu = 2 case), unit: '1', sign: positive, interval: '(0, oo)', domain: supersaturation, regimes: [R-slurry], kind: input}
  - {id: a_w, short: 'water activity of the regime state', latex: 'a_\mathrm{w}', meaning: 'water activity of the registered R-slurry state (one in the slurry, below one at drying states); reported at each drying state (cp2 fix F7)', unit: '1', sign: 'in (0, 1]', interval: '(0, 1]', domain: supersaturation, regimes: [R-slurry], kind: input}
  - {id: n_hyd, short: 'structural water per formula unit (hydrated framing)', latex: 'n', meaning: 'number of structural water molecules per formula unit of the mineral framing; enters the ion activity product as a_w^n (contract v5; for CaCO3 it is used only in the labelled hydrated-IAP sensitivity)', unit: '1', sign: non-negative, interval: '[0, oo)', domain: supersaturation, regimes: [R-slurry], kind: count}
  - {id: Omega_bulk, short: 'bulk saturation ratio IAP/Ksp', latex: '\Omega_\mathrm{bulk}', meaning: 'bulk saturation ratio IAP/K_sp', unit: '1', sign: 'positive; above one is supersaturated', interval: '(0, oo)', domain: supersaturation, regimes: [R-slurry], kind: derived}
  - {id: Omega, short: 'saturation ratio where the nucleus forms', latex: '\Omega', meaning: 'saturation ratio IAP/K_sp where the nucleus forms; at equilibrium the ion chemical potentials are uniform, so it equals Omega_bulk at the template (contract v2)', unit: '1', sign: 'positive; nucleation requires Omega > 1', interval: '(0, oo)', domain: supersaturation, regimes: [R-slurry], kind: derived}

  # ----- stoichiometric generalisation (contract v5)
  - {id: nu_Ca, short: 'Ca ions per formula unit', latex: '\nu_\mathrm{Ca}', meaning: 'number of Ca2+ ions per formula unit of the mineral; the exponent of a_Ca in the ion activity product', unit: '1', sign: positive, interval: '(0, oo)', domain: supersaturation, regimes: [R-slurry], kind: count}
  - {id: nu_X, short: 'anions of type X per formula unit', latex: '\nu_\mathrm{X}', meaning: 'number of ions of the first anion type X (PO4 3- for apatite, CO3 2- for calcite) per formula unit; the exponent of a_X', unit: '1', sign: positive, interval: '(0, oo)', domain: supersaturation, regimes: [R-slurry], kind: count}
  - {id: nu_Y, short: 'anions of type Y per formula unit', latex: '\nu_\mathrm{Y}', meaning: 'number of ions of the second anion type Y (OH- for hydroxyapatite, HPO4 2- for octacalcium phosphate) per formula unit; zero when the mineral has one anion type; the exponent of a_Y', unit: '1', sign: non-negative, interval: '[0, oo)', domain: supersaturation, regimes: [R-slurry], kind: count}
  - {id: nu, short: 'ions per formula unit', latex: '\nu', meaning: 'total number of ions per formula unit, nu = nu_Ca + nu_X + nu_Y; the driving force per formula unit is nu times that per ion', unit: '1', sign: positive, interval: '(0, oo)', domain: supersaturation, regimes: [R-slurry], kind: count}
  - {id: a_X, short: 'activity of anion X', latex: 'a_\mathrm{X}', meaning: 'bulk activity of the first anion type X of the mineral (molal standard state); a_PO4 for apatite, a_CO3 for calcite', unit: '1', sign: positive, interval: '(0, oo)', domain: supersaturation, regimes: [R-slurry], kind: input}
  - {id: a_Y, short: 'activity of anion Y', latex: 'a_\mathrm{Y}', meaning: 'bulk activity of the second anion type Y of the mineral (molal standard state); a_OH for hydroxyapatite, a_HPO4 for octacalcium phosphate', unit: '1', sign: positive, interval: '(0, oo)', domain: supersaturation, regimes: [R-slurry], kind: input}
  - {id: IAP, short: 'ion activity product of the formula unit', latex: '\mathrm{IAP}', meaning: 'ion activity product of one formula unit, a_Ca^nu_Ca a_X^nu_X a_Y^nu_Y a_w^n', unit: '1', sign: positive, interval: '(0, oo)', domain: supersaturation, regimes: [R-slurry], kind: derived}
  - {id: M_fu, short: 'molar mass per formula unit', latex: 'M_\mathrm{fu}', meaning: 'molar mass of one mole of formula units of the mineral framing', unit: kg mol^-1, sign: positive, interval: '(0, oo)', domain: nucleation, regimes: [R-slurry], kind: input}
  - {id: rho_s, short: 'density of the mineral framing', latex: '\rho_\mathrm{s}', meaning: 'mass density of the registered mineral framing (crystal or amorphous)', unit: kg m^-3, sign: positive, interval: '(0, oo)', domain: nucleation, regimes: [R-slurry], kind: input}
  - {id: Delta_mu, short: 'driving force per formula unit', latex: '\Delta\mu', meaning: 'chemical-potential drop per formula unit on crystallisation, Delta_mu = k_B T ln Omega', unit: J, sign: 'positive when supersaturated', interval: '(-oo, oo)', domain: supersaturation, regimes: [R-slurry], kind: derived}

  # ----- C3 nucleation
  - {id: gamma_nl, latex: '\gamma_\mathrm{nl}', meaning: 'nucleus-liquid interfacial free energy (CaCO3 framing against the aqueous solution); written gamma_nuc,liq in the charter', unit: J m^-2, sign: positive, interval: '(0, oo)', domain: nucleation, regimes: [R-slurry], kind: input}
  - {id: gamma_sl, short: 'template-liquid energy at the regime activities', latex: '\gamma_\mathrm{sl}', meaning: 'substrate (anchored template) - liquid interfacial free energy at the regime ion activities, i.e. with the equilibrium Ca2+ adsorption included (grand-canonical): gamma_sl = gamma_sl0 + Delta_gamma_ads; gamma_sub,liq in the charter', unit: J m^-2, sign: real, interval: '(-oo, oo)', domain: nucleation, regimes: [R-slurry], kind: input}
  - {id: gamma_sl0, short: 'template-liquid energy without Ca2+ binding', latex: '\gamma_\mathrm{sl}^{(0)}', meaning: 'substrate - liquid interfacial free energy of the template in the regime electrolyte without specific Ca2+ binding (same pH and ionic strength, no Ca2+ at the sites)', unit: J m^-2, sign: real, interval: '(-oo, oo)', domain: nucleation, regimes: [R-slurry], kind: input}
  - {id: Delta_gamma_ads, short: 'Ca2+ adsorption change of the template-liquid energy', latex: '\Delta\gamma_\mathrm{ads}', meaning: 'change of the template-liquid interfacial free energy by specific Ca2+ adsorption at the regime activity, from the Gibbs adsorption equation with the Langmuir isotherm: Delta_gamma_ads = gamma_sl - gamma_sl0; zero by definition when gamma_sl is computed at the regime activities', unit: J m^-2, sign: 'negative for net binding (it lowers gamma_sl and cos theta)', interval: '(-oo, oo)', domain: nucleation, regimes: [R-slurry], kind: derived}
  - {id: gamma_sn, short: 'template-nucleus energy in water (= ref + correction)', latex: '\gamma_\mathrm{sn}', meaning: 'substrate - nucleus interfacial free energy in water at the regime chemical potentials (grand-canonical: any Ca2+ excess Gamma_Ca_sn at the contact is inside it), including the displacement of the template hydration layer: gamma_sn = gamma_sn0 + Delta_gamma_w; taken from contact data at the regime state, never built from Delta_G_seq; gamma_sub,nuc in the charter', unit: J m^-2, sign: real, interval: '(-oo, oo)', domain: nucleation, regimes: [R-slurry], kind: derived}
  - {id: gamma_sn0, short: 'template-nucleus energy, reference without water displacement', latex: '\gamma_\mathrm{sn}^{(0)}', meaning: 'substrate - nucleus interfacial free energy from a reference that does not include removal of the template hydration layer', unit: J m^-2, sign: real, interval: '(-oo, oo)', domain: nucleation, regimes: [R-slurry], kind: input}
  - {id: Delta_gamma_w, short: 'water-displacement correction (cost > 0)', latex: '\Delta\gamma_\mathrm{w}', meaning: 'water-displacement correction, Delta_gamma_w = gamma_sn - gamma_sn0: excess free energy per unit contact area to displace the template-bound water layer when the nucleus contacts the template; zero by definition when gamma_sn is already a full in-water interfacial free energy', unit: J m^-2, sign: 'positive is a cost (raises theta and f)', interval: '(-oo, oo)', domain: nucleation, regimes: [R-slurry], kind: input}
  - {id: gamma_eff, short: 'deck effective nucleus-liquid energy (audit only)', latex: '\gamma_\mathrm{eff}', meaning: 'deck form gamma_eff = gamma_nl - Delta_gamma_w; recorded for the audit and the double-counting demonstration only; not used in Young or in the homogeneous barrier', unit: J m^-2, sign: 'below gamma_nl when Delta_gamma_w is a cost (the wrong-way effect of design flag 3)', interval: '(-oo, oo)', domain: nucleation, regimes: [R-slurry], kind: derived}
  - {id: theta, short: 'contact angle, measured through the nucleus', latex: '\theta', meaning: 'contact angle of the spherical-cap nucleus, measured through the nucleus at the three-phase line', unit: rad, sign: 'in [0, pi]; 0 is complete wetting of the substrate by the nucleus', interval: '[0, pi]', domain: nucleation, regimes: [R-slurry], kind: derived}
  - {id: f_theta, latex: 'f(\theta)', meaning: 'heterogeneous shape factor, ratio of the heterogeneous to the homogeneous barrier', unit: '1', sign: 'in [0, 1]', interval: '[0, 1]', domain: nucleation, regimes: [R-slurry], kind: derived}
  - {id: V_m, short: 'molar volume of the registered framing', latex: 'V_\mathrm{m}', meaning: molar volume of the registered mineral framing per formula unit (contract v5; the volume of N_A formula units, never per ion), unit: m^3 mol^-1, sign: positive, interval: '(0, oo)', domain: nucleation, regimes: [R-slurry], kind: input}
  - {id: r_star, short: 'critical radius', latex: 'r^{*}', meaning: critical radius (homogeneous sphere and heterogeneous cap share it), unit: m, sign: positive for Omega > 1, interval: '(0, oo)', domain: nucleation, regimes: [R-slurry], kind: derived}
  - {id: DG_hom, latex: '\Delta G^{*}_\mathrm{hom}', meaning: homogeneous nucleation barrier per nucleus, unit: J, sign: positive for Omega > 1, interval: '(0, oo)', domain: nucleation, regimes: [R-slurry], kind: derived}
  - {id: DG_het, short: 'heterogeneous barrier on the template', latex: '\Delta G^{*}_\mathrm{het}', meaning: heterogeneous nucleation barrier per nucleus on the template, unit: J, sign: 'in [0, DG_hom]', interval: '[0, oo)', domain: nucleation, regimes: [R-slurry], kind: derived}

  # ----- C3 accessibility of the barrier
  - {id: J0_het, short: 'heterogeneous nucleation prefactor per area', latex: 'J_{0}', meaning: 'kinetic prefactor of heterogeneous nucleation per unit template area, J = J_0 exp(-DG_het / k_B T)', unit: m^-2 s^-1, sign: positive, interval: '(0, oo)', domain: accessibility, regimes: [R-slurry], kind: input}
  - {id: t_proc, short: 'time available for nucleation', latex: 't_\mathrm{p}', meaning: 'time the template spends at the registered R-slurry state (slurry contact plus drying), over which nuclei can form', unit: s, sign: positive, interval: '(0, oo)', domain: accessibility, regimes: [R-slurry], kind: input}
  - {id: N_req, short: 'required areal density of nuclei', latex: 'N_\mathrm{req}', meaning: 'areal density of nuclei that must form on the template within t_proc (a registered input, not a result); registered as N_req = ln(1/q_0)/A_patch with q_0 = 1 - p_cred, so that at most a fraction q_0 of the particle-collector contact patches holds no nucleus (Poisson occupancy; cp3 R5); not the C4 closure density', unit: m^-2, sign: positive, interval: '(0, oo)', domain: accessibility, regimes: [R-slurry], kind: input}
  - {id: q_0, short: 'admissible fraction of empty contact patches', latex: 'q_0', meaning: 'largest admissible fraction of particle-collector contact patches with no nucleus, q_0 = 1 - p_cred (cp3 R5)', unit: '1', sign: 'in (0, 1/2)', interval: '(0, 1)', domain: accessibility, regimes: [R-slurry], kind: derived}
  - {id: A_patch, short: 'particle-collector contact patch', latex: 'A_\mathrm{patch}', meaning: 'area of the contact patch through which a cathode particle touches the collector (literature process input); the C3 accessibility rule registers N_req = 1/A_patch (cp2 fix F4)', unit: m^2, sign: positive, interval: '(0, oo)', domain: accessibility, regimes: [R-slurry], kind: input}
  - {id: d_p, short: 'particle diameter', latex: 'd_\mathrm{p}', meaning: 'projected-area-equivalent diameter of a cathode particle: the diameter of the disc whose area equals the particle''s largest projected area; pi d_p^2 / 4 bounds the contact patch from above (cp3b A3)', unit: m, sign: positive, interval: '(0, oo)', domain: accessibility, regimes: [R-slurry], kind: input}
  - {id: a_asp, short: 'asperity contact area', latex: 'a_\mathrm{asp}', meaning: 'area of one asperity contact between a cathode particle and the collector; a patch holds at least one, so it bounds the contact patch from below (cp3b A3)', unit: m^2, sign: positive, interval: '(0, oo)', domain: accessibility, regimes: [R-slurry], kind: input}
  - {id: B_acc, short: 'largest accessible barrier', latex: 'B_\mathrm{acc}', meaning: 'largest barrier that still gives N_req nuclei per area within t_proc: B_acc = k_B T ln(J_0 t_p / N_req)', unit: J, sign: 'positive when J_0 t_p > N_req', interval: '(-oo, oo)', domain: accessibility, regimes: [R-slurry], kind: derived}
  - {id: N_nuc, short: 'expected areal density of nuclei', latex: 'N_\mathrm{nuc}', meaning: 'expected areal density of nuclei formed within t_proc at barrier DG_het (no exclusion zones; an upper estimate)', unit: m^-2, sign: positive, interval: '(0, oo)', domain: accessibility, regimes: [R-slurry], kind: derived}

  # ----- C4 conformality
  - {id: S_spread, short: 'spreading coefficient', latex: 'S_\mathrm{spread}', meaning: 'spreading coefficient of the nucleus phase on the template in water, gamma_sl - gamma_sn - gamma_nl', unit: J m^-2, sign: 'S_spread >= 0 is complete wetting (layer growth); S_spread < 0 is partial wetting (islands)', interval: '(-oo, oo)', domain: conformality, regimes: [R-slurry], kind: derived}
  - {id: N_s, short: 'island density at coalescence', latex: 'N_\mathrm{s}', meaning: areal number density of nuclei (islands) at coalescence, unit: m^-2, sign: positive, interval: '(0, oo)', domain: conformality, regimes: [R-slurry], kind: input}
  - {id: h_c, short: 'geometric coalescence thickness', latex: 'h_\mathrm{c}', meaning: 'cap height of equal spherical-cap islands at first contact on a square lattice of density N_s (geometric coalescence thickness); geometric only, distinct from the kinetic h_coal (cp2 fix F9)', unit: m, sign: positive, interval: '(0, oo)', domain: conformality, regimes: [R-slurry], kind: derived}
  - {id: h_cl, short: 'geometric closure thickness', latex: 'h_\mathrm{cl}', meaning: 'cap height at which equal spherical-cap islands on a square lattice of density N_s cover the whole area (base radius = spacing / sqrt 2)', unit: m, sign: positive, interval: '(0, oo)', domain: conformality, regimes: [R-slurry], kind: derived}
  - {id: h_coal, short: 'kinetic critical coalescence thickness (charter C4 (c))', latex: 'h_\mathrm{coal}', meaning: 'kinetic critical coalescence thickness: the film thickness at which islands coalesce, from a kinetic Monte Carlo or rate-equation model of nucleation and lateral growth (charter C4 candidate (c)); renamed from the charter h_c at cp2 (fix F9), so that h_c keeps its geometric meaning; not computed in P0', unit: m, sign: positive, interval: '(0, oo)', domain: conformality, regimes: [R-slurry], kind: derived}

  # ----- C5 stability, R-slurry (aqueous Pourbaix)
  - {id: G_phase, short: 'molar Gibbs energy of species phi', latex: 'G_\phi', meaning: 'molar Gibbs energy of formation of a solid or aqueous species phi per formula unit, in the Pourbaix reference frame', unit: J mol^-1, sign: real, interval: '(-oo, oo)', domain: stability, regimes: [R-slurry], kind: input}
  - {id: mu_H2O, short: 'chemical potential of water', latex: '\mu_{\mathrm{H_2O}}', meaning: molar chemical potential of water at the regime water activity, unit: J mol^-1, sign: real, interval: '(-oo, oo)', domain: stability, regimes: [R-slurry], kind: input}
  - {id: N_O, latex: 'n_\mathrm{O}', meaning: number of O atoms per formula unit, unit: '1', sign: non-negative, interval: '[0, oo)', domain: stability, regimes: [R-slurry], kind: count}
  - {id: N_H, latex: 'n_\mathrm{H}', meaning: number of H atoms per formula unit, unit: '1', sign: non-negative, interval: '[0, oo)', domain: stability, regimes: [R-slurry], kind: count}
  - {id: N_M, short: 'number of non-O, non-H atoms', latex: 'n_\mathrm{M}', meaning: number of non-O non-H atoms per formula unit (normalisation), unit: '1', sign: positive, interval: '(0, oo)', domain: stability, regimes: [R-slurry], kind: count}
  - {id: Q_charge, short: 'species charge in units of e', latex: 'Q', meaning: charge of the species in units of e, unit: '1', sign: any integer, interval: '(-oo, oo)', domain: stability, regimes: [R-slurry], kind: count}
  - {id: Psi_pbx, short: 'Pourbaix potential per metal atom', latex: '\Psi_\phi', meaning: 'Pourbaix potential of species phi per non-O non-H atom at (pH, E_SHE)', unit: J mol^-1, sign: real, interval: '(-oo, oo)', domain: stability, regimes: [R-slurry], kind: derived}
  - {id: Psi_hull, short: 'lower envelope of Psi (the hull)', latex: '\Psi_\mathrm{hull}', meaning: 'lower envelope of Psi over all competing species at the same (pH, E_SHE) and composition', unit: J mol^-1, sign: real, interval: '(-oo, oo)', domain: stability, regimes: [R-slurry], kind: derived}
  - {id: Delta_G_pbx, latex: '\Delta G_\mathrm{pbx}', meaning: 'energy above the aqueous Pourbaix hull, Psi_pbx - Psi_hull', unit: J mol^-1, sign: 'non-negative; zero means on the hull', interval: '[0, oo)', domain: stability, regimes: [R-slurry], kind: derived}

  # ----- C5 stability, R-cell (Li-open grand potential)
  - {id: N_Li, latex: 'n_\mathrm{Li}', meaning: number of Li atoms per formula unit, unit: '1', sign: non-negative, interval: '[0, oo)', domain: stability, regimes: [R-cell], kind: count}
  - {id: mu_Li0, short: 'Li chemical potential in Li metal', latex: '\mu_\mathrm{Li}^{\circ}', meaning: molar chemical potential of Li in Li metal (the Li+/Li reference), unit: J mol^-1, sign: real, interval: '(-oo, oo)', domain: stability, regimes: [R-cell], kind: input}
  - {id: mu_Li, short: 'Li chemical potential at the electrode potential', latex: '\mu_\mathrm{Li}', meaning: 'Li chemical potential imposed by the electrode potential, mu_Li = mu_Li0 - F E_Li', unit: J mol^-1, sign: real, interval: '(-oo, oo)', domain: stability, regimes: [R-cell], kind: derived}
  - {id: Phi_Li, short: 'Li-open grand potential', latex: '\Phi_\phi', meaning: 'Li-open grand potential of phase phi per formula unit, G_phase - n_Li mu_Li', unit: J mol^-1, sign: real, interval: '(-oo, oo)', domain: stability, regimes: [R-cell], kind: derived}
  - {id: Delta_G_r, short: 'reaction free energy against Li metal', latex: '\Delta G_\mathrm{r}', meaning: 'free energy of a decomposition reaction of phase phi that releases Delta_n_Li Li atoms as Li metal, per formula unit of phi', unit: J mol^-1, sign: real, interval: '(-oo, oo)', domain: stability, regimes: [R-cell], kind: input}
  - {id: Delta_n_Li, short: 'Li released by the reaction', latex: '\Delta n', meaning: 'number of Li atoms released to the reservoir per formula unit of phi (negative when Li is taken up)', unit: '1', sign: 'positive for delithiation (oxidation), negative for lithiation (reduction)', interval: '(-oo, oo)', domain: stability, regimes: [R-cell], kind: count}
  - {id: Delta_Phi_r, short: 'grand-potential change of the reaction', latex: '\Delta\Phi', meaning: 'Li-open grand-potential change of the reaction at E_Li, Delta_G_r - Delta_n_Li F E_Li', unit: J mol^-1, sign: 'positive means phi is stable against that reaction', interval: '(-oo, oo)', domain: stability, regimes: [R-cell], kind: derived}
  - {id: E_star, short: 'potential limit set by one reaction', latex: 'E^{*}', meaning: 'potential vs Li+/Li at which Delta_Phi_r = 0 for one reaction', unit: V, sign: real, interval: '(-oo, oo)', domain: stability, regimes: [R-cell], kind: derived}
  - {id: E_red, short: 'lower limit of the stability window', latex: 'E_\mathrm{red}', meaning: lower (reduction) limit of the Li-referenced stability window of a phase, unit: V, sign: real, interval: '(-oo, oo)', domain: stability, regimes: [R-cell], kind: derived}
  - {id: E_ox, short: 'upper limit of the stability window', latex: 'E_\mathrm{ox}', meaning: upper (oxidation) limit of the Li-referenced stability window of a phase, unit: V, sign: real, interval: '(-oo, oo)', domain: stability, regimes: [R-cell], kind: derived}

  # ----- K1 of the redirected screen: cutoff, bracket and service limit (cp4 F2; claims_redirect Section 2f)
  - {id: E_c, short: 'charge cutoff', latex: 'E_\mathrm{c}', meaning: 'charge cutoff of the cell vs Li+/Li, a design axis grouped into the registered cutoff classes', unit: V, sign: real, interval: '(-oo, oo)', domain: stability, regimes: [R-cell], kind: input}
  - {id: Delta_G_r_ss, short: 'reaction free energy, solid-salt sink', latex: '\Delta G_\mathrm{r}^\mathrm{ss}', meaning: 'free energy of an oxidation reaction of phase phi with the solid-salt sink (cation to its solid perchlorate, Li from solid LiClO4), per formula unit of phi', unit: J mol^-1, sign: real, interval: '(-oo, oo)', domain: stability, regimes: [R-cell], kind: input}
  - {id: Delta_G_r_aq, short: 'reaction free energy, aqueous sink', latex: '\Delta G_\mathrm{r}^\mathrm{aq}', meaning: 'free energy of the same reaction with every ionic product and the consumed Li+ aqueous at standard state, from one table of standard formation free energies, per formula unit of phi', unit: J mol^-1, sign: real, interval: '(-oo, oo)', domain: stability, regimes: [R-cell], kind: input}
  - {id: Delta_G_tr_rel, short: 'relative transfer free energy, water to the cell solvent', latex: '\Delta G_\mathrm{tr}^\mathrm{rel}', meaning: 'charge-balanced transfer free energy from water to the cell solvent of the ionic products minus that of the consumed Li+ (DG_tr(M) - z DG_tr(Li+); with neutral salts the anion cancels); the transfer premise is Delta_G_tr_rel >= 0', unit: J mol^-1, sign: real, interval: '(-oo, oo)', domain: stability, regimes: [R-cell], kind: input}
  - {id: E_ub, short: 'K1 onset, solid-salt sink (upper end)', latex: 'E_\mathrm{ub}', meaning: 'oxidation onset vs Li+/Li with the solid-salt sink; upper end of the K1 bracket', unit: V, sign: real, interval: '(-oo, oo)', domain: stability, regimes: [R-cell], kind: derived}
  - {id: E_lb, short: 'K1 onset, aqueous sink (lower end)', latex: 'E_\mathrm{lb}', meaning: 'oxidation onset vs Li+/Li with every ion aqueous (most favourable sink); lower end of the K1 bracket under the transfer premise', unit: V, sign: real, interval: '(-oo, oo)', domain: stability, regimes: [R-cell], kind: derived}
  - {id: E_solv, short: 'K1 onset in the cell solvent', latex: 'E_\mathrm{S}', meaning: 'oxidation onset vs Li+/Li in the cell solvent, E_lb shifted by Delta_G_tr_rel', unit: V, sign: real, interval: '(-oo, oo)', domain: stability, regimes: [R-cell], kind: derived}
  - {id: E_lb_glass, short: 'K1 lower end, amorphous framing', latex: 'E_\mathrm{lb}^\mathrm{g}', meaning: 'lower end of the K1 bracket for the amorphous (glass) framing of a route product', unit: V, sign: real, interval: '(-oo, oo)', domain: stability, regimes: [R-cell], kind: derived}
  - {id: E_ub_glass, short: 'K1 upper end, amorphous framing', latex: 'E_\mathrm{ub}^\mathrm{g}', meaning: 'upper end of the K1 bracket for the amorphous (glass) framing of a route product', unit: V, sign: real, interval: '(-oo, oo)', domain: stability, regimes: [R-cell], kind: derived}
  - {id: B_born, short: 'Born transfer constant', latex: 'B_\mathrm{S}', meaning: 'Born-continuum constant of the transfer from water to the cell solvent, N_A e^2 (1/eps_S - 1/eps_w)/(8 pi eps_0); non-negative when the cell solvent has the lower permittivity', unit: J m mol^-1, sign: real, interval: '(-oo, oo)', domain: stability, regimes: [R-cell], kind: input}
  - {id: z_M, short: 'charge number of the product cation', latex: 'z_\mathrm{M}', meaning: 'charge number of the cation released by the oxidation (Ca2+ two, Al3+ three)', unit: '1', sign: positive, interval: '(0, oo)', domain: stability, regimes: [R-cell], kind: count}
  - {id: r_M, short: 'Born radius of the product cation', latex: 'r_\mathrm{M}', meaning: 'effective Born radius of the product cation', unit: m, sign: positive, interval: '(0, oo)', domain: stability, regimes: [R-cell], kind: input}
  - {id: r_Li, short: 'Born radius of Li+', latex: 'r_\mathrm{Li}', meaning: 'effective Born radius of Li+', unit: m, sign: positive, interval: '(0, oo)', domain: stability, regimes: [R-cell], kind: input}
  - {id: E_svc, short: 'measured service limit (tier 2)', latex: 'E_\mathrm{svc}', meaning: 'highest potential vs Li+/Li at which a tier-2 record shows service (current at or below j_svc for the registered time)', unit: V, sign: real, interval: '(-oo, oo)', domain: stability, regimes: [R-cell], kind: input}
  - {id: Delta_G_hyd, short: 'single-ion hydration free energy', latex: '\Delta G_\mathrm{hyd}', meaning: 'absolute hydration free energy of one ion (an extra-thermodynamic scale); used only in the vetting of the K1 bracket and in Born-Haber cross-checks, never mixed with conventional formation values in one row', unit: J mol^-1, sign: negative, interval: '(-oo, 0)', domain: stability, regimes: [R-cell], kind: input}
  - {id: m_svc, short: 'K1 tier-2 margin', latex: 'm_\mathrm{svc}', meaning: 'potential-reading uncertainty of a tier-2 service-limit record', unit: V, sign: non-negative, interval: '[0, oo)', domain: thresholds, regimes: [R-cell], kind: threshold}

  # ----- insulating-film limitation (C4 item 18, R-cell)
  - {id: d_film, short: 'film thickness', latex: 'd', meaning: thickness of the interfacial mineral film, unit: m, sign: positive, interval: '(0, oo)', domain: film, regimes: [R-cell], kind: input}
  - {id: rho_e, short: 'film electronic resistivity', latex: '\rho_\mathrm{e}', meaning: electronic resistivity of the film phase, unit: Ohm m, sign: positive, interval: '(0, oo)', domain: film, regimes: [R-cell], kind: input}
  - {id: R_A, short: 'area-specific film resistance', latex: 'R_A', meaning: area-specific electronic resistance of the film, unit: Ohm m^2, sign: positive, interval: '(0, oo)', domain: film, regimes: [R-cell], kind: derived}
  - {id: R_A_max, short: 'admissible area-specific resistance (input)', latex: 'R_{A,\max}', meaning: largest admissible area-specific resistance of the collector contact (an input of the registration, not a result), unit: Ohm m^2, sign: positive, interval: '(0, oo)', domain: film, regimes: [R-cell], kind: input}
  - {id: phi_B, short: 'tunnelling barrier height', latex: '\phi_\mathrm{B}', meaning: effective tunnelling barrier height of the film for electrons, unit: J, sign: positive, interval: '(0, oo)', domain: film, regimes: [R-cell], kind: input}
  - {id: kappa, short: 'tunnelling decay constant', latex: '\kappa', meaning: 'decay constant of the electron wavefunction in the film, sqrt(2 m_e phi_B)/hbar', unit: m^-1, sign: positive, interval: '(0, oo)', domain: film, regimes: [R-cell], kind: derived}
  - {id: j_0, short: 'tunnelling prefactor current density', latex: 'j_0', meaning: 'prefactor current density of the tunnelling law (zero-thickness extrapolation)', unit: A m^-2, sign: positive, interval: '(0, oo)', domain: film, regimes: [R-cell], kind: input}
  - {id: j_req, short: 'required current density (input)', latex: 'j_\mathrm{req}', meaning: current density the collector contact must pass (an input), unit: A m^-2, sign: positive, interval: '(0, oo)', domain: film, regimes: [R-cell], kind: input}
  - {id: d_max_tun, short: 'thickness bound, direct tunnelling', latex: 'd_\mathrm{max}^\mathrm{tun}', meaning: largest film thickness that still passes j_req by direct tunnelling, unit: m, sign: 'positive when j_0 > j_req', interval: '(-oo, oo)', domain: film, regimes: [R-cell], kind: derived}
  - {id: d_max, short: 'admissible film thickness', latex: 'd_\mathrm{max}', meaning: 'admissible film thickness, the larger of the ohmic and tunnelling bounds', unit: m, sign: positive, interval: '(0, oo)', domain: film, regimes: [R-cell], kind: derived}
  - {id: d_max_ohm, short: 'thickness bound, ohmic limit', latex: 'd_\mathrm{max}^\mathrm{ohm}', meaning: largest film thickness compatible with R_A_max in the ohmic (bulk conduction) limit, unit: m, sign: positive, interval: '(0, oo)', domain: film, regimes: [R-cell], kind: derived}

  # ----- registration constants of theory/thresholds.md (values from lit/params.yaml; none typed here)
  - {id: p_cred, short: 'credible level of the decision rule', latex: 'p', meaning: 'credible level: a side of a threshold decides a link when it holds at least this fraction of the prior-weighted mass', unit: '1', sign: 'in (1/2, 1)', interval: '(0, 1)', domain: thresholds, regimes: [both], kind: threshold}
  - {id: p_deg, short: 'least mass shift that counts as degradation', latex: 'p_\mathrm{deg}', meaning: 'smallest increase of the falsified-side mass of a link that counts as degradation in the deletion test', unit: '1', sign: 'in (0, 1)', interval: '(0, 1)', domain: thresholds, regimes: [both], kind: threshold}
  - {id: m_W, short: 'C1 margin on the wet work of adhesion', latex: 'm_W', meaning: 'systematic-error margin on W_adh_wet not represented in its prior (method error of the wet adhesion free energy per area)', unit: J m^-2, sign: non-negative, interval: '[0, oo)', domain: thresholds, regimes: [R-slurry], kind: threshold}
  - {id: m_seq, short: 'C2 margin on the Ca2+ transfer free energy', latex: 'm_\mathrm{seq}', meaning: 'systematic-error margin on Delta_G_seq not represented in its prior (method error of a Ca2+ transfer free energy)', unit: J mol^-1, sign: non-negative, interval: '[0, oo)', domain: thresholds, regimes: [R-slurry], kind: threshold}
  - {id: m_cos, short: 'C3 margin on cos theta', latex: 'm_{\cos}', meaning: 'margin on cos(theta) at the wetting edge: the template must prefer the nucleus to the liquid by at least m_cos gamma_nl', unit: '1', sign: 'in [0, 1)', interval: '[0, 1)', domain: thresholds, regimes: [R-slurry], kind: threshold}
  - {id: m_S, short: 'C4 margin on the spreading coefficient', latex: 'm_S', meaning: 'systematic-error margin on S_spread not represented in the interfacial-energy priors', unit: J m^-2, sign: non-negative, interval: '[0, oo)', domain: thresholds, regimes: [R-slurry], kind: threshold}
  - {id: e_form, short: 'expected error of a computed formation energy', latex: 'e_\mathrm{f}', meaning: 'expected error of a computed formation energy per atom, from the database benchmark against experiment', unit: J mol^-1, sign: positive, interval: '(0, oo)', domain: thresholds, regimes: [both], kind: threshold}
  - {id: N_atoms, short: 'atoms per formula unit', latex: 'n_\mathrm{at}', meaning: number of atoms per formula unit of the screened phase, unit: '1', sign: positive, interval: '(0, oo)', domain: thresholds, regimes: [both], kind: count}
  - {id: N_unc, short: 'uncancelled atoms (DFT)', latex: 'n_\mathrm{unc}', meaning: 'number of atoms, per formula unit of the reacting phase, whose computed formation energy does not cancel between the two sides of a window reaction (it sets the DFT window margin m_E = n_unc e_f / (Delta_n F); cp3b A1)', unit: '1', sign: positive, interval: '(0, oo)', domain: thresholds, regimes: [R-cell], kind: count}
  - {id: Delta_ACC, short: 'ACC offset above calcite', latex: '\Delta_\mathrm{ACC}', meaning: 'free energy of ACC above calcite per CaCO3 formula unit (fetched thermochemistry); zero for the calcite framing', unit: J mol^-1, sign: non-negative, interval: '[0, oo)', domain: thresholds, regimes: [R-slurry], kind: input}
  - {id: tol_hull, short: 'C5 hull tolerance', latex: '\tau_\mathrm{hull}', meaning: 'tolerance on the energy above the aqueous Pourbaix hull per non-O, non-H atom: the expected error of the computed formation energy of the phase, n_at e_f / n_M', unit: J mol^-1, sign: positive, interval: '(0, oo)', domain: thresholds, regimes: [R-slurry], kind: threshold}
  - {id: m_E, short: 'C5 margin on the window limits', latex: 'm_E', meaning: 'margin on the Li-referenced window limits: the expected error of a computed reaction energy per transferred electron', unit: V, sign: non-negative, interval: '[0, oo)', domain: thresholds, regimes: [R-cell], kind: threshold}
  - {id: m_expt, short: 'C5 experimental margin on the window limits', latex: 'm_\mathrm{expt}', meaning: 'experimental uncertainty budget of the all-experimental route per transferred electron: tabulated uncertainties of reactants and products plus a bound on the neglected solid entropy of the sink salt from analog entropies (cp3 R2)', unit: V, sign: non-negative, interval: '[0, oo)', domain: thresholds, regimes: [R-cell], kind: threshold}
  - {id: E_cell_min, short: 'lower end of the R-cell potential range', latex: 'E_\mathrm{cell}^{\min}', meaning: 'lowest collector potential vs Li+/Li of the registered R-cell range', unit: V, sign: real, interval: '(-oo, oo)', domain: thresholds, regimes: [R-cell], kind: input}
  - {id: E_cell_max, short: 'upper end of the R-cell potential range', latex: 'E_\mathrm{cell}^{\max}', meaning: 'highest collector potential vs Li+/Li of the registered R-cell range', unit: V, sign: real, interval: '(-oo, oo)', domain: thresholds, regimes: [R-cell], kind: input}
