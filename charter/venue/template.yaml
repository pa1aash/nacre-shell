licence_finding:
  where_found: rsc.bst lines 11-13 and 1473-1490 (header and trailer comments); main.tex line 3 (copyright line); no licence statement found on the source page
  name_or_summary: 'rsc.bst: LPPL 1.3c or later, author Joseph Wright (2006-2009), status maintained by that author, not RSC. main.tex and head_foot images: RSC copyright 2016 line only, no licence grant
    found.'
  permits_redistribution: unknown
  basis: Explicit grant exists only for rsc.bst (LPPL). The template tex, logos, header images and PDFs carry only an RSC copyright line; neither archive nor page gives redistribution terms.
decision: local-only
decision_basis: Redistribution of the archive as a whole is not explicitly granted (only rsc.bst has an LPPL grant), so ambiguous means local-only. paper/.gitignore lists rsc_template/; only this template.yaml
  is committed.
