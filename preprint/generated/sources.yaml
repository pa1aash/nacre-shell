# Number sources for the P0 preprint (rule R5: every number in the paper is a generated macro).
# `nacre preprint macros` reads this file and writes numbers.tex beside it.
#
# Schema
#   schemas.<id>        where each source family's shape comes from, and its status.
#   macros.<Name>       Name is letters only and starts with Num plus a capital letter.
#     source            source file, repository-relative: a result JSON, a YAML configuration or
#                       authority copy, or a text record (Markdown).
#     key               '/'-separated key path into a JSON or YAML source; list items by integer index.
#     pattern           for a text source (or a string reached by key): a regular expression with one
#                       group; `section` limits it to the lines under one Markdown heading, and
#                       `reduce` (first, min, max, count) picks one value when it matches several times.
#     format            a Python format spec (e.g. .2f, .3g, g, d), sci:N (N decimals times a power of
#                       ten), power (a registered 'a**b' written a^{b}), text (a string, escaped) or
#                       date:<strftime> (an ISO date). text and date render as text, not math.
#     unit              LaTeX math appended after a thin space; empty or absent for dimensionless.
#     mock              true while `source` is a stand-in under mock/; renders only in draft mode.
#     real_source       the file that replaces the mock, with its owning lane.
#     figure / claim    where the number is used (planning aid; checked against claims.yaml by tests).
#
# Regime: the result macros below are for R-slurry; R-cell macros are added when the screen covers
# it. The method conventions (P0-W8.3) are read from the registered authority copies and records,
# not from results: they are numbers the Methods states, fixed before any production output.
schemas:
  screen:
    shape: configs/preprint/results_schema.json, schema v1
    status: pushed by p0-w4 at cc50fc0 (blob e81bcb3661ce0fefe7a0965dd05ef66e330c6428), read with git show
    assumed: the result path results/preprint/screen/summary.json and the quantity and parameter names
  precision:
    shape: assumed (schema_version assumed-1)
    status: not pushed; reconcile with p0-w4 on Day 2
  pourbaix:
    shape: assumed (schema_version assumed-1)
    status: not pushed; reconcile with p0-w5 on Day 2
  anchor:
    shape: assumed (schema_version assumed-1)
    status: not pushed; reconcile with p0-w5 on Day 2
  retrodiction:
    shape: assumed (schema_version assumed-1)
    status: not pushed; reconcile with p0-w2 on Day 2
  params:
    shape: assumed (schema_version assumed-1)
    status: not pushed; reconcile with p0-w1 on Day 2

