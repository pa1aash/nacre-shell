# ChemRxiv submission metadata for the P0 preprint (lane p0-w2, sessions P0-W2.4a and PH-W2.2).
#
# What Palaash enters in the ChemRxiv form at C2, gathered in one place and traced to its source.
# Checked by `uv run nacre retro package-check` (src/nacre/retro/package.py).
#
# Conventions
#   - A value that starts with "TBD" is a placeholder: who supplies it and when follow in brackets.
#     The checker lists every placeholder; `--release` fails while any remains.
#   - `source` lists requirement ids: T* and V-1 from ops/policy/p0/index.yaml (cited by
#     ops/policy/p0/requirements.md), P* from preprint/package/fetch_index.yaml. Every one of them is
#     a 2025 or 2026 Wayback capture, not the live page, so each sourced item carries
#     `recheck_live: true` and is listed in preprint/package/requirements_recheck.md (ruling B8).
#   - No result numbers and no email addresses. Numbers reach the paper only through generated
#     macros; this file names macros, it does not hold their values. The co-author email addresses
#     the form needs are in the local-only contact list, .local/p0/authors_contact.yaml.
#   - The abstract is lane W8's (preprint/paper/sections/abstract.tex). This file points to it.
schema: chemrxiv-package/v1
status: final-structure

title:
  working: Thermodynamic screening of nacre- and bone-inspired barriers for aluminium current collectors in
    fluorine-free lithium-ion cells
  working_source: ops/tracks/p0.yaml meta.title_working (rendered as \nacreTitle in preprint/generated/front.tex)
  working_source_note: confirmed equal to ops/tracks/p0.yaml meta.title_working at PH-W2.2 (this lane does not
    edit that file)
  final: TBD (final title decided at cp6; the working title above is not final)

content_type:
