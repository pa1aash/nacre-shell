data_and_code_availability:
  renders_in: preprint/paper/sections/declarations.tex, section "Data and code availability"
  repository: \nacreRepoURL (filled at C3)
  archive_doi: \nacreZenodoDOI (Zenodo DOI, filled at C3 at release)
  si_doi: \nacreSIDOI (filled at C3)
  code: no separate code policy is stated; code is linked through the repository and archive above
  rule: a Data Availability Statement in the content; FAIR deposit encouraged
  source: [T2-1, T1-1, T1-2]
  recheck_live: true
  materials_project:
    source_file: results/preprint/pourbaix/cache/attribution_for_paper.md
    read_from: origin/preprint/p0-w5 at 401ef6e (draft by P0-W5.3)
    references: [doi:10.1063/1.4812323, doi:10.1103/PhysRevB.85.235438]
    # The draft below is the lane W5 text with one change: its database version is replaced by the token
    # {mp_database_version}. The W5 file says the version is an input for a macro, not text to paste.
    statement_draft: >-
      The Materials Project entries used in this work (database version {mp_database_version}) are
      available from the Materials Project (https://materialsproject.org) under CC BY 4.0 [Jain2013];
      the cached copy used for every calculation, its manifest with per-file SHA-256 hashes, and the
      list of changes made to it are in the repository at `results/preprint/pourbaix/cache/` (see
      `NOTICE.md` there). The aqueous ion reference data are from the MPContribs project "Aqueous Ion
      Reference Data" (CC BY 4.0, owned by its contributors). No Materials Project endorsement is
      implied.
    macros_needed:
      mp_database_version: TBD (W8, a generated macro from the cache manifest)
    c3_revision: decision D23 moves the raw cache to a Zenodo data record at C3, with git keeping the
      manifest, hashes and rebuild script; the "cached copy ... in the repository" clause is revised then.
    must_survive_editing:
    - credit to the Materials Project and Jain et al. 2013, with the database version
    - the licence named and linked (CC BY 4.0)
    - the changes stated (MP2020 corrections, aqueous adjustments, offline Pourbaix rebuild, ACC offset,
      experimental-route corrections)
    - no endorsement implied
    - the ion reference project credited as contributed data owned by its contributors
    - GNoME (CC BY-NC 4.0) data excluded

