# Claim ledger of the P0 preprint. Every claim the paper makes has an entry here before its
# sentence is written; a sentence without an entry does not go in. Seeded in P0-W8.1 from the
# one claim of the paper:
#
#   The chain from adhesion in water through Ca2+ sequestration and nucleation to film
#   stability can be written consistently; with literature-bounded inputs a small set of
#   quantities governs the outcome; the accuracy each needs is stated; the retrodiction is
#   reported as it comes out; the Pourbaix results are a thermodynamic proxy.
#
# Schema (each entry of `claims`)
#   id           stable id, CL-<letter><two digits>; the letter follows the type
#                (R relation, B bound, G governing, P precision, X proxy, T retrodiction,
#                O outlook, L limitation, N does-not-claim, K background, V novelty,
#                E contrary evidence, M method).
#   statement    draft wording, no numbers (numbers are macros named in `evidence`).
#   section      the manuscript section that carries it (file stem in preprint/paper/sections).
#   type         physical relation | parameter bound | governing parameter | required precision |
#                proxy result | retrodiction outcome | outlook | limitation | background |
#                novelty | contrary evidence | method. K, V and E are the Introduction's
#                literature statements (added in P0-W8.2); method (letter M) is a rule or setting
#                the Methods states (added in P0-W8.3).
#   polarity     claims | does-not-claim.
#   evidence     list of {kind, ref}; kind is macro (preprint/generated/sources.yaml), figure
#                (Fig 1..8), table (Table 1..3), derivation (an SI section label), reference
#                (a refs.bib key or a pending pointer), claim (another id), row (a row_id of
#                lit/evidence_table.csv), doi (a DOI in preprint/paper/refs.bib that is also
#                recorded in lit/evidence_table.csv, lit/novelty.md or lit/contrary.md),
#                dossier (<file>#<anchor>: a lit/ file and a string that occurs in it) or
#                record (<path>#<anchor>: any tracked repository file, such as a theory
#                authority, a configuration, a lane record or a ruling, and a string in it).
#   checkpoint   the track checkpoint the claim depends on: cp1..cp5, or none.
#   supplier     the lane that supplies the evidence.
#   scope_check  clean (lint-scope finds nothing) or allowlisted (an explicit does-not-claim
#                sentence in preprint/paper/lint/scope_allowlist.txt). Checked by tests.
#   status       planned | drafted | verified | withdrawn.
#   notes        optional.
claims:
  # --- physical relations: the chain, in energetic order ---
  - id: CL-R01
    statement: >-
      Adhesion of the template to the hydroxylated aluminium oxide is set by the wet work of
      adhesion, the Dupre balance of the oxide-water, template-water and oxide-template
      interfacial free energies, because in the slurry the template never meets a dry oxide.
    section: model
    type: physical relation
    polarity: claims
    evidence:
      - {kind: derivation, ref: si:derivation}
      - {kind: figure, ref: Fig 2a}
      - {kind: macro, ref: NumWadhWetMedian}
    checkpoint: cp2
    supplier: p0-w3
    scope_check: clean
    status: drafted
  - id: CL-R02
    statement: >-
      Ca2+ binding by the template is a binding descriptor: the transfer free energy of the
      hydrated ion to a site, built as a thermodynamic cycle, sets the occupancy and the Ca2+
      excess at the template-liquid interface; at equilibrium the bound ion carries the bulk
      electrochemical potential, so binding does not change the driving force and enters the
      barrier only through the template-liquid energy, in the Gibbs-Langmuir approximation for
      a neutral solute, while any Ca2+ at the template-crystal contact belongs to the
      template-nucleus energy.
    section: model
    type: physical relation
    polarity: claims
    evidence:
      - {kind: derivation, ref: si:derivation}
      - {kind: figure, ref: Fig 2b}
      - {kind: figure, ref: Fig 3}
      - {kind: macro, ref: NumDGseqMedian}
    checkpoint: cp2
    supplier: p0-w3
    scope_check: clean
    status: drafted
    notes: >-
      Rewritten in P0-W8.3 to the cp2 ruling (fixes F1 to F3, decision D14) and cp3 R4 (C2 is
      a descriptor and does not gate). No entry of this ledger shows binding or enrichment
      raising the supersaturation; the enrichment factor is a concentration ratio, reported
      only as a labelled non-gating sensitivity. The local-supersaturation macro of P0-W8.1
      is withdrawn from sources.yaml for the same reason. Derivation sections 3, 4 and 7.
  - id: CL-R03
    statement: >-
      Heterogeneous nucleation on the templated surface follows classical nucleation theory
      with a spherical-cap shape factor of the Young contact angle, at the bulk
      supersaturation of the regime state; the template acts only through the
      template-liquid and template-nucleus energies, each template input entering once, so
      binding alone raises the barrier and the template lowers it only if the
      template-nucleus energy falls by more.
    section: model
    type: physical relation
    polarity: claims
    evidence:
      - {kind: derivation, ref: si:derivation}
      - {kind: figure, ref: Fig 2c}
      - {kind: macro, ref: NumThetaMedian}
      - {kind: macro, ref: NumFthetaMedian}
      - {kind: macro, ref: NumDGhetMedian}
    checkpoint: cp2
    supplier: p0-w3
    scope_check: clean
    status: drafted
    notes: >-
      P0-W8.3, to the cp2 ruling (SF2 reversed against contract v1) and the C3 rule of
      theory/thresholds.md (single edge at the hemisphere, absolute-barrier criterion).
  - id: CL-R04
    statement: >-
      Film stability is a thermodynamic condition in each regime: in the slurry, dissolution of
      calcium carbonate is decided by the bulk supersaturation, the quantity nucleation uses,
      with the aqueous Pourbaix construction as the competing-phase and aluminium-oxide
      baseline; in the cell, by the anodic oxidation of the carbonate referenced to Li+/Li,
      with the all-experimental thermochemical route governing wherever it exists and the
      oxidation sink fixed by the electrolyte.
    section: model
    type: physical relation
    polarity: claims
    evidence:
      - {kind: derivation, ref: si:derivation}
    checkpoint: cp3
    supplier: p0-w3
    scope_check: clean
    status: drafted
    notes: >-
      P0-W8.3, to cp3 R1 (dissolution by Omega_bulk) and R2 (experimental route governs; DFT
      schemes are comparators). Fig 2d shows coalescence, not stability, so it is no longer
      evidence here.
  - id: CL-R05
    statement: >-
      The links can be written as one consistent chain in which every template-dependent input
      enters exactly once, in one interfacial energy, so no term is counted twice between
      adhesion, Ca2+ binding and nucleation.
    section: model
    type: physical relation
    polarity: claims
    evidence:
      - {kind: derivation, ref: si:no-double-counting}
      - {kind: figure, ref: Fig 1}
      - {kind: figure, ref: Fig 3}
    checkpoint: cp2
    supplier: p0-w3
    scope_check: clean
    status: drafted
