# Claim ledger of the P0 preprint, rewritten at PH-W8.1 (2026-10-20) for the redirected paper: a
# thermodynamic screen of bone-inspired calcium phosphate barriers for aluminium current collectors in
# fluorine-free lithium-ion cells (ops/tracks/redirect_plan.md). Every claim the paper makes has an
# entry here before its sentence is written; a sentence without an entry does not go in.
#
# Two blocks. The first holds the claims of the redirected paper (origin: redirect). The second holds
# the carbonate-era claims (origin: carbonate control (frozen)), kept because their text is kept for
# adaptation and because number macros point at them; they are reworded, merged or withdrawn at
# PH-W8.2 and PH-W8.3. No result is stated by any entry: claims that depend on unmeasured inputs carry
# `conditional: true` and a `depends_on` list, and the paper states them as conditional.
#
# Schema (each entry of `claims`)
#   id           stable id, CL-<letter><two digits>; the letter follows the type
#                (R relation, B bound, G governing, P precision, X proxy, T retrodiction,
#                O outlook, L limitation, N does-not-claim, K background, V novelty,
#                E contrary evidence, M method, D design rule, S screen result, Q prediction).
#   statement    draft wording, no numbers (numbers are macros named in `evidence` or written \NumName).
#                Identifiers (K1 to K4, route names, chemical formulae, NS7) are not numbers.
#   section      the manuscript section that carries it (file stem in preprint/paper/sections).
#   type         physical relation | parameter bound | governing parameter | required precision |
#                proxy result | retrodiction outcome | outlook | limitation | background |
#                novelty | contrary evidence | method | design rule | screen result | prediction.
#   polarity     claims | does-not-claim.
#   origin       redirect | carbonate control (frozen).
#   stage        optional; slurry | cell | conversion: the STAGE of a result row (F4). Slurry-stage
#                phases meet the solubility, nucleation and thin-film conditions; cell-stage phases
#                meet the oxidation condition; a conversion row joins a precursor to its cell-stage
#                product. A claim never joins the oxidation condition of a condensed phase and the
#                other three conditions of an orthophosphate as one film.
#   frame        optional; A, B, C: the outcome frames in which the wording changes.
#   conditional  true when the claim depends on an input not yet measured; then `depends_on` lists it.
#   qualifiers   NS7 only: the four qualifiers that must all appear in the statement.
#   evidence     list of {kind, ref}; kind is macro (preprint/generated/sources.yaml), figure
#                (Fig 1..8 legacy, or a label such as fig:ladder), table (Table 1..3 legacy, or a label
#                such as tab:thermo), derivation (an SI section label), reference (a refs.bib key or a
#                `pending:` pointer to an input not yet delivered), claim (another id), row (a row_id
#                of lit/evidence_table.csv), doi (a DOI in preprint/paper/refs.bib that is also
#                recorded in lit/), dossier (<file>#<anchor> in lit/) or record (<path>#<anchor>: any
#                tracked repository file and a string that occurs in it).
#   checkpoint   the track checkpoint the claim depends on: cp1..cp6, cp5r (results) or none.
#   supplier     the lane that supplies the evidence.
#   scope_check  clean (lint-scope finds nothing) or allowlisted (an explicit does-not-claim
#                sentence in preprint/paper/lint/scope_allowlist.txt). Checked by tests.
#   status       planned | drafted | verified | withdrawn.
#   notes        optional.
