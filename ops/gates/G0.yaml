# Layer A criteria for gate G0 (charter, claim register, regimes, branch policy).
# Refined in session S02: adds the reconciliation, taxonomy and renderer files and the
# charter test suite as an explicit criterion.
gate: G0
# H sign-off (ops/gates/G0.md): Palaash Gang only. The UIUC corresponding-author co-sign moves to G2 of the
# main study (audit fix F6, 2026-10-16).
criteria:
  - type: files_exist
    paths:
      - charter/claim_register.yaml
      - charter/numbering.md
      - charter/regimes.yaml
      - charter/deletion_register.yaml
      - charter/scope_guard.md
      - charter/branches.md
      - charter/credit.yaml
      - charter/credit_taxonomy.md
      - charter/packet.py
      - tests/charter/test_charter.py
  - type: tests_pass
    args: ["tests/charter"]
  - type: tests_pass
