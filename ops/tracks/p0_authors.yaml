# Author register for preprint track p0, in author order.
#
# Fields: given_name, family_name, affiliation, orcid, orcid_check, corresponding, credit_roles, status.
# An email address is kept only for the corresponding author, and only the institutional one. The full
# contact list for the ChemRxiv form is local-only (.local/p0/authors_contact.yaml) and is never committed.
# `status: YOU-confirm` means the operator confirms the entry; ORCID candidates are listed for the operator
# to choose from and none is chosen here.
#
# ORCID checks (P0-I1, 2026-10-16, headless via pub.orcid.org v3.0): ISO 7064 MOD 11-2 checksum, and the record
# name (GET /v3.0/<id>/person) against the listed name.
#
# YOU: CRediT roles for all six authors, and Braun's consent, before the Day 3 co-author read.
# Author order ends with Braun (D91). His entry stays status YOU-confirm until he consents.
