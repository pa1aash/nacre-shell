- {id: p0-w5, branch: preprint/p0-w5, worktree: ~/Desktop/nacre-shell-p-w5, model: Opus; Sonnet for dispatch
    (P0-W5.3)}
- {id: p0-w6, branch: preprint/p0-w6, worktree: ~/Desktop/nacre-shell-p-w6, model: Sonnet for execution;
    Opus for design}
- {id: p0-w7, branch: preprint/p0-w7, worktree: ~/Desktop/nacre-shell-p-w7, model: Opus for design; Sonnet
    for renders}
