rules:
- {id: R-dry, date: '2026-10-16', text: 'Dry runs on mock or draft priors before cp3 are allowed, but
    their outputs are never reported in the manuscript, the SI or any packet as results.'}
- {id: R-thr, date: '2026-10-16', text: 'theory/thresholds.md (W3, set at cp2) is the threshold authority.
    configs/preprint/thresholds.yaml (W4) is its machine-readable copy, and W4 checks the two equal. After
    tag p0-cp3, lit/params.yaml, configs/preprint/thresholds.yaml and theory/thresholds.md change only
    through a dated entry in ops/tracks/p0_deviations.md (enforced by nacre track check).'}
decisions:
- {id: B1, date: '2026-10-16', decision: 'There is no master integration session I1. At C3 preprint/p0
    merges into main with --no-ff, and ops/ records that this merge satisfied the wave-1 integration;
    if main moves first, main is merged into preprint/p0 beforehand. Tag g0 is made only after the audit
    PASS and Palaash Gang sign-off.', reason: The track is a companion preprint on its own base; a second
    integration pass would duplicate the C3 merge and could tag g0 before the sign-off.}
- {id: B2, date: '2026-10-16', decision: 'Ownership is as updated in ops/lanes.yaml after day 1 (the integrator
    owns .gitignore, tests/charter, retrieval, the bib command; lit/instrument_gaps.csv belongs to W1).
    Each worker lane keeps its own dependencies in its group under dependency-groups, enforced by the
    pre-commit hook; shared dependencies and the lock stay with the integrator.', reason: Day 1 produced
    conflicts in pyproject.toml and uv.lock on every merge; per-lane groups make a merge a union and keep
    the lock a single-writer file.}
- {id: B3, date: '2026-10-16', decision: 'Sessions are gated by checkpoints: W2.3, W5.3 and W8.3 need
    cp1 and cp2; W3.4 needs cp2; W4.3 needs cp1, cp2 and cp3; W4.4 and W8.4 need cp3; W1.5, W2.5 and W8.5
    need cp4; post items C1 and C2 need cp5. After cp3 the parameter table and the thresholds are frozen
    (see rule R-thr).', reason: 'Work that consumes a ruling must not start before the ruling, and a late
    change to an input would silently invalidate results computed from it.'}
- {id: B4, date: '2026-10-16', decision: 'AI disclosure is one Acknowledgements sentence taken from the
    local-only include. It names the tool, says it was used for code, analysis scripts, drafting and editing,
    and states that the authors verified the content and are accountable for it; there is no separate
    section. For the main study, the venue disclosure rules override the repository rule against naming
    tools for the manuscript, cover letter and SI only; prompts, if a venue requires them, go in the SI
    or a Zenodo record and never in git.', reason: 'Venue and preprint policies ask for a disclosure and
    for authorial accountability; the repository rule still keeps tool names out of code, history and
    data.'}
- {id: B5, date: '2026-10-16', decision: 'S31 is not run in this track. P0-W5.3 builds a P0-scoped dispatch
    under jobs/preprint/: a git-archive sync of a pinned commit over SSH, a tmux launch with a heartbeat,
    hash-verified collection, and one ledger line in jobs/ledger/p0-w5.jsonl in the S31 format. Missing
    chemistry packages are installed pinned at job start and logged; no image is rebuilt.', reason: The
    full dispatch tooling belongs to the main study schedule; P0 needs one pod job and must not wait for
    it or trigger an image rebuild.}
- {id: B6, date: '2026-10-16', decision: 'Design sessions run on Opus and execution sessions on Sonnet,
    set per session in the ledger.', reason: 'Design needs the stronger model; routine execution does
    not, and the machines are memory-limited.'}
- {id: B7, date: '2026-10-16', decision: 'CI: tests and the attribution scan run on every preprint/**
    push and only image builds ignore those pushes; lane branches preprint/p0-* sync without --locked
    while preprint/p0 and main keep --locked; the LaTeX workflow builds preprint/paper and theory/, checking
    the four template packages and fetching the template by pinned URL plus sha256.', reason: Lanes legitimately
    run ahead of the lock; the integrator branch is where the lock must hold exactly.}
- {id: B8, date: '2026-10-16', decision: Palaash re-checks the ChemRxiv and RSC policy pages live before
    C2 (day 6 input)., reason: Policy pages change; the day 0 fetch is a snapshot and a submission needs
    the current text.}
- {id: D1, date: '2026-10-16', decision: W1 dedupes numeric evidence rows on doi + locator + quantity
    + symbol + value., reason: One table often prints several values of one quantity; a coarser key would
    drop real rows.}
- {id: D2, date: '2026-10-16', decision: 'The preprint scope linter allows the bare word "battery" for
    setting. Device, performance, rate, capacity and cycle-life wording stays banned.', reason: 'The study
    is motivated by lithium-ion cathodes, so the setting word must be usable; claims about function must
    not be.'}
- {id: D3, date: '2026-10-16', decision: lit/instrument_gaps.csv belongs to p0-w1., reason: W1 produces
    and maintains the retrieval gap log.}
- {id: D4, date: '2026-10-16', decision: 'W4 owns configs/preprint/results_schema.json. On day 2 W4 adds
    a deterministic section for the C5 outputs (Pourbaix domains, decomposition energies, Li-referenced
    window limits) with a per-limit status field that includes "undetermined"; W5 and W6 conform to it.
    Figure 7 shows R-slurry as a (pH, E) diagram and R-cell as a one-dimensional window.', reason: Three
    lanes had assumed different shapes for the same data; one owner removes the guesswork.}
- {id: D5, date: '2026-10-16', decision: 'The Al colour stays as pushed (#D7C1A9). The hero scene charge
    is balanced with dissolved carbonate ions, not generic counter-ions, and its caption states that the
    scene is illustrative.', reason: 'The adjusted colour passed the colour-difference check; the carbonate
    balance matches the chemistry the paper discusses, and an illustration must say it is one.'}
- {id: D6, date: '2026-10-16', decision: 'The lit/ corpus scope scan exempts lit/novelty.md and lit/contrary.md
    because they quote forbidden claims in order to flag them. The test stays owned by p0-w1, and the
    preprint scope linter is the gate for published text.', reason: 'Merge of P0-W2.1 failed the W1 corpus
    test on three quoted phrases; the dossier files must quote to do their job, and the linter still checks
    any sentence taken from them.'}
- {id: D7, date: '2026-10-16', decision: 'Test module basenames are unique across tests/, enforced by
    nacre verify.', reason: A W5 and a W7 test module shared a basename and pytest could not collect both
    once merged; each lane passed alone.}
- {id: D8, date: '2026-10-16', decision: 'The integrator may make mechanical cross-lane fixes inside merge
    commits (renames, test tolerances or hypothesis settings, regenerating generated files), each recorded
    as a decision. Anything that changes behaviour or science goes back to the owning lane.', reason: 'Four
    day 1 merges each failed on a defect that no single lane could see; a round trip per mechanical defect
    costs a day, a behavioural change without its owner risks the science.'}
- {id: D9, date: '2026-10-16', decision: 'tests/physics/test_physics_sign_flip.py::test_sf1_deck_form_lowers_the_barrier_on_the_wetting_side
    suppresses the filter_too_much health check (applied in the merge commit of the P0-W8.1 fix-up).',
  reason: The strategy filters heavily and the health check failed on seeds 41 and 73 (not on seeds 1
    to 10); W4.2 replaces the strategy with a direct generator of the valid region.}
- {id: D10, date: '2026-10-17', decision: 'The seed-19 failure of test_sf1 (cos_theta outside [-1, 1]) is sent to W4.2 as a behaviour fix. The derandomize pin proposed for the integrator was not applied: the test module is W4-owned and the lane-ownership hook rejects it outside a merge of a lane head.', reason: 'The strategy admits inputs where the deck form leaves its domain, so it is a test-design defect in the owning lane; the flake (about 1 in 70 default-random runs) stays until W4.2 and is recorded in N9.'}
lane_notes:
- id: N1
  date: '2026-10-16'
  day: 2
  lanes: [p0-w3, p0-w4]
  note: C4 candidates (a) the small-theta bound and (b) S_spread >= 0 carry the same information through
    Young; treat them as one criterion at different strictness. The coalescence condition is the independent
    one.
- id: N2
  date: '2026-10-16'
  day: 2
  lanes: [p0-w4]
  note: 'Independent draws of the three interfacial energies give |cos theta| > 1. Clip to theta = 0 (f
    = 0) or 180 degrees (f = 1) and report the boundary mass. The energies are correlated: test the sensitivity
    of the screen to that, and use a Sobol variant that handles correlated inputs.'
- id: N3
  date: '2026-10-16'
  day: 2
  lanes: [p0-w3]
  note: The direction in which lowering gamma_nuc,liq moves f holds only when gamma_sub,liq - gamma_sub,nuc
    > 0; unit-test both signs.
- id: N4
  date: '2026-10-16'
  day: 2
  lanes: [p0-w2]
  note: Add to the contrary dossier whether chitosan, generally soluble only in mildly acidic media, exists
    as dissolved chains in a strongly alkaline slurry. The Introduction must not assume it.
- id: N5
  date: '2026-10-16'
  day: 2
  lanes: [p0-w8]
  note: 'Do not reuse the hypothesis wording "engineered out", or the claim that thresholds were set before
    the calculation. Add one sentence in Methods or Discussion: an earlier rough estimate under the calcite
    framing was available when the project was designed, and the primary framing here is chosen on literature
    grounds.'
- id: N6
  date: '2026-10-16'
  day: 2
  lanes: [p0-w5]
  note: Justify the anchor functional and basis from published benchmarks for hydrated Ca2+; do not copy
    the main study periodic-DFT choice.
- id: N7
  date: '2026-10-16'
  day: 2
  lanes: [p0-w1]
  note: Keep the D6 exemption for lit/novelty.md and lit/contrary.md in tests/lit/test_corpus.py.
- id: N8
  date: '2026-10-16'
  day: 2
  lanes: [p0-w8]
  note: Sentences drawn from lit/novelty.md or lit/contrary.md must pass lint-scope.
- id: N9
  date: '2026-10-16'
  day: 2
  lanes: [p0-w4]
  note: 'Replace the filtering strategy of test_sf1 with a direct generator of the region where the deck
    form applies, then remove the health-check suppression (D9). Review the other hypothesis tests for
    heavy filtering. Seed 19 (--hypothesis-seed=19) still fails with ValueError "cos_theta must lie in
    [-1.0, 1.0]" for excess=0.5, sn0=0.698451471401042, nl=1.0, dw=0.5: the strategy admits inputs where
    the deck form leaves its domain. This is not a health-check problem and was not changed here. W4.2 must (a) generate inputs inside the domain or clip cos theta to [-1, 1] and report the boundary mass (N2), (b) handle the seed-19 case (excess=0.5, sn0=0.698, nl=1.0, dw=0.5) explicitly with a regression test, and (c) remove the health-check suppression (D9); if W4.2 adds a derandomize pin as an interim measure it removes that too (D10).'
