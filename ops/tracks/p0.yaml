# Day ledger of preprint track p0. Read and written by `nacre track` (src/nacre/cli/commands/track.py).
#
# Schema
#   meta          title_working, venue, base (the integrator branch).
#   lanes         id, branch, worktree, model (default model for the lane); integrator: true marks p0-int.
#   days          day, status (pending | open | closed), opened_utc, closed_utc, carried (sessions of the
#                 previous day carried into this one unfinished) and sessions.
#   sessions      id, lane, day, model, master_trace (master-plan session it traces, or none) and
#                 requires (checkpoints that must be satisfied before it starts).
#   checkpoints   id, day, title, packet, satisfied_by (tags; any one satisfies the checkpoint).
#   post          operator items after day 5.
#   inputs        external inputs and their state.
#
# Exactly one day is open. `nacre track open-day <n>` (integrator, on preprint/p0) closes day n-1 and
# opens day n with the commit "ops(p0): open day <n>".
meta: {title_working: 'Thermodynamic screening of a biomimetic calcium-carbonate barrier on aluminium
    current collectors: governing parameters and the precision required for first-principles validation',
  venue: ChemRxiv, base: preprint/p0}
lanes:
- {id: p0-w1, branch: preprint/p0-w1, worktree: ~/Desktop/nacre-shell-p-w1, model: Opus}
