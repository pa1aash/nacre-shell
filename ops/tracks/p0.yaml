    scheme, solvated sink, falsification under every scheme); F6 the ACC edge equals the calcite test,
    the ACC margin is a labelled sensitivity; F7 IAP kept, drying-state bias stated, a_w reported; F8
    derivation 3 wording; F9 the kinetic coalescence thickness is h_coal. Conventions as now in theory/thresholds.md:
    p_cred = 0.9 with the sweep 0.6, 0.9, 0.99; p_deg = 1 - p_cred, registered as a rule; m_cos = 0 with
    sweeps 0.1 and 0.2; the Monte Carlo sizing rule (band-mass half-widths at most 0.01, top Sobol total-order
    half-widths at most 0.02, cap 2^20 base draws and 6 h, chunks of 2^14). C2 changes role: it enters
    C3 only through Delta_gamma_ads and is not a kill criterion. Charter text applied as cp2 A, B, D,
    E; section C is held for a ruling (cp3 packet, decision 4). Tag p0-cp2.', reason: 'Planning ruling
    of 2026-10-17 on the cp2 packet, recorded with the conventions it fixed.'}
