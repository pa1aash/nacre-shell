# DRAFT for P0-W5.3: the anchor production run on the CPU pod (>= 32 vCPU, >= 128 GB).
# Packages are installed pinned at job start and logged (ruling B5: no image rebuild). The
# chemistry stack mirrors the local protocol test: pyscf 2.14.0 with its Linux dispersion add-on,
# xtb 6.6.1 and CREST 2.12 from src/nacre/anchor/xtb_env.yaml via micromamba. P0-W5.3 replaces
# the command with the production driver once cp1 and cp2 are satisfied. Open item: xtb_env.yaml
# pins osx-arm64 build strings; W5.3 adds linux-64 builds of xtb 6.6.1 and CREST 2.12 before launch.
id: anchor-production
mock: false
command: >-
  export PATH="$JOBDIR/.mamba/envs/xtb/bin:$PATH" &&
  "$JOBDIR/.jobenv/bin/python" -m nacre.anchor.protocol_test run
outputs_dir: outputs
heartbeat_s: 30
stale_after_s: 600
launcher: tmux
# pins = the versions of the laptop environment that ran the protocol test (P0-W5.2)
packages: ["pyscf==2.14.0", "pyscf-dispersion==1.5.0", "pymatgen==2026.9.24", "pyyaml==6.0.3", "scipy==1.18.1",
           "numpy==2.5.4", "rdkit==2026.9.1", "ase==3.29.0", "mp-api==0.46.5"]
install_command: >-
  python3 -m venv .jobenv &&
  .jobenv/bin/python -m pip install --quiet --disable-pip-version-check {packages} &&
  .jobenv/bin/python -m pip install --quiet --no-deps -e src &&
  curl -Ls https://micro.mamba.pm/api/micromamba/linux-64/2.0.5 | tar -xj -C . bin/micromamba &&
  MAMBA_ROOT_PREFIX=.mamba ./bin/micromamba create -y -n xtb -f src/src/nacre/anchor/xtb_env.yaml
