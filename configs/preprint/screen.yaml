# Screen run configuration (P0-W4.2; cp3 registrations and design axes P0-W4.3a). Methodological settings of the Monte Carlo and the
# sensitivity analysis only: no prior and no threshold lives here (priors come from
# lit/params.yaml, thresholds from configs/preprint/thresholds.yaml, the copy of
# theory/thresholds.md). Written before any production output exists (rule R7); P0-W4.3
# runs the production screens with this file as committed.
propagation:
  draws_per_regime: 1048576     # 2^20 per registered state: the sizing rule's draw cap (thresholds, cp2)
  chunk: 16384                  # 2^14 rows per chunk, as the sizing rule registers; chunk x k floats
  seed: 20261017                # root seed; each regime and each chunk draws from its own child
  quantiles: [0.005, 0.025, 0.05, 0.1, 0.25, 0.5, 0.75, 0.9, 0.95, 0.975, 0.995]
sobol:                           # independent marginals (Task 4b)
  target_ci_half_width: 0.02    # thresholds sizing rule: top total-order half-widths <= 0.02 (P0-W4.3)
  target_scope: top_total       # the half-width target applies to the total-order indices of the top_k inputs per quantity
  top_k: 3
  confidence: 0.95
  pilot_base: 1024
  bootstrap: 500
  max_base: 131072              # memory bound (R10, peak under 2 GB): the doubled run may not exceed this many base rows;
                                # where it binds the run is reported as capped
shapley:                         # dependent inputs under the stated correlations (Task 4c)
  max_players_for_subsets: 14   # all-subset design up to this many inputs, else permutations
  n_var: 100000
  n_outer: 1000
  n_inner: 3
  n_perm: 500
  bootstrap: 500
  confidence: 0.95
dependence_check: true          # Task 4e: rerun the Shapley ranking under independence
# Which parameter-table key supplies each chain input (theory symbol -> lit/params.yaml key).
# The table holds alternatives under one symbol (framings, registered states, competing
# sources); the screen reads exactly the bound keys. A bound key that the table does not hold
# yet is an explicit gap of the run (named in the output), never a substitute value. Keys
# marked "pending W1" are the names this configuration expects W1 to add (cp3).
bindings:
  R-slurry:
    common:
      gamma_sl0: gamma_sl0_template
      gamma_sn0: gamma_sn0_template
      Delta_gamma_w: delta_gamma_w
      pH: ph_slurry                   # cp3 R8: pH 10-13 (unmodified slurries) primary
      pKa: pka_catechol               # cp3 R8: catechol pKa from catechol itself (ionic-strength flag below)
      Delta_G_site: delta_g_site
      Gamma_s: gamma_s_site_density
      delta_s: delta_s
      J0_het: j0_het
      gamma_ow: gamma_ow_alumina
      gamma_op: gamma_op
      # contract v3 speciation: a_Ca, a_CO3 and c_bulk are computed per draw from these
      I_ionic: ionic_strength_slurry
      rho_water: water_density
      pK1_carbonic: pk1_carbonic
      pK2_carbonic: pk2_carbonic
      K_CaCO3_aq: log10_k_caco3_aq
      K_CaHCO3: log10_k_cahco3
      K_CaOH: log10_k_caoh
      A_DH: debye_huckel_a            # W1 key (params.debye_huckel_A); gap_resolution.yaml binding_corrections
      b_D: davies_b
      I_val: davies_i_val
    by_framing:
      calcite: {gamma_nl: gamma_nl_calcite, V_m: v_m_calcite, K_sp: log10_ksp_calcite}
      ACC: {gamma_nl: gamma_nl_acc, V_m: v_m_acc, K_sp: log10_ksp_acc}
      # PH-W4.2e: aragonite is a K2 framing only (claims_redirect Section 11a); it has no registered gamma_nl, so no
      # nucleation link is formed for it. K_sp is the labelled alternative with a width (cp5b decides the older key).
      aragonite: {V_m: v_m_aragonite, K_sp: log10_ksp_aragonite_25c_i0}
    states:                           # registered R-slurry path (thresholds: worst_state, path_sum)
      slurry:
        T: t_slurry
        t_proc: t_proc_slurry
        _fixed: {a_w: 1.0}            # the wet slurry has a_w = 1 by the charter definition (P0-W5.2, F7)
      drying:
        T: t_drying_primary
        t_proc: t_drying_secondary
        a_w: a_w_slurry               # gap at 680a44b: the drying state is then not evaluable (R7(4))

# cp3 rulings R6 and R8 (planning chat 2026-10-17), as registrations of the run.
registrations:
  framings: [calcite, ACC]            # R6: both registered; falsified only under every framing
  # PH-W4.2: keys that no run reads. A test asserts that none of them is read.
  superseded_keys: {log10_ksp_aragonite: 'superseded, not read (replaced by log10_ksp_aragonite_25c_i0, which carries a width)'}
  # PH-W4.2e (claims_redirect Section 11a): the K2 framings of carbonate. Not the chain framings above: aragonite has no
  # nucleation inputs. required: false for ACC, reported beside calcite and aragonite with its dose window, never required to pass.
  k2_framings:
    calcite: {required: true}
    aragonite: {required: true}
    ACC: {required: false}            # reported beside the two, never required
  pH: {primary: ph_slurry, sensitivity: ph_slurry_modified}
  pKa: {key: pka_catechol, flag: 'stated at the ionic strength of its sources, not at the regime I; reported as a flag'}
  termination_weights: ignorance_mixture   # per-termination verdicts and the simplex, never a point weight
  truncate: {gamma_sl0: {low: 0.0}}   # gamma_sl0 >= 0; --untruncated reports the untruncated sensitivity
  # D27 (P0-W4.3b, gap_resolution.yaml AM3; thresholds block v4 decision.admissibility): the joint prior of
  # (gamma_sl0, Delta_G_seq, Gamma_s, delta_s) restricted to gamma_sl_insitu >= 0 at every registered state of a
  # design point; refused draws counted, never clipped or floored; M_adm printed beside C3, C4 and the deletion test
  admissibility: {rule: thresholds.decision.admissibility, links: [C3, C4], unrestricted_beside: true}
  R-cell:
    gated_phases: [CaCO3, corundum, boehmite]
    never_pass_sinks: [LiBOB, LiPCP]  # sink thermochemistry undetermined: never a pass
    schemes: {governing: expt, comparators: [janaf, mp]}
    phase_windows: {corundum: Al2O3}  # W5's window name for mp-1143 (gap_resolution.yaml AM2); boehmite has none
    benchmark_errors: results/preprint/pourbaix/c5/cell_scheme_table.json   # comparator rows only (AM2)
    margin_by_route:                  # cp3b A1 (gap_resolution.yaml c5.margin_mapping): one margin per reaction and sink
      expt: {key: thresholds.C5.window_margin_expt, applies_to: [{phase: CaCO3, sink: LiClO4, side: oxidation}]}
      dft_where_expt_missing: {key: thresholds.C5.window_margin, applies_to: [{phase: CaCO3, sink: LiClO4, side: oxidation}]}

# Design axes (gap policy (ii), cp3 R8: W5's grids). Values are design registrations, not
# literature values; axes given by a table key take its sourced points.
design_axes:
  Ca_T: {unit: mol dm^-3, values: [1.0e-6, 1.0e-5, 1.0e-4, 1.0e-3, 1.0e-2, 1.0e-1],
         source: 'P0-W5.2 provisional a_Ca grid, one point per decade, read as the total dissolved Ca dose'}
  C_T: {params: dic_slurry, at: [min, value, max]}
  Al_T: {unit: mol dm^-3, values: [1.0e-8, 1.0e-6, 1.0e-4], use: 'C5s_phase per W5 document and the Al-phase baseline; not in the speciation'}
  a_w: {state: drying, points: [{label: wet_film, value: 1.0, source: 'slurry state value (charter definition)'},
                                {label: dry_room_min, params: a_w_drying_secondary, at: min}],
        source: 'gap_resolution.yaml a_w_slurry: the primary drying film between the wet slurry and the dry-room activity'}
  E_cell_max: {classes: {LFP: e_cell_max_lfp, layered_NMC_NCA: e_cell_max_layered, LCO: e_cell_max_lco,
                         LMO: e_cell_max_lmo, LNMO: e_cell_max_lnmo},
               at: [min, value, max], keyed_to: 'cathode class (W1 rule G1)'}
  R_A_max: {params: r_a_max, at: [value]}     # cp3 R7(2): design axis; registration pending
  j_req: {params: j_req, at: [value]}         # cp3 R7(2): design axis; registration pending
  # PH-W4.2 (K2 grid of nacre.screen.k2_grid). pH and I are grid axes of the K2 maps: the minimum, central and maximum of their
  # table keys; the other chain inputs stay sampled. Design registrations, not literature values.
  pH: {params: ph_slurry, at: [min, value, max], unit: '1', source: 'ph_slurry range 10 to 13 (unmodified alkaline slurry)'}
  I_ionic: {params: ionic_strength_slurry, at: [min, value, max], unit: 'mol kg^-1', source: 'ionic_strength_slurry range'}
  # the acid-adjusted comparator state: the incumbent phosphoric-acid pH control, pH 4.5 to 8.5 in unit steps (session PH-W4.2); the
  # sourced key ph_slurry_acid_adjusted (6.3 to 9.0, four slurries) is printed beside it, never substituted
  pH_acid_adjusted: {values: [4.5, 5.5, 6.5, 7.5, 8.5], unit: '1', source: 'PH-W4.2 prompt: pH 4.5 to 8.5; key ph_slurry_acid_adjusted spans 6.3 to 9.0'}
  # the phosphate dose axis P_T: p_total_slurry is a design input with no admitted row (X1); the decade grid of Ca_T is used, a
  # design registration of this session and flagged for cp5b
  P_T: {unit: mol dm^-3, values: [1.0e-6, 1.0e-5, 1.0e-4, 1.0e-3, 1.0e-2, 1.0e-1],
        source: 'no sourced P_T: decade grid equal to the Ca_T grid, a design registration (PH-W4.2); flagged for cp5b'}

# Sizing rule (theory/thresholds.md, cp2; gap_resolution.yaml sizing): the decision layer starts at
# 2^14 draws per state and doubles until every band-mass half-width is at most 0.01, capped at the
# registered 2^20 draws per state and 6 h per run.
sizing:
  start: 16384
  band_mass_half_width_max: 0.01
  draw_cap: 1048576
  wall_clock_s: 21600

# Deletion-test controls (gap_resolution.yaml controls): the template inputs each drops, the
# surface it binds and the aux uniforms of its ignorance priors; a control without inputs is a gap.
controls:
  bare_oxide:
    drop: [gamma_sl0, gamma_p, K_Ca_catecholate, Delta_G_site, Gamma_s, delta_s, rho_L, r_Ca, d_layer, pKa,
           W_adh_wet, gamma_ow, gamma_op]
    bind: {gamma_o: gamma_o_alumina, gamma_w: gamma_w,
           gamma_nv: {calcite: gamma_nv_calcite, ACC: gamma_nv_acc_calcite_analog}}
    aux: [u_gamma_sl]
  PVDF:
    gap: 'no PVDF dry surface energy key in lit/params.yaml: no ignorance bound can be formed (gap_resolution.yaml)'

# Thresholds block v2, C5s.control: the Omega test must report dissolution at W5's registered
# undersaturated control state and stability at its supersaturated one (P0-W5.2, Task B).
omega_control:
  source: P0-W5.2 falsifiability control (calcite)
  states:
    undersaturated:
      pH: {params: ph_slurry_modified, at: min}
      C_T: {params: dic_slurry, at: min}
      Ca_T: {value: 1.0e-6, unit: mol dm^-3}
    supersaturated:
      pH: {value: 12.0}
      C_T: {params: dic_slurry, at: value}
      Ca_T: {value: 1.0e-1, unit: mol dm^-3}

# PH-W4.2: the second falsifiability corner. The same low-dose corner (Ca_T and C_T minima of omega_control.undersaturated) in the
# UNMODIFIED alkaline slurry, scanned over the pH range of ph_slurry (10 to 13) in steps; it shows where undersaturation sets in
# and is reported beside the gating controls, never gating.
omega_control_unmodified:
  pH: {params: ph_slurry, step: 0.25}
  Ca_T: {value: 1.0e-6, unit: mol dm^-3}
  C_T: {params: dic_slurry, at: min}

# Phosphate K2 (PH-W4.2): the slurry-stage phases of W5's ladder. nu: exponents of the ion activity product of the formula unit
# of the K_sp key (activities a_Ca, a_PO4, a_HPO4, a_OH of the registered phosphate speciation; a_H = 10^-pH); n_hyd: structural
# water (a_w^n; the term is zero at a_w = 1). ksp: null = no K_sp key in lit/params.yaml, the row is undetermined.
k2_phases:
  hap:  {ladder: HAp,  formula: Ca5(PO4)3OH, ksp: log10_ksp_hap, nu: {a_Ca: 5, a_PO4: 3, a_OH: 1}, n_hyd: 0}
  acp:  {ladder: ACP,  formula: 'Ca3(PO4)2.nH2O', ksp: log10_ksp_acp, nu: {a_Ca: 3, a_PO4: 2}, n_hyd_key: n_hyd_acp}
  ocp:  {ladder: OCP,  formula: 'Ca8H2(PO4)6.5H2O', ksp: log10_ksp_ocp, nu: {a_Ca: 8, a_PO4: 6, a_H: 2}, n_hyd: 5}
  btcp: {ladder: b-TCP, formula: Ca3(PO4)2, ksp: log10_ksp_btcp, nu: {a_Ca: 3, a_PO4: 2}, n_hyd: 0}
  brushite: {ladder: brushite, formula: 'CaHPO4.2H2O', ksp: null, nu: {}, note: 'no brushite K_sp key in lit/params.yaml'}
  atcp: {ladder: a-TCP, formula: alpha-Ca3(PO4)2, ksp: null, nu: {}, note: 'no alpha-TCP K_sp key in lit/params.yaml'}
  li3po4: {ladder: Li3PO4, formula: Li3PO4, ksp: null, nu: {}, note: 'no Li3PO4 K_sp key in lit/params.yaml (a competing phase of K3, not a Ca phosphate)'}
# Falsifiability controls of the phosphate K2: the low-dose corner (Ca_T and P_T minima, lowest pH of ph_slurry_modified) must
# report dissolution, the supersaturated state stability.
k2_controls_phosphate:
  undersaturated:
    Ca_T: {value: 1.0e-6, unit: mol dm^-3}
    P_T: {value: 1.0e-6, unit: mol dm^-3}
    pH: {params: ph_slurry_modified, at: min}
  # the supersaturated state sits at the central pH of ph_slurry_acid_adjusted: octacalcium phosphate (an acid phase) is not
  # supersaturated at pH 12 even at 0.1 mol dm^-3, so a pH 12 state would not be a supersaturated control for it (a pre-run
  # correction after a dry run, disclosed in the PH-W4.2 report; the dry-run output is not reported)
  supersaturated:
    Ca_T: {value: 1.0e-1, unit: mol dm^-3}
    P_T: {value: 1.0e-1, unit: mol dm^-3}
    pH: {params: ph_slurry_acid_adjusted, at: value}

# Prior sets, selectable per run (--prior-set) and labelled in every output (cp3 R8, gap policy).
prior_sets:
  table: {}
  ignorance:                          # theory/ignorance_priors.md: uniform on [0, sum of the dry energies]
    # the ACC gamma_nv is W1's flagged calcite analog (gap_resolution.yaml gamma_nv_acc)
    gamma_sn0: {bounds: {gamma_p: gamma_p_pda, gamma_nv: {calcite: gamma_nv_calcite, ACC: gamma_nv_acc_calcite_analog}}}
    gamma_ow: {bounds: {gamma_o: gamma_o_alumina, gamma_w: gamma_w}}
    gamma_op: {bounds: {gamma_o: gamma_o_alumina, gamma_p: gamma_p_pda}}
    delta_s: {bounds: {d_layer: template_layer_thickness}}   # geometric, 4 and 4a.4 (2 r_Ca dropped while r_Ca is a gap)
    analogs:                          # flagged analogs (gap_resolution.yaml), each labelled in the output
      K_Ca_catecholate: log10_k_ca_catecholate        # Delta_G_site (standard-state conversion in the chain)
      rho_L: template_group_density_site_analog       # the analog Gamma_s cap rho_L d_layer: flagged, never refused
      W_adh_wet: w_adh_wet_catechol_oxide_analog      # C1 side by side
    drop: [Delta_G_site]              # computed by the PMF study (absent); the analog supplies it
    analog_route:                     # thresholds C2.analog_route (AM3): the two-proton cycle of the catecholate constant
      pKa2: pka2_catechol
  analog:                             # flagged analog priors, run side by side; none registered yet
    bindings: {}

# ---------------------------------------------------------------------------------------------------------------
# Redirected screen (PH-W4.1, 2026-10-20). Structure only; nothing here is a prior, a threshold or a verdict rule.
# Mineral objects of the generic screen chain (nacre.screen.mineral). Stoichiometry is the formula unit of
# contract v5 (theory/contract.yaml, conventions.stoichiometry); every number of a mineral (K_sp, V_m, gamma_nl,
# gamma_nv, the structural water n) is a parameter-table key, to be registered by W1 (PH-W1.2) and frozen at cp5.
# Two framings of one candidate phase share k1_phase: the K1 ladder carries one row per framing.
minerals:
  hap:
    formula_unit: Ca5(PO4)3OH
    framing: apatite
    k1_phase: HAp                  # the phase name of W5's ladder
    phase_state: crystalline
    speciation: phosphate
    x_symbol: a_PO4
    y_symbol: a_OH
    stoichiometry: {nu_ca: 5, nu_x: 3, nu_y: 1, n_hyd: 0}
    keys: {ksp: log10_ksp_hap, v_m: v_m_hap}
    gamma_keys: {gamma_nl: gamma_nl_hap, gamma_nv: gamma_nv_hap}
  acp:
    formula_unit: Ca3(PO4)2.nH2O
    framing: ACP
    k1_phase: HAp                  # ACP and apatite are both registered nucleus framings of the candidate HAp
    phase_state: amorphous
    speciation: phosphate
    x_symbol: a_PO4
    stoichiometry: {nu_ca: 3, nu_x: 2, nu_y: 0, n_hyd: 0}     # n is read from the table (acp_hydration_n)
    keys: {ksp: log10_ksp_acp, v_m: v_m_acp, n_hyd: acp_hydration_n}
    gamma_keys: {gamma_nl: gamma_nl_acp, gamma_nv: gamma_nv_acp}
  capoly:
    formula_unit: Ca(PO3)2           # PLACEHOLDER of the condensed-phosphate class: shows that the path runs, registers nothing
    framing: amorphous glass
    k1_phase: Ca(PO3)2 / Ca-polyphosphate glass
    phase_state: amorphous
    speciation: null                 # no condensed-phosphate speciation in contract v5: the anion activity is an input
    x_symbol: a_PO3
    chain_length_n: 10               # PLACEHOLDER chain length, not a registered value
    stoichiometry: {nu_ca: 1, nu_x: 2, nu_y: 0, n_hyd: 0}
    keys: {ksp: log10_ksp_cameta, v_m: v_m_cameta}
    gamma_keys: {gamma_nl: gamma_nl_cameta, gamma_nv: gamma_nv_cameta}
    inputs: {a_Ca: a_ca_cameta, a_PO3: po3_activity_cameta, c_bulk: ca_bulk_cameta}   # supplied activities (no speciation)

# K evaluators (nacre.screen.kscreen). Every value is a PLACEHOLDER marked provisional: PH-W3.2 sets the numbers
# and they are frozen at cp5. p_cred and p_deg repeat the registered conventions of theory/thresholds.md (cp2 ruling)
# so that the evaluators run before the freeze; m_cos and m_S are the zero-margin edges of the same block.
k_screen:
  provisional: true
  k1_ladder: results/preprint/pourbaix/ph_w52/ladder_v3.csv   # W5's v3 ladder (framing, stage, E_ub/E_lb, one verdict column per cutoff class): an input path, read and never recomputed
  p_cred: 0.9                        # provisional (thresholds.decision.credible_level primary)
  p_deg: 0.1                         # provisional, 1 - p_cred
  m_cos: 0.0                         # provisional (thresholds.C3.margin_cos_theta primary)
  m_S: 0.0                           # provisional (thresholds.C4.margin_S_spread; W1 sets it)
  admissible: true                   # D27 restriction on K3, K4 and the deletion test; M_adm printed
  ln_dose_axis: [-2.0, -1.0, 0.0, 1.0, 2.0]    # provisional design grid: ln of the total dose at fixed Ca:P ratio
