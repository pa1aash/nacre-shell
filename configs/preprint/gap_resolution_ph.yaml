# ---------------------------------------------------------------- route layer (PH-W4.2a; contract v6, claims_redirect.md Section 9)
# Evaluated by nacre.screen.routes (K2h, R1, R2, wetting, framing, matrix, baselines) and nacre.screen.ph_rows (stage rows,
# conversion rows, the F5 panel). A treatment is filled only where a decision table of Section 9 already says what a
# missing key does; every other slot reads "to register at cp5 freeze". Names: Section 9g and the lit/params.yaml keys.
route_layer:
  evaluators: [hydrolysis_descriptor, formation_accessibility, liquid_precursor_wetting]
  hydrolysis:                            # K2h, table H1 to H4 (ruling C1)
    hydrolysis_polyp_k_ph7_to_13: {symbol: k_hydrolysis, links: [K2h], treatment: to register at cp5 freeze, note: 'a pH-range rate (7 to 13) under a symbol the contract does not have (k_hyd)'}
    rows_read_as_ranges:                 # sourced rate constants; the plausible range of a row is its prior support (9a)
      - hydrolysis_polyp_k_ph6
      - hydrolysis_polyp_k_ph6_ca1mm
      - hydrolysis_polyp_k_ph8
      - hydrolysis_polyp_k_ph8_ca1mm
    derived_not_read: [hydrolysis_polyp_half_life_<state>, hydrolysis_ca_enhancement_ph6, hydrolysis_ca_enhancement_ph8]
    context_not_a_covered_row: [hydrolysis_pp_half_life_100c_ph10]
    hydrolysis_row_conditions: {links: [K2h], treatment: to register at cp5 freeze, note: 'pH, Ca2+ level and temperature of each measured row (from each key''s source); a row without them covers no state (H1)'}
    hydrolysis_transfer_factor: {symbol: tau_k, links: [K2h], treatment: to register at cp5 freeze, effect_if_absent: 'a covered state is undetermined (named gap)'}
    hydrolysis_f_min: {symbol: f_min, links: [K2h], treatment: to register at cp5 freeze, effect_if_absent: 'a covered state is undetermined (named gap)'}
    hydrolysis_t_wet_r1: {symbol: t_wet, links: [K2h], treatment: to register at cp5 freeze, effect_if_absent: 'a covered state is undetermined (named gap)'}
    hydrolysis_t_wet_r2: {symbol: t_wet, links: [K2h], treatment: to register at cp5 freeze, effect_if_absent: 'a covered state is undetermined (named gap)'}
    hydrolysis_t_wet_r3: {symbol: t_wet, links: [K2h], treatment: to register at cp5 freeze, effect_if_absent: 'a covered state is undetermined (named gap)'}
    hydrolysis_a_w_dry: {symbol: a_w_dry, links: [K2h], treatment: to register at cp5 freeze}
    hydrolysis_temperature_tolerance: {links: [K2h], treatment: unresolved, effect: 'no state is covered: H1 undetermined, never gating (claims_redirect.md 9a)'}
    hydrolysis_polyp_25c_literature_halflife: {symbol: t_half_hyd, links: [K2h], treatment: unresolved, effect: 'context only; not a covered row (9a coverage)'}
  r1:                                    # K3 route form, table F1r to F4r (ruling C2)
    polyp_log10_ksp_al: {symbol: K_sp_AlPP, links: [K3, K2], treatment: unresolved, effect: 'F1r: R1 undetermined with the flip value K_sp* = IAP_AlPP printed'}
    polyp_al_log_beta1_linear: {symbol: beta_AlPP, links: [K3], treatment: unresolved, effect: 'evaluated at beta_AlPP = 0 (upper bound on a_PP), flagged complexation gap: F2r stands, F3r labelled optimistic (9b, I12)'}
    polyp_al_log_beta1_linear_chain_unit_w15: {symbol: beta_AlPP, links: [K3], treatment: unresolved, effect: 'PH-W1.5 gap key, same quantity as polyp_al_log_beta1_linear: evaluated at beta_AlPP = 0 (upper bound on a_PP), flagged complexation gap (9b, I12)'}
    polyp_al_log_beta1_cyclo: {keys: [polyp_al_log_beta1_cyclo_p3, polyp_al_log_beta1_cyclo_p4, polyp_al_log_beta1_cyclo_p6, polyp_al_log_beta1_cyclo_p8], links: [K3], treatment: to register at cp5 freeze, note: 'whether ring constants apply to the registered chain distribution is not decided'}
    polyp_chain_distribution: {symbol: n_chain, links: [K3], treatment: to register at cp5 freeze}
    polyp_al_activity_pit: {symbol: a_Al, links: [K3], treatment: unresolved, effect: 'the pit-state row is undetermined; the oxide-equilibrium row is unaffected (the two are never combined)'}
    gel_kinetics: {links: [K3], treatment: unresolved, effect: 'gelation against hydrolysis stays a labelled hypothesis (ruling C2)'}
    descriptors: [polyp_chain_length_material]
  r2:                                    # K3 route form, table B1 to B4; K4 route form (ruling C3)
    coacervate_binodal_map: {links: [K3], treatment: unresolved, effect: 'B1: R2 undetermined at every state'}
    coacervate_pH_window: {symbol: pH, links: [K3], treatment: to register at cp5 freeze}
    coacervate_gamma_s0_dilute: {symbol: gamma_al_l0, links: [K4], treatment: unresolved, effect: 'with coacervate_gamma_s0_dense: the site-free difference is a gap; K4 route form undetermined unless a contact angle exists (9c, I13)'}
    coacervate_gamma_s0_dense: {symbol: gamma_al_n0, links: [K4], treatment: unresolved, effect: 'as coacervate_gamma_s0_dilute'}
    coacervate_contact_angle_alumina: {links: [K4], treatment: unresolved, effect: 'no alternative route to Dgamma = gamma_nl cos(theta)'}
    coacervate_gamma_nl: {symbol: gamma_nl_c, links: [K4], treatment: unresolved, effect: 'the negligible-gamma_nl limit of ruling C3 is evaluated and labelled; the flip value reads m_S + gamma_nl (gap)'}
    coacervate_gamma_analog: {symbol: gamma_nl_c, links: [K4], treatment: to register at cp5 freeze, note: 'whether the flagged analog enters the comparable-gamma_nl limit is not decided'}
    polyp_ads_alumina_gamma_max: {symbol: Gamma_P, links: [K4], treatment: to register at cp5 freeze, note: 'admissibility of gamma_sl and gamma_sn only (the site term cancels in Dgamma)'}
    polyp_ads_alumina_k_langmuir: {symbol: K_P, links: [K4], treatment: to register at cp5 freeze, note: 'admissibility only'}
    polyp_ads_alumina_layer_thickness: {symbol: delta_P, links: [K4], treatment: to register at cp5 freeze, note: 'admissibility only'}
    descriptors: [coacervate_ca_threshold, coacervate_onset_volume, coacervate_ca_to_polyp_ratio, coacervate_viscosity]
  products:                              # K2 and the amorphous framing of the route products (ruling C4, cp4 F3)
    polyp_log10_ksp_cameta: {symbol: K_sp, links: [K2], treatment: unresolved, effect: 'K2 of the Ca-polyphosphate glass not evaluable: undetermined'}
    glass_crystal_correction_<P>: {symbol: Delta_G_gc, links: [K1, K2], treatment: to register at cp5 freeze, note: 'the bounded, labelled correction of cp4 F3 (PH-W3.2 sets the bound); the W1 key carries an enthalpy (H_phase), the contract a free energy'}
    glass_dfh_alpp_gel: {links: [K1], treatment: to register at cp5 freeze}
    s0_cameta_glass: {symbol: S_std, links: [K1, K2], treatment: unresolved, effect: 'PH-W1.5 gap (no measurement of Ca(PO3)2 glass): no glass-direct entropy; the glass framing keeps the crystalline value plus the bounded labelled correction (claims_redirect.md 10b), whose bound is registered at cp5'}
    h_cryst_cameta_glass: {symbol: H_phase, links: [K1, K2], treatment: unresolved, effect: 'PH-W1.5 gap (no crystallisation enthalpy of Ca(PO3)2 glass): as s0_cameta_glass; the enthalpy of glass_crystal_correction_cameta is not replaced'}
  k1_bracket:                            # K1 lower bound E_lb (cp4 F2, ruling 10c): the transfer premise needs these keys
    transfer_free_energy_ca_water_pc: {symbol: Delta_G_tr_rel, links: [K1], treatment: unresolved, effect: 'E_lb pending and no K1 pass possible (the ladder reads E_lb as pending); the verdict is falsified, inconclusive or undetermined only'}
    transfer_free_energy_al_water_pc: {symbol: Delta_G_tr_rel, links: [K1], treatment: unresolved, effect: 'E_lb pending and no K1 pass possible (the ladder reads E_lb as pending); the verdict is falsified, inconclusive or undetermined only'}
