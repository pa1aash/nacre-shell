# Gap-resolution skeleton of the phosphate screen (PH-W4.1, redirect D34 to D40). SKELETON: it lists every key the
# phosphate screen needs and fills the treatment slot ONLY where a rule is already registered; every other key
# reads "to register at cp5 freeze". It registers no number and no prior, and it is committed before any
# production output exists (rule R7). The carbonate table (configs/preprint/gap_resolution.yaml) is not edited.
#
# Treatments (as in the carbonate table, nacre.screen.gaps.TREATMENTS):
#   ignorance    a bounded ignorance prior whose bounds are the expressions of theory/ignorance_priors.md;
#   analog       a flagged analog prior (a W1 key with role analog); verdicts that rest on it are labelled;
#   design_axis  a design axis over a registered grid (the verdict is reported per point);
#   unresolved   no admissible treatment exists in P0: the test that needs the key reports a gap (inconclusive);
#   to register at cp5 freeze   the slot is empty: PH-W1.2 (parameter table) and PH-W3.2 (margins, priors) fill it before the cp5 freeze.
# Key names are those of theory/claims_redirect.md Section 7; the mineral objects that read them are the `minerals`
# block of configs/preprint/screen.yaml. No value appears in this file.
version: 2
session: PH-W4.2a (route keys; version 1 PH-W4.1)
status: skeleton
written_before_production_output: true
pending_label: to register at cp5 freeze
authority: {names: theory/claims_redirect.md Section 7, rules: [theory/ignorance_priors.md, theory/claims_redirect.md, ops/tracks/redirect_plan.md],
            carbonate_table: configs/preprint/gap_resolution.yaml}
reporting:
  ignorance_is_finding: false            # ignorance_priors.md section 3.1
  admissibility_label: 'conditional on admissibility (M_adm printed beside)'
  unresolved_counts_as: inconclusive
  k1_undetermined_never_passes: true     # claims_redirect.md 2a
  provisional_margins: configs/preprint/screen.yaml k_screen (placeholders; PH-W3.2 sets the numbers)

# ---------------------------------------------------------------- per-phase keys (K2, K3, K4)
# One block per registered framing. Each key is read by the mineral object of the same name in screen.yaml.
keys:
  # hap: Ca5(PO4)3OH, crystalline apatite framing; K1 phase HAp
  log10_ksp_hap: {symbol: K_sp, links: [K2, K3], mineral: hap, treatment: to register at cp5 freeze}
  v_m_hap: {symbol: V_m, links: [K3], mineral: hap, treatment: to register at cp5 freeze}
  gamma_nl_hap: {symbol: gamma_nl, links: [K3, K4], mineral: hap, treatment: to register at cp5 freeze}
  gamma_nv_hap: {symbol: gamma_nv, links: [K3, K4], mineral: hap, treatment: to register at cp5 freeze}
  # acp: amorphous calcium phosphate framing of the candidate HAp; K1 phase HAp
  log10_ksp_acp: {symbol: K_sp, links: [K2, K3], mineral: acp, treatment: to register at cp5 freeze}
  v_m_acp: {symbol: V_m, links: [K3], mineral: acp, treatment: to register at cp5 freeze}
  gamma_nl_acp: {symbol: gamma_nl, links: [K3, K4], mineral: acp, treatment: to register at cp5 freeze}
  gamma_nv_acp: {symbol: gamma_nv, links: [K3, K4], mineral: acp, treatment: to register at cp5 freeze}
  # ocp: octacalcium phosphate; K1 phase OCP
  log10_ksp_ocp: {symbol: K_sp, links: [K2, K3], mineral: ocp, treatment: to register at cp5 freeze}
  v_m_ocp: {symbol: V_m, links: [K3], mineral: ocp, treatment: to register at cp5 freeze}
  gamma_nl_ocp: {symbol: gamma_nl, links: [K3, K4], mineral: ocp, treatment: to register at cp5 freeze}
  gamma_nv_ocp: {symbol: gamma_nv, links: [K3, K4], mineral: ocp, treatment: to register at cp5 freeze}
  # btcp: beta tricalcium phosphate; K1 phase b-TCP
  log10_ksp_btcp: {symbol: K_sp, links: [K2, K3], mineral: btcp, treatment: to register at cp5 freeze}
  v_m_btcp: {symbol: V_m, links: [K3], mineral: btcp, treatment: to register at cp5 freeze}
  gamma_nl_btcp: {symbol: gamma_nl, links: [K3, K4], mineral: btcp, treatment: to register at cp5 freeze}
  gamma_nv_btcp: {symbol: gamma_nv, links: [K3, K4], mineral: btcp, treatment: to register at cp5 freeze}
  # capp: calcium pyrophosphate; K1 phase Ca2P2O7
  log10_ksp_capp: {symbol: K_sp, links: [K2, K3], mineral: capp, treatment: to register at cp5 freeze}
  v_m_capp: {symbol: V_m, links: [K3], mineral: capp, treatment: to register at cp5 freeze}
  gamma_nl_capp: {symbol: gamma_nl, links: [K3, K4], mineral: capp, treatment: to register at cp5 freeze}
  gamma_nv_capp: {symbol: gamma_nv, links: [K3, K4], mineral: capp, treatment: to register at cp5 freeze}
  # cameta: calcium metaphosphate (condensed-phosphate class); K1 phase Ca(PO3)2
  log10_ksp_cameta: {symbol: K_sp, links: [K2, K3], mineral: cameta, treatment: to register at cp5 freeze}
  v_m_cameta: {symbol: V_m, links: [K3], mineral: cameta, treatment: to register at cp5 freeze}
  gamma_nl_cameta: {symbol: gamma_nl, links: [K3, K4], mineral: cameta, treatment: to register at cp5 freeze}
  gamma_nv_cameta: {symbol: gamma_nv, links: [K3, K4], mineral: cameta, treatment: to register at cp5 freeze}
  acp_hydration_n: {symbol: n_hyd, links: [K2, K3], mineral: acp, treatment: to register at cp5 freeze}
  n_hyd_ocp: {symbol: n_hyd, links: [K2, K3], mineral: ocp, treatment: to register at cp5 freeze}

# ---------------------------------------------------------------- template and nucleus inputs with a registered rule
inputs_with_rule:
  gamma_sn0_phosphate:
    symbol: gamma_sn0
    links: [K3, K4]
    treatment: ignorance
    prior: uniform
    low: '0'
    high: gamma_p + gamma_nv
    bound_from: theory/ignorance_priors.md 1a (dry work of adhesion >= 0; interface stability), claims_redirect.md 5 (gamma_sn prior)
    inputs: {gamma_p: gamma_p_pda, gamma_nv: 'per mineral: gamma_nv_<P> (pending, see keys)'}
    per_draw: true
  delta_gamma_w:
    symbol: Delta_gamma_w
    links: [K3, K4]
    treatment: ignorance
    value_rule: '0: the prior is placed on the total contact energy (theory/ignorance_priors.md 1b)'
  delta_s:
    symbol: delta_s
    links: [K3, K4]
    treatment: ignorance
    bound_from: theory/ignorance_priors.md 4 and 4a.4 (geometric prior on [Gamma_s V_m, d_layer])
    inputs: {d_layer: template_layer_thickness, V_m: 'per mineral: v_m_<P> (pending)'}
  bare_oxide_control:
    links: [K3, K4]
    treatment: ignorance
    gamma_sl: {prior: uniform, low: '0', high: gamma_o + gamma_w, bound_from: theory/ignorance_priors.md 1c}
    gamma_sn: {prior: uniform, low: '0', high: gamma_o + gamma_nv, bound_from: the bound rule of ignorance_priors.md 1a on the oxide-nucleus contact}
    note: 'same control as the carbonate screen; gamma_nv per phosphate mineral pending'
  PVDF_control:
    links: [K3, K4]
    treatment: unresolved
    effect: 'no PVDF dry surface energy key: the PVDF control is not evaluable (carbonate table, controls.PVDF)'
  competing_phases:
    symbol: K_sp
    links: [K3]
    phases: [Li3PO4, AlPO4, 'other calcium phosphates']
    treatment: unresolved
    effect: 'no sourced K_sp in this table: the competing-phase saturation of the K3 row is reported as not evaluated (claims_redirect.md 3b)'
  gamma_nv_analog:
    symbol: gamma_nv
    links: [K3, K4]
    treatment: "to register at cp5 freeze"
    note: 'the ACC framing of the carbonate screen used a flagged calcite analog; whether a phosphate analog is registered is not decided'
shared_with_carbonate:                   # keys the phosphate screen reads unchanged; their treatments are those of gap_resolution.yaml
  - gamma_sl0_template
  - delta_g_site
  - pka_catechol
  - pka2_catechol
  - gamma_s_site_density
  - j0_het
  - t_proc_slurry
  - patch_area
  - template_layer_thickness
  - gamma_p_pda
  - gamma_o_alumina
  - gamma_w
  - debye_huckel_a
  - davies_b
  - davies_i_val
  - water_density
  - log10_k_caoh
  - ionic_strength_slurry

