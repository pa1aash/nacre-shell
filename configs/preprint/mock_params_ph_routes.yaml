  hydrolysis_t_wet_r2: {symbol: t_wet, transform: none, unit: s, regimes: [R-slurry], status: design-input, prior: {family: fixed, value: 86400.0}, sources: []}
  hydrolysis_t_wet_r3: {symbol: t_wet, transform: none, unit: s, regimes: [R-slurry], status: design-input, prior: {family: fixed, value: 600.0}, sources: []}
  matrix_baseline_tsinghua_film_thickness: {symbol: d_film, transform: none, unit: m, regimes: [R-slurry], status: single-source, prior: {family: fixed, value: 2.0e-8}, sources: []}
# design states of the dry runs (mock): pH and Ca2+ level of the slurry (ca_mM; also Ca_T of the R2 binodal state,
# 1 mM = 1 mol m^-3), a drying flag
design:
  R1: [{pH: 5.0, ca_mM: 0.0}, {pH: 7.0, ca_mM: 0.0}, {pH: 9.0, ca_mM: 0.0}]
  R2: [{pH: 7.0, ca_mM: 1.0}, {pH: 7.0, ca_mM: 5.0}]
  R3: [{pH: 7.0, ca_mM: 1.0}, {pH: 7.0, ca_mM: 1.0, drying: true}]
# mock coacervate binodal map: the covered region and the two-phase region (units of the state draws)
maps:
  coacervate_binodal_map:
    covered: {Ca_T: [1.0, 50.0], P_T: [1.0, 50.0], I_ionic: [0.01, 0.2]}
    two_phase: {Ca_T: [4.0, 50.0], P_T: [4.0, 50.0]}
