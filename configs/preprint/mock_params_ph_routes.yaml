  polyp_ads_alumina_gamma_max: {symbol: Gamma_P, transform: none, unit: mol m^-2, regimes: [R-slurry], status: single-source, prior: {family: uniform, low: 1.0e-6, high: 3.0e-6}, sources: []}
  polyp_ads_alumina_k_langmuir: {symbol: K_P, transform: none, unit: "1", regimes: [R-slurry], status: single-source, prior: {family: loguniform, low: 1.0e+2, high: 1.0e+4}, sources: []}
