# MOCK PARAMETER TABLE of the route-layer dry runs (PH-W4.2a), in the layout of lit/params.yaml.
# Synthetic round numbers chosen only to lie inside each input's physical domain and to exercise every branch of
# the route evaluators (nacre.screen.routes: K2h, R1, R2, coacervate wetting; nacre.screen.ph_rows: stage rows,
# baselines). They are not literature values, carry no physical meaning, register no parameter of the redirected
# screen and never feed a reported result: the adapter refuses this file unless allow_mock / --mock is given, and
# the dry runs write only under results/preprint/screen/dryrun_ph/ (git-ignored). Symbols are the contract v6 ids
# (theory/contract.yaml); units are SI. `rows`, `design` and `maps` are mock-only structures of the dry run.
mock: true
meta: {session: PH-W4.2a, note: synthetic route-layer dry-run table}
params:
  temperature: {symbol: T, transform: none, unit: K, regimes: [R-slurry], status: design-input, prior: {family: fixed, value: 298.15}, sources: []}
  water_activity: {symbol: a_w, transform: none, unit: "1", regimes: [R-slurry], status: design-input, prior: {family: uniform, low: 0.95, high: 1.0}, sources: []}
  # R1: Al3+-triggered gelation
  polyp_al_log_k_oxide: {symbol: K_ox_Al, transform: log10, unit: "1", regimes: [R-slurry], status: computed, prior: {family: uniform, low: 7.0, high: 9.0}, sources: []}
  polyp_al_activity_pit: {symbol: a_Al, transform: none, unit: "1", regimes: [R-slurry], status: single-source, prior: {family: loguniform, low: 1.0e-6, high: 1.0e-4}, sources: []}
