  hydrolysis_polyp_k_ph8: {symbol: k_hyd, transform: none, unit: s^-1, regimes: [R-slurry], status: single-source, prior: {family: uniform, low: 4.0e-8, high: 6.0e-8}, sources: [], conditions: {pH: 8.0, ca_mM: 0.0}}
  hydrolysis_polyp_k_ph8_ca1mm: {symbol: k_hyd, transform: none, unit: s^-1, regimes: [R-slurry], status: single-source, prior: {family: uniform, low: 3.0e-7, high: 5.0e-7}, sources: [], conditions: {pH: 8.0, ca_mM: 1.0}}
