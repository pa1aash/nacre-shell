  polyp_nu_pp_mock: {symbol: nu_PP, transform: none, unit: "1", regimes: [R-slurry], status: registered, prior: {family: fixed, value: 3.0}, sources: []}
  polyp_log10_ksp_al: {symbol: K_sp_AlPP, transform: log10, unit: "1", regimes: [R-slurry], status: single-source, prior: {family: uniform, low: -40.0, high: -30.0}, sources: []}
