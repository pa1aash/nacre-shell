# MOCK PARAMETER TABLE of the phosphate dry runs (PH-W4.1), in the layout of lit/params.yaml.
# Synthetic round numbers chosen only to lie inside each input's physical domain and to exercise every path of the
# mineral chain (phosphate speciation, K2, K3, K4, the deletion test). They are not literature values, carry no
# physical meaning, register no parameter of the redirected screen and never feed a reported result: the adapter
# refuses this file unless allow_mock / --mock is given, and the dry runs write only under
# results/preprint/screen/dryrun_ph/ (git-ignored). Keys named *_hap, *_acp, *_cameta belong to one mineral of
# configs/preprint/screen.yaml `minerals`; keys named ctl_* belong to the bare-oxide control only.
